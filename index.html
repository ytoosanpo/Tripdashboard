<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TRIP_DASH. | OFFICIAL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        :root {
            --bg-black: #0d0f11;
            --card-gray: #1c2126;
            --text-main: #ffffff;
            --text-sub: #8e8e93;
            --gold: #d4af37;
            --alert-red: #e74c3c;
            --success-green: #2ecc71;
            --rakuten-red: #bf0000;
            --jalan-orange: #f39c12;
            --ikyu-gold: #8e774a;
            --header-h: 120px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { background: var(--bg-black); color: var(--text-main); font-family: -apple-system, sans-serif; padding-top: var(--header-h); }

        /* EMERGENCY BANNER */
        #emergency-banner {
            display: none; position: fixed; top: 0; left: 0; width: 100%;
            background: var(--alert-red); color: #fff; padding: 8px 10px;
            font-size: 10px; font-weight: 900; text-align: center; z-index: 10000;
        }

        /* HEADER & NAV */
        header {
            position: fixed; top: 0; left: 0; width: 100%;
            background: rgba(13, 15, 17, 0.95); backdrop-filter: blur(10px);
            z-index: 9000; border-bottom: 1px solid #2a2a2a;
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; }
        .logo { font-weight: 900; color: var(--gold); font-size: 20px; letter-spacing: 2px; }
        
        .refresh-btn {
            width: 38px; height: 38px; border-radius: 10px; border: 1px solid rgba(212,175,55,0.3);
            color: var(--gold); display: flex; align-items: center; justify-content: center; 
            background: rgba(212, 175, 55, 0.05); cursor: pointer; transition: 0.2s;
        }
        .refresh-btn.success { border-color: var(--success-green); color: var(--success-green); background: rgba(46,204,113,0.1); }
        .spin { animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        nav { display: flex; justify-content: center; align-items: center; gap: 8px; padding: 0 10px 12px; overflow-x: auto; }
        nav::-webkit-scrollbar { display: none; }
        .nav-link {
            font-size: 11px; font-weight: 900; color: var(--text-main); text-decoration: none; text-transform: uppercase;
            background: rgba(255, 255, 255, 0.05); padding: 8px 14px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); flex-shrink: 0;
        }

        /* SALE BANNER SYSTEM */
        #sale-banner {
            display: none; width: 100%; max-width: 800px; margin: 0 auto 15px;
            border-radius: 12px; padding: 12px; position: relative; overflow: hidden;
            text-decoration: none; cursor: pointer;
        }
        .sale-today { background: linear-gradient(135deg, #8a6e2f 0%, #d4af37 50%, #8a6e2f 100%); color: #000; }
        .sale-rakuten-day { background: linear-gradient(135deg, var(--rakuten-red) 0%, #d4af37 100%); color: #fff; }
        .sale-preview { background: linear-gradient(135deg, #1c2126 0%, #2c3e50 100%); border: 1px solid var(--gold); color: var(--gold); }
        .sale-today::after, .sale-rakuten-day::after {
            content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(30deg); animation: flash 3.5s infinite;
        }
        @keyframes flash { 0% { left: -100%; } 20% { left: 100%; } 100% { left: 100%; } }
        .sale-content { display: flex; justify-content: center; align-items: center; gap: 10px; position: relative; z-index: 2; }
        .sale-text { font-size: 11px; font-weight: 900; letter-spacing: 0.5px; text-align: center; }

        /* CONTAINER & SECTIONS */
        .container { padding: 15px; max-width: 800px; margin: 0 auto; }
        .section-header { display: flex; align-items: center; margin: 25px 0 15px; }
        .section-title { font-size: 11px; font-weight: 900; color: var(--gold); letter-spacing: 1.5px; }
        .section-line { height: 1px; background: linear-gradient(90deg, var(--gold), transparent); width: 100%; margin-left: 10px; opacity: 0.4; }
        
        /* HUB GRID */
        .hub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .hub-card { background: var(--card-gray); border-radius: 14px; padding: 15px; border: 1px solid #2a2a2a; min-height: 100px; cursor: pointer; }
        .hub-label { font-size: 10px; color: var(--text-sub); margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
        .hub-val { font-size: 14px; font-weight: 900; display: flex; align-items: center; gap: 6px; }

        .sub-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .sub-card { background: var(--card-gray); border-radius: 12px; padding: 12px 4px; border: 1px solid #2a2a2a; text-align: center; cursor: pointer; }
        .sub-icon { font-size: 16px; color: var(--gold); margin-bottom: 5px; }
        .sub-txt { font-size: 8px; color: var(--text-sub); font-weight: 900; }

        .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .dot.green { background: var(--success-green); box-shadow: 0 0 6px var(--success-green); }
        .dot.red { background: var(--alert-red); box-shadow: 0 0 6px var(--alert-red); }

        /* FIXED LINK TILES (Top) */
        .coupon-tile-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .coupon-tile {
            background: var(--card-gray); border-radius: 16px; border: 1px solid #2a2a2a;
            padding: 12px 5px; text-decoration: none; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 5px;
        }
        .coupon-tile i { font-size: 18px; }
        .coupon-tile span { font-size: 9px; font-weight: 900; color: #fff; }
        .tile-r { border-bottom: 3px solid var(--rakuten-red); }
        .tile-j { border-bottom: 3px solid var(--jalan-orange); }
        .tile-i { border-bottom: 3px solid var(--ikyu-gold); }

        /* DYNAMIC COUPON CARDS (NEW 1.27) */
        .dynamic-coupon-container { display: flex; flex-direction: column; gap: 10px; }
        .coupon-brand-group { display: none; } /* Show only if coupons exist */
        .coupon-card {
            background: #fff; color: #000; border-radius: 12px; display: flex; overflow: hidden;
            text-decoration: none; position: relative; margin-bottom: 8px;
        }
        /* Ticket punch holes */
        .coupon-card::before, .coupon-card::after {
            content: ''; position: absolute; left: 75px; width: 14px; height: 14px;
            background: var(--bg-black); border-radius: 50%; z-index: 2;
        }
        .coupon-card::before { top: -7px; }
        .coupon-card::after { bottom: -7px; }

        .coupon-left {
            width: 82px; background: #f8f8f8; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; border-right: 1px dashed #ccc;
            padding: 10px; position: relative; flex-shrink: 0;
        }
        .coupon-val-big { font-size: 18px; font-weight: 900; line-height: 1; }
        .coupon-unit { font-size: 9px; font-weight: 900; margin-top: 2px; }
        .coupon-brand-tag { font-size: 8px; font-weight: 900; margin-top: 8px; padding: 2px 6px; border-radius: 4px; color: #fff; }

        .coupon-right { flex-grow: 1; padding: 12px 15px; display: flex; flex-direction: column; justify-content: center; }
        .coupon-title { font-size: 11px; font-weight: 900; line-height: 1.3; margin-bottom: 4px; }
        .coupon-expiry { font-size: 8px; color: #666; font-weight: 700; }
        
        /* Show more button */
        .show-more-btn {
            width: 100%; padding: 10px; background: rgba(255,255,255,0.05); border: 1px dashed #444;
            border-radius: 10px; color: var(--text-sub); font-size: 10px; font-weight: 900; 
            margin-top: 5px; cursor: pointer; display: none;
        }

        /* AREA SECTION */
        #area-section {
            margin: 30px 0; position: relative;
            background-image: url('https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=2070&auto=format&fit=crop'); 
            background-size: cover; background-position: center; border-radius: 24px; padding: 25px 0; overflow: hidden;
        }
        #area-section::before { content: ''; position: absolute; inset: 0; background: linear-gradient(rgba(13, 15, 17, 0.75), rgba(13, 15, 17, 0.9)); z-index: 1; }
        .area-content-wrapper { position: relative; z-index: 2; }
        .area-section-header { padding: 0 20px; display: flex; align-items: center; margin-bottom: 15px; }
        .area-swipe-container { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 12px; padding: 0 20px 15px; scrollbar-width: none; }
        .area-swipe-container::-webkit-scrollbar { display: none; }
        .area-column { flex: 0 0 85%; scroll-snap-align: center; display: flex; flex-direction: column; gap: 12px; }
        .area-card { background: rgba(28, 33, 38, 0.85); border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); padding: 16px; backdrop-filter: blur(8px); }
        .area-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; margin-bottom: 12px; }
        .area-name-main { font-size: 13px; font-weight: 900; color: #fff; display: flex; align-items: center; gap: 6px; }
        .area-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .area-btn { border: none; color: #fff; text-decoration: none; padding: 10px 4px; border-radius: 10px; font-size: 10px; font-weight: 900; text-align: center; }
        .btn-r { background: var(--rakuten-red); }
        .btn-j { background: var(--jalan-orange); }
        .btn-i { background: var(--ikyu-gold); }

        /* MODAL */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 11000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--card-gray); width: 100%; max-width: 320px; border-radius: 20px; border: 1px solid var(--gold); padding: 25px 20px; }
        .btn-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
        .choice-btn { padding: 12px; border-radius: 10px; color: #fff; font-weight: 900; text-align: center; text-decoration: none; font-size: 11px; }
    </style>
</head>

    <header id="main-header">

                                <a href="https://ck.jp.ap.valuecommerce.com/servlet/referral?sid=3762635&pid=892535794&vc_url=https%3A%2F%2Fwww.ikyu.com%2Fosaka%2F31101101%2F" target="_blank" class="area-btn btn-i">一休</a>

    <div id="hub-modal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div id="modal-title" style="color:var(--gold); font-weight:900; text-align:center; margin-bottom:15px; font-size:13px;"></div>
            <div id="modal-btns" class="btn-grid"></div>
        </div>
    </div>

    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSYeo6mC85kmstRg6iJaxb7dgvy37mPo3knc09k0-82LZF_M5xaYRoRXbsUJig1CKldigIl03CT0Kww/pub?gid=0&single=true&output=csv";

        const MODAL_DATA = {
            transit: { t: "RAILWAY STATUS", b: [{n: "JR東日本", l: "https://traininfo.jreast.co.jp/train_info/kanto.aspx", c: "#28a745"}] },
            weather: { t: "WEATHER", b: [{n: "tenki.jp", l: "https://tenki.jp/", c: "#007aff"}] },
            highway: { t: "HIGHWAY", b: [{n: "ドラぷら", l: "https://www.driveplaza.com/", c: "#28a745"}] },
            flight: { t: "FLIGHT", b: [{n: "JAL", l: "https://www.jal.co.jp/", c: "#e74c3c"}] },
            rain: { t: "RAIN", b: [{n: "雨雲レーダー", l: "https://weather.yahoo.co.jp/weather/zoomradar/", c: "#e74c3c"}] },
            news: { t: "NEWS", b: [{n: "Yahoo!ニュース", l: "https://news.yahoo.co.jp/", c: "#e74c3c"}] }
        };

        async function forceReloadData() {
            const btn = document.getElementById('refresh-btn');
            const icon = document.getElementById('refresh-icon');
            icon.classList.add('spin');
            try {
                const res = await fetch(CSV_URL + `&t=${new Date().getTime()}`);
                const text = await res.text();
                processCSVData(text);
                await getIPWeather();
                icon.className = "fa-solid fa-check"; icon.classList.remove('spin');
                btn.classList.add('success');
                setTimeout(() => { icon.className = "fa-solid fa-arrows-rotate"; btn.classList.remove('success'); }, 2000);
            } catch (e) { icon.classList.remove('spin'); }
        }

        async function getIPWeather() {
            try {
                const ipRes = await fetch('https://ipapi.co/json/');
                const ipData = await ipRes.json();
                document.getElementById('location-name').innerText = ipData.city || "Tokyo";
                const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${ipData.latitude}&longitude=${ipData.longitude}&current_weather=true`);
                const wData = await wRes.json();
                document.getElementById('weather-display').innerHTML = `<div class="dot green"></div> ${Math.round(wData.current_weather.temperature)}°C Current`;
            } catch (e) { document.getElementById('weather-display').innerHTML = `<div class="dot green"></div> 12°C Cloudy`; }
        }

        function processCSVData(text) {
            const rows = text.split('\n').slice(1).filter(r => r.trim());
            const now = new Date();
            const date = now.getDate();
            const brands = { '楽天トラベル': 'rakuten', 'じゃらん': 'jalan', '一休.com': 'ikyu' };
            const brandColors = { 'rakuten': 'var(--rakuten-red)', 'jalan': 'var(--jalan-orange)', 'ikyu': 'var(--ikyu-gold)' };
            
            let couponsByBrand = { rakuten: [], jalan: [], ikyu: [] };
            let saleTopFound = false;

            // Reset UI
            document.getElementById('coupon-list').innerHTML = '';
            Object.values(brands).forEach(id => {
                document.getElementById(`card-${id}`).classList.remove('active-sale');
                document.getElementById(`badge-${id}`).innerText = 'CHECK';
            });

            rows.forEach(line => {
                const cleanCols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.trim().replace(/^"|"$/g, ''));
                const [type, brand, title, start, end, url, direct, disc, fTxt] = cleanCols;
                const sDate = new Date(start);
                const eDate = new Date(end);

                if (now < sDate || now > eDate) return;

                if (type === 'COUPON' && brands[brand]) {
                    couponsByBrand[brands[brand]].push({ title, url, disc, fTxt });
                }
                if (type === 'SALE' && brands[brand]) {
                    const id = brands[brand];
                    document.getElementById(`card-${id}`).classList.add('active-sale');
                    document.getElementById(`card-${id}`).href = url;
                    document.getElementById(`disc-${id}`).innerText = disc || 'プラン一覧を見る';
                    document.getElementById(`badge-${id}`).innerText = fTxt || 'SALE';
                }
                if (type === 'SALE_TOP') { showTopBanner('today', title, url); saleTopFound = true; }
            });

            // Auto-detect specific days
            if (!saleTopFound && [5,10,15,20,25,30].includes(date)) showTopBanner('rakuten', "楽天トラベル｜本日 5と0のつく日 P4倍", "https://travel.rakuten.co.jp/camp/50bunrui/");

            // Render Coupons
            Object.keys(couponsByBrand).forEach(bId => {
                const list = couponsByBrand[bId];
                if (list.length === 0) return;

                const group = document.createElement('div');
                group.className = 'coupon-brand-group';
                group.style.display = 'block';

                list.forEach((c, idx) => {
                    const card = `
                        <a href="${c.url}" target="_blank" class="coupon-card" style="${idx >= 4 ? 'display:none' : ''}" data-brand="${bId}">
                            <div class="coupon-left">
                                <div class="coupon-val-big">${c.fTxt || '特割'}</div>
                                <div class="coupon-unit">${c.fTxt?.includes('%') ? 'OFF' : 'OFFER'}</div>
                                <div class="coupon-brand-tag" style="background:${brandColors[bId]}">${bId.toUpperCase()}</div>
                            </div>
                            <div class="coupon-right">
                                <div class="coupon-title">${c.title}</div>
                                <div class="coupon-expiry"><i class="fa-regular fa-clock"></i> ${c.disc || '期間限定配布中'}</div>
                            </div>
                        </a>`;
                    group.innerHTML += card;
                });

                if (list.length > 4) {
                    const moreBtn = document.createElement('button');
                    moreBtn.className = 'show-more-btn';
                    moreBtn.style.display = 'block';
                    moreBtn.innerHTML = `<i class="fa-solid fa-chevron-down"></i> OTHER ${list.length - 4} COUPONS`;
                    moreBtn.onclick = () => {
                        group.querySelectorAll('.coupon-card').forEach(card => card.style.display = 'flex');
                        moreBtn.style.display = 'none';
                    };
                    group.appendChild(moreBtn);
                }
                document.getElementById('coupon-list').appendChild(group);
            });
        }

        function showTopBanner(mode, title, url) {
            const banner = document.getElementById('sale-banner');
            document.getElementById('sale-banner-text').innerText = title;
            banner.style.display = 'block';
            banner.href = url;
            banner.className = mode === 'today' ? 'sale-today' : 'sale-rakuten-day';
        }

        function openModal(key) {
            const data = MODAL_DATA[key];
            document.getElementById('modal-title').innerText = data.t;
            document.getElementById('modal-btns').innerHTML = data.b.map(b => `<a href="${b.l}" target="_blank" class="choice-btn" style="background:${b.c}">${b.n}</a>`).join('');
            document.getElementById('hub-modal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('hub-modal').style.display = 'none'; }

        forceReloadData();
    </script>
</body>
</html>
