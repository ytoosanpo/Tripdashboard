<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TRIP_DASH. | ver. 1.9.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        :root {
            --biz-bg: #0d0f11; --biz-card: #1c1f23;
            --rakuten: #28a745; --jalan: #ff9900; --ikyu: #a68b5e;
            --text-main: #ffffff; --text-sub: #8e8e93; --gold: #d4af37;
            --alert-red: #e74c3c; --success-green: #2ecc71;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { background: var(--biz-bg); color: var(--text-main); font-family: -apple-system, "Helvetica Neue", sans-serif; padding-top: 50px; }

        /* 1. EMERGENCY BANNER (スクショ通りの赤) */
        #emergency-banner { display: none; background: var(--alert-red); color: #fff; padding: 12px; font-size: 11px; font-weight: 900; text-align: center; position: fixed; top: 0; width: 100%; z-index: 5000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }

        /* 2. HEADER */
        .header { height: 60px; border-bottom: 1px solid #333; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: sticky; top: 0; background: var(--biz-bg); z-index: 4000; }
        .logo { font-weight: 900; color: var(--gold); font-size: 18px; letter-spacing: 2px; }
        .date-display { font-size: 10px; font-weight: 900; color: #fff; }

        .container { width: 100%; max-width: 800px; margin: 0 auto; padding: 20px 15px; }
        .section-title { font-size: 10px; font-weight: 900; color: var(--gold); border-left: 4px solid var(--gold); padding-left: 12px; margin: 35px 0 15px; text-transform: uppercase; letter-spacing: 1px; }

        /* 3. FIELD OPERATIONS (計器パネル・ドット点滅) */
        .op-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .op-card { background: var(--biz-card); border-radius: 12px; padding: 20px; border: 1px solid #2a2a2a; position: relative; cursor: pointer; transition: 0.2s; }
        .op-card:active { transform: scale(0.97); background: #252a30; }
        .op-label { font-size: 9px; color: var(--text-sub); font-weight: 900; margin-bottom: 8px; }
        .op-val { font-size: 14px; font-weight: 900; display: flex; align-items: center; gap: 10px; color: #fff; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--success-green); box-shadow: 0 0 10px var(--success-green); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .op-icon { position: absolute; top: 18px; right: 18px; color: var(--gold); opacity: 0.4; font-size: 18px; }
        .select-source { background: #000; color: var(--gold); font-size: 10px; font-weight: 900; padding: 9px; border-radius: 6px; text-align: center; margin-top: 15px; border: 1px solid #333; }

        /* 4. PRIORITY SALES (ゴールド太枠・チケット風) */
        .sale-card { background: #000; border: 2.5px solid var(--gold); border-radius: 14px; margin-bottom: 15px; display: flex; text-decoration: none; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        .sale-side { width: 90px; background: var(--gold); color: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; text-align: center; line-height: 1.1; }
        .sale-side span { font-size: 15px; margin-top: 2px; }
        .sale-main { flex: 1; padding: 18px; position: relative; }
        .sale-title { font-size: 16px; font-weight: 900; color: #fff; line-height: 1.4; }
        .sale-disc { font-size: 11px; color: var(--gold); margin-top: 6px; font-weight: 800; }

        /* 5. PREMIUM PASS (グレーチケット・ boarding pass風) */
        .cp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .cp-item { background: #dce2e8; border-radius: 8px; display: flex; height: 100px; text-decoration: none; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .cp-main { flex: 1; padding: 12px; color: #1a1d21; position: relative; display: flex; flex-direction: column; justify-content: center; }
        .cp-type { font-size: 8px; font-weight: 900; color: #666; letter-spacing: 1px; }
        .cp-val { font-size: 17px; font-weight: 900; margin-top: 4px; color: #000; }
        .cp-side { width: 42%; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; text-align: center; padding: 5px; position: relative; }
        .cp-side::before { content: ''; position: absolute; left: -1px; top: 10px; bottom: 10px; border-left: 2px dashed rgba(0,0,0,0.15); }

        /* 6. BUSINESS INTELLIGENCE (クリーム背景・上下線) */
        .tips-card { background: #fdfaf5; border-radius: 4px; padding: 30px 20px; margin-bottom: 15px; border: 1px solid #d4af37; text-align: center; position: relative; }
        .tips-card::before, .tips-card::after { content: ''; position: absolute; left: 30px; right: 30px; height: 1px; background: #333; opacity: 0.2; }
        .tips-card::before { top: 18px; } .tips-card::after { bottom: 18px; }
        .tips-title { color: #000; font-weight: 900; font-size: 16px; letter-spacing: 0.5px; }

        .footer { padding: 60px 20px; text-align: center; border-top: 1px solid #333; margin-top: 50px; opacity: 0.5; }
    </style>
</head>
<body>
    <div id="emergency-banner"></div>
    <header class="header">
        <div class="logo">TRIP_DASH.</div>
        <div class="date-display">2026.2.7 SAT</div>
    </header>

    <div class="container">
        <div class="section-title">Field Operations</div>
        <div class="op-grid">
            <div class="op-card" onclick="window.open('https://tenki.jp/')">
                <div class="op-label">WEATHER SYSTEM</div>
                <div class="op-val"><div class="dot"></div>STABLE</div>
                <i class="fa-solid fa-cloud-sun op-icon"></i>
                <div class="select-source">SELECT SOURCE</div>
            </div>
            <div class="op-card" onclick="window.open('https://traininfo.jreast.co.jp/')">
                <div class="op-label">SHINKANSEN OPS</div>
                <div class="op-val"><div class="dot"></div>NORMAL</div>
                <i class="fa-solid fa-train op-icon"></i>
                <div class="select-source">SELECT SOURCE</div>
            </div>
        </div>

        <div class="section-title">Priority Sales</div>
        <div id="sale-root"></div>

        <div class="section-title">Premium Coupons</div>
        <div id="coupon-root" class="cp-grid"></div>

        <div class="section-title">Business Intelligence</div>
        <div id="tips-root"></div>
    </div>

    <script>
        // CSV解析ロジック（絶対に端折らない完全版）
        const CSV_URL = "あなたのCSVの公開URL"; 

        async function loadData() {
            try {
                const res = await fetch(CSV_URL);
                const text = await res.text();
                const rows = text.split(/\r?\n/).slice(1).filter(l => l.trim()).map(line => {
                    const columns = line.includes('\t') ? line.split('\t') : line.split(',');
                    return columns.map(c => c.trim().replace(/^"|"$/g, ''));
                });

                let sHtml = '', cHtml = '', tHtml = '';
                const now = new Date();

                rows.forEach(row => {
                    const [type, brand, title, start, end, url, direct_url, disc, fTxt] = row;
                    if (!type || now < new Date(start) || now > new Date(end)) return;

                    if (type === 'SALE') {
                        sHtml += `
                            <a href="${url}" target="_blank" class="sale-card">
                                <div class="sale-side">OFFER<span>MAX</span></div>
                                <div class="sale-main">
                                    <div class="sale-title">${title}</div>
                                    <div class="sale-disc">${disc}</div>
                                </div>
                            </a>`;
                    } else if (type === 'COUPON') {
                        const bCol = brand.includes("楽天") ? "var(--rakuten)" : brand.includes("じゃらん") ? "var(--jalan)" : "#555";
                        cHtml += `
                            <a href="${url}" target="_blank" class="cp-item">
                                <div class="cp-main">
                                    <div class="cp-type">PASS BOARDING</div>
                                    <div class="cp-val">${fTxt}</div>
                                </div>
                                <div class="cp-side" style="background:${bCol}">
                                    <div style="font-size:7px;opacity:0.8;">AIRLINE / BRAND</div>
                                    <div style="margin-top:2px;">${brand}</div>
                                </div>
                            </a>`;
                    } else if (type === 'TIPS') {
                        tHtml += `<div class="tips-card"><div class="tips-title">${title}</div></div>`;
                    } else if (type === 'EMERGENCY') {
                        const eb = document.getElementById('emergency-banner');
                        eb.innerText = title; eb.style.display = 'block';
                    }
                });

                document.getElementById('sale-root').innerHTML = sHtml || "<p style='color:#333;font-size:10px;'>NO ACTIVE SALES</p>";
                document.getElementById('coupon-root').innerHTML = cHtml || "<p style='color:#333;font-size:10px;'>NO ACTIVE COUPONS</p>";
                document.getElementById('tips-root').innerHTML = tHtml || "<p style='color:#333;font-size:10px;'>NO DATA</p>";

            } catch (error) {
                console.error("Load Error", error);
            }
        }
        loadData();
    </script>
</body>
</html>
