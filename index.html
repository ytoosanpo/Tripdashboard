<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TRIP_DASH. | ver. 1.7.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        :root {
            --biz-bg: #0d0f11; --biz-card: #1c1f23;
            --rakuten: #28a745; --jalan: #ff9900; --ikyu: #a68b5e;
            --text-main: #ffffff; --text-sub: #8e8e93; --gold: #d4af37;
            --alert-red: #e74c3c; --success-green: #2ecc71;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { background: var(--biz-bg); color: var(--text-main); font-family: -apple-system, sans-serif; padding-top: 50px; }

        /* 1. EMERGENCY (スクショ通りの赤帯) */
        #emergency-banner { display: none; background: var(--alert-red); color: #fff; padding: 12px; font-size: 11px; font-weight: 900; text-align: center; position: fixed; top: 0; width: 100%; z-index: 5000; }

        /* 2. HEADER */
        .header { height: 60px; border-bottom: 1px solid #333; display: flex; align-items: center; justify-content: center; position: sticky; top: 0; background: var(--biz-bg); z-index: 4000; }
        .logo { font-weight: 900; color: var(--gold); font-size: 20px; letter-spacing: 2px; }

        .container { width: 100%; max-width: 800px; margin: 0 auto; padding: 15px; }
        .section-title { font-size: 10px; font-weight: 900; color: var(--gold); border-left: 3px solid var(--gold); padding-left: 10px; margin: 30px 0 15px; text-transform: uppercase; }

        /* 3. FIELD OPERATIONS (計器風パネル) */
        .op-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .op-card { background: var(--biz-card); border-radius: 12px; padding: 20px; border: 1px solid #2a2a2a; position: relative; cursor: pointer; }
        .op-val { font-size: 14px; font-weight: 900; display: flex; align-items: center; gap: 8px; margin-top: 5px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--success-green); box-shadow: 0 0 10px var(--success-green); }
        .op-icon { position: absolute; top: 15px; right: 15px; color: var(--text-sub); font-size: 18px; }

        /* 4. PRIORITY SALES (ゴールドボーダー意匠) */
        .sale-card { 
            background: var(--biz-card); border: 2px solid var(--gold); border-radius: 12px; 
            margin-bottom: 12px; display: flex; text-decoration: none; overflow: hidden;
            transition: 0.2s;
        }
        .sale-card:active { transform: scale(0.98); }
        .sale-side { width: 80px; background: var(--gold); color: #000; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; text-align: center; line-height: 1.2; }
        .sale-main { flex: 1; padding: 15px; text-align: left; }
        .sale-title { font-size: 15px; font-weight: 900; color: #fff; margin-bottom: 5px; }
        .sale-disc { font-size: 11px; color: var(--gold); font-weight: 700; }

        /* 5. PASSENGER COUPONS (チケット風デザイン) */
        .cp-item { 
            background: var(--biz-card); border-radius: 12px; display: flex; height: 100px; 
            margin-bottom: 12px; text-decoration: none; position: relative; overflow: hidden;
        }
        .cp-side { width: 100px; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; text-align: center; position: relative; }
        .cp-side::after { content: ''; position: absolute; right: -5px; top: 10px; bottom: 10px; border-right: 2px dashed #000; }
        .cp-main { flex: 1; padding: 20px; text-align: left; }
        .cp-brand { font-size: 10px; color: var(--gold); margin-bottom: 5px; font-weight: 800; }
        .cp-title { font-size: 13px; font-weight: 900; color: #fff; line-height: 1.4; }

        /* 6. BUSINESS TIPS (アイコン＋カード) */
        .tips-card { background: var(--biz-card); border-radius: 14px; padding: 20px; display: flex; align-items: center; gap: 20px; margin-bottom: 12px; border: 1px solid #2a2a2a; }
        .tips-icon { width: 45px; height: 45px; background: rgba(212, 175, 55, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--gold); font-size: 20px; }

        .footer { padding: 40px; text-align: center; font-size: 11px; color: var(--text-sub); }
    </style>
</head>
<body>
    <div id="emergency-banner"></div>
    <header class="header"><div class="logo">TRIP_DASH.</div></header>

    <div class="container">
        <div class="section-title">Field Operations</div>
        <div id="ops-root"></div>

        <div class="section-title">Priority Sales</div>
        <div id="sale-root"></div>

        <div class="section-title">Premium Coupons</div>
        <div id="coupon-root"></div>
        <div id="coupon-more" style="display:none;"></div>
        <div id="ribbon-trigger" style="display:none; color:var(--gold); font-size:11px; font-weight:900; text-align:center; padding:15px; cursor:pointer;" onclick="showMore()">+ VIEW MORE</div>

        <div class="section-title">Business Tips</div>
        <div id="tips-root"></div>
    </div>

    <script>
        const CSV_URL = "あなたのCSVの公開URL";

        async function loadData() {
            try {
                const res = await fetch(CSV_URL);
                const text = await res.text();
                // タブ区切りを優先的に解析 (Googleスプレッドシートのコピー貼り付け対応)
                const rows = text.split('\n').slice(1).map(r => r.split('\t').map(c => c.trim().replace(/^"|"$/g, '')));
                const now = new Date();

                let sHtml = '', cHtml = '', tHtml = '', cCount = 0;

                rows.forEach(row => {
                    const [type, brand, title, start, end, url, direct_url, disc, fTxt] = row;
                    if (!type || now < new Date(start) || now > new Date(end)) return;

                    if (type === 'SALE') {
                        sHtml += `
                            <a href="${url}" target="_blank" class="sale-card">
                                <div class="sale-side">MAX</div>
                                <div class="sale-main">
                                    <div class="sale-title">${title}</div>
                                    <div class="sale-disc">${disc}</div>
                                </div>
                            </a>`;
                    } else if (type === 'COUPON') {
                        const bCol = brand.includes("楽天") ? "var(--rakuten)" : "var(--jalan)";
                        cHtml += `
                            <a href="${url}" target="_blank" class="cp-item">
                                <div class="cp-side" style="background:${bCol}">${fTxt}</div>
                                <div class="cp-main">
                                    <div class="cp-brand">${brand}</div>
                                    <div class="cp-title">${title}</div>
                                </div>
                            </a>`;
                    } else if (type === 'TIPS') {
                        tHtml += `
                            <div class="tips-card">
                                <div class="tips-icon"><i class="fa-solid fa-lightbulb"></i></div>
                                <div>
                                    <div style="font-weight:900; font-size:14px; color:#fff;">${title}</div>
                                    <div style="font-size:11px; color:var(--text-sub); margin-top:4px;">${disc}</div>
                                </div>
                            </div>`;
                    }
                });

                document.getElementById('sale-root').innerHTML = sHtml;
                document.getElementById('coupon-root').innerHTML = cHtml;
                document.getElementById('tips-root').innerHTML = tHtml;
            } catch (e) {
                console.error("CSV Load Error:", e);
            }
        }
        loadData();
    </script>
</body>
</html>
