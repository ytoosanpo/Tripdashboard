<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIP_DASH. | ビジネス旅行ダッシュボード</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        :root {
            --biz-bg: #0d0f11; --biz-card: #161a1d; --biz-blue: #007aff;
            --rakuten-green: #28a745; --jalan-orange: #ff9900;
            --text-main: #ffffff; --text-sub: #8e8e93; --accent-gold: #d4af37; --header-h: 60px;
        }
        body { margin: 0; background: var(--biz-bg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--text-main); line-height: 1.4; padding-bottom: 50px; }
        .biz-header { position: fixed; top: 0; width: 100%; height: var(--header-h); background: rgba(13,15,17,0.8); backdrop-filter: blur(20px); border-bottom: 1px solid #333; z-index: 2000; display: flex; align-items: center; padding: 0 15px; box-sizing: border-box; }
        .biz-logo { font-weight: 900; color: var(--accent-gold); text-decoration: none; font-size: 18px; letter-spacing: 2px; }

        /* INTELLIGENCE HUB (新デザイン) */
        .intel-hub { margin-top: calc(var(--header-h) + 15px); padding: 0 12px; }
        .intel-tagline { font-size: 10px; color: var(--accent-gold); font-weight: bold; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 6px; }
        .intel-tagline::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--accent-gold), transparent); }
        
        .main-monitor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .monitor-card { background: var(--biz-card); border-radius: 12px; padding: 15px; text-decoration: none; color: inherit; border: 1px solid #2d3436; position: relative; overflow: hidden; }
        .monitor-card::before { content: ""; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: var(--biz-blue); }
        .monitor-label { font-size: 10px; color: var(--text-sub); display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
        .monitor-val { font-size: 14px; font-weight: 800; line-height: 1.2; }
        .status-pulse { width: 6px; height: 6px; background: #4caf50; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px #4caf50; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        .quick-action-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
        .action-btn { background: var(--biz-card); border-radius: 10px; padding: 10px 5px; text-align: center; text-decoration: none; color: var(--text-main); border: 1px solid #2d3436; transition: 0.2s; }
        .action-btn i { font-size: 18px; color: var(--accent-gold); margin-bottom: 5px; display: block; }
        .action-btn span { font-size: 9px; font-weight: bold; color: var(--text-sub); }
        .action-btn:active { background: #2d3436; transform: scale(0.95); }

        /* 各セクション共通 */
        .section-title { padding: 10px 15px 8px; font-size: 11px; font-weight: 800; color: var(--text-sub); border-bottom: 1px solid #2d3436; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        
        /* セール */
        .sale-container { padding: 0 12px; }
        .limited-sale-card { background: linear-gradient(135deg, #1e1b10 0%, #161a1d 100%); border: 1px solid var(--accent-gold); border-radius: 14px; text-decoration: none; color: inherit; display: flex; overflow: hidden; margin-bottom: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .sale-badge-big { background: var(--accent-gold); color: #000; width: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; line-height: 1; }
        .sale-content { padding: 12px; flex: 1; }
        .sale-title { font-size: 14px; font-weight: 800; color: #fff; margin-bottom: 3px; }

        /* クーポングループ */
        .coupon-group { margin-bottom: 20px; padding: 0 12px; }
        .group-label { font-size: 11px; font-weight: bold; margin-bottom: 8px; color: var(--text-sub); display: flex; align-items: center; gap: 6px; }
        .coupon-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .coupon-card { background: #fff; border-radius: 8px; overflow: hidden; text-decoration: none; color: #333; display: flex; flex-direction: column; height: 100px; }
        .coupon-label { padding: 4px; text-align: center; font-size: 9px; font-weight: 900; color: #fff; background: var(--biz-blue); }
        .coupon-main { padding: 8px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .coupon-title { font-size: 10px; font-weight: 800; line-height: 1.3; }
        .coupon-code { font-family: monospace; font-size: 9px; color: var(--biz-blue); border: 1px dashed #ccc; padding: 2px; text-align: center; background: #f0f4f8; }
        .no-coupon-btn { grid-column: span 2; background: #1c2126; color: var(--accent-gold); border: 1px dashed #444; padding: 12px; text-align: center; text-decoration: none; border-radius: 8px; font-size: 11px; font-weight: bold; }
        .toggle-btn { grid-column: span 2; background: #222; color: #aaa; border: none; padding: 8px; border-radius: 6px; font-size: 10px; margin-top: 5px; }

        /* TIPS (新聞風) */
        .tips-grid { padding: 0 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .tips-card-new { background: #f4f1ea; border-radius: 2px; padding: 15px; border: 1px solid #dcd9d0; position: relative; cursor: pointer; box-shadow: 5px 5px 0px rgba(0,0,0,0.3); }
        .tips-card-new::after { content: "TIPS"; position: absolute; top: -8px; right: 10px; background: #1a1a1a; color: #fff; font-size: 8px; padding: 2px 6px; }
        .tips-title-new { color: #1a1a1a; font-family: serif; font-size: 13px; font-weight: 900; border-top: 1px solid #1a1a1a; padding: 5px 0; }

        /* モーダル */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; z-index: 3000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: #f4f1ea; color: #1a1a1a; width: 100%; max-width: 500px; max-height: 85vh; padding: 30px; position: relative; overflow-y: auto; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 30px; color: #888; cursor: pointer; }
    </style>
</head>
<body>

<header class="biz-header"><a href="#" class="biz-logo">TRIP_DASH.</a></header>

<div class="intel-hub">
    <div class="intel-tagline">Real-time Intelligence Hub</div>
    <div class="main-monitor-grid">
        <a href="https://traininfo.jr-central.co.jp/shinkansen/pc/ja/index.html" target="_blank" class="monitor-card">
            <div class="monitor-label"><span class="status-pulse"></span> Transit Status</div>
            <div class="monitor-val">東海道新幹線<br>平常運転</div>
        </a>
        <div class="monitor-card" style="border-left: 3px solid #ff9500;">
            <div class="monitor-label"><i class="fa-solid fa-cloud-sun"></i> Tokyo Weather</div>
            <div class="monitor-val">12°C<br>Cloudy</div>
        </div>
    </div>
    
    <div class="quick-action-grid">
        <a href="https://www.jartic.or.jp/" target="_blank" class="action-btn">
            <i class="fa-solid fa-car-side"></i><span>渋滞</span>
        </a>
        <a href="https://ja.flightaware.com/live/" target="_blank" class="action-btn">
            <i class="fa-solid fa-plane-up"></i><span>空路</span>
        </a>
        <a href="https://weathernews.jp/onebox/radar/" target="_blank" class="action-btn">
            <i class="fa-solid fa-cloud-showers-heavy"></i><span>雨雲</span>
        </a>
        <a href="https://news.google.com/" target="_blank" class="action-btn">
            <i class="fa-solid fa-rss"></i><span>NEWS</span>
        </a>
    </div>
</div>

<div class="section-title"><i class="fa-solid fa-bolt"></i> Priority Sales</div>
<div id="sale-area" class="sale-container"></div>

<div class="section-title"><i class="fa-solid fa-tags"></i> Organized Coupons</div>
<div id="coupon-root"></div>

<div class="section-title"><i class="fa-solid fa-quote-left"></i> Travel Briefing</div>
<div id="tips-area" class="tips-grid"></div>

<div id="modalOverlay" class="modal-overlay" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle" style="font-family:serif; border-bottom:2px solid #1a1a1a; padding-bottom:10px;"></h2>
        <div id="modalBody" style="font-size:16px; line-height:1.8; margin-top:20px;"></div>
    </div>
</div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSYeo6mC85kmstRg6iJaxb7dgvy37mPo3knc09k0-82LZF_M5xaYRoRXbsUJig1CKldigIl03CT0Kww/pub?gid=0&single=true&output=csv";

async function updateDashboard() {
    try {
        const response = await fetch(CSV_URL);
        const data = await response.text();
        const rows = data.split('\n').map(row => row.split(','));
        const now = new Date();

        let saleHtml = '';
        let tipsHtml = '';
        let couponData = { rakuten: [], jalan: [], other: [] };

        for(let i = 1; i < rows.length; i++) {
            const row = rows[i].map(s => s?.trim());
            const [type, title, start, end, url, desc, discount, fullText] = row;
            if(!type || !title) continue;

            if (now >= new Date(start) && now <= new Date(end)) {
                if (type === 'SALE') {
                    saleHtml += `<a href="${url}" class="limited-sale-card"><div class="sale-badge-big"><span style="font-size:10px;">MAX</span><span style="font-size:18px;">${discount}</span></div><div class="sale-content"><div class="sale-title">${title}</div><div class="sale-desc" style="font-size:12px; color:var(--accent-gold); font-weight:bold;">${desc}</div></div></a>`;
                } else if (type === 'COUPON') {
                    const card = `<a href="${url}" class="coupon-card"><div class="coupon-label ${title.includes("楽天")?"label-rakuten":title.includes("じゃらん")?"label-jalan":""}">${discount}</div><div class="coupon-main"><div class="coupon-title">${title}</div><div class="coupon-code">${desc}</div></div></a>`;
                    if(title.includes("楽天")) couponData.rakuten.push(card);
                    else if(title.includes("じゃらん")) couponData.jalan.push(card);
                    else couponData.other.push(card);
                } else if (type === 'TIPS') {
                    tipsHtml += `<div class="tips-card-new" onclick="openModal(\`${title}\`, \`${fullText || desc}\`)"><div class="tips-title-new">${title}</div></div>`;
                }
            }
        }

        const couponRoot = document.getElementById('coupon-root');
        couponRoot.innerHTML = '';
        const groups = [
            {id: 'rakuten', name: 'Rakuten Travel', icon: 'fa-hotel', url: 'https://travel.rakuten.co.jp/'},
            {id: 'jalan', name: 'Jalan.net', icon: 'fa-compass', url: 'https://www.jalan.net/'},
            {id: 'other', name: 'Other Channels', icon: 'fa-star', url: '#'}
        ];

        groups.forEach(g => {
            let gHtml = `<div class="coupon-group"><div class="group-label"><i class="fa-solid ${g.icon}"></i> ${g.name}</div><div class="coupon-grid">`;
            if (couponData[g.id].length > 0) {
                couponData[g.id].forEach((card, idx) => {
                    if(idx === 4) gHtml += `<div id="more-${g.id}" style="display:none; contents;">`;
                    gHtml += card;
                });
                if(couponData[g.id].length > 4) {
                    gHtml += `</div><button class="toggle-btn" onclick="toggleMore('${g.id}', this)">Show ${couponData[g.id].length-4} More Coupons</button>`;
                }
            } else {
                gHtml += `<a href="${g.url}" target="_blank" class="no-coupon-btn">Check Official Site</a>`;
            }
            gHtml += `</div></div>`;
            couponRoot.innerHTML += gHtml;
        });

        document.getElementById('sale-area').innerHTML = saleHtml || '<p style="padding:15px;color:#555;">No active sales.</p>';
        document.getElementById('tips-area').innerHTML = tipsHtml || '<p style="padding:15px;color:#555;">No updates.</p>';
    } catch (e) { console.error(e); }
}

function toggleMore(id, btn) {
    const target = document.getElementById('more-' + id);
    target.style.display = 'contents';
    btn.style.display = 'none';
}

function openModal(title, text) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalBody').innerText = text;
    document.getElementById('modalOverlay').style.display = 'flex';
}

function closeModal() {
    document.getElementById('modalOverlay').style.display = 'none';
}

updateDashboard();
</script>
</body>
</html>
