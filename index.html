<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TRIP_DASH. ver.2.5.3</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        :root {
            --biz-bg: #0d0f11; --biz-card: #1c1f23;
            --rakuten-green: #28a745; --jalan-orange: #ff9900; --ikyu-gold: #a68b5e;
            --text-main: #ffffff; --text-sub: #8e8e93; --accent-gold: #d4af37; 
            --emergency-red: #e74c3c;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--biz-bg); color: var(--text-main); font-family: -apple-system, sans-serif; padding-top: 70px; }
        
        /* Header & Emergency */
        #emergency-bar { display: none; background: var(--emergency-red); color: #fff; padding: calc(6px + env(safe-area-inset-top)) 15px 6px; font-size: 11px; font-weight: 900; text-align: center; position: fixed; top: 0; width: 100%; z-index: 5000; }
        body.has-emergency { padding-top: 100px; }
        body.has-emergency .biz-header { top: calc(32px + env(safe-area-inset-top)); }
        .biz-header { height: 60px; background: rgba(13,15,17,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid #333; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: fixed; top: 0; width: 100%; z-index: 4000; }
        .biz-logo { font-weight: 900; color: var(--accent-gold); text-decoration: none; font-size: 18px; letter-spacing: 1px; }

        .container { width: 100%; max-width: 800px; margin: 0 auto; padding: 20px 15px; }
        .section-title { font-size: 10px; font-weight: 800; color: var(--text-sub); border-left: 3px solid var(--accent-gold); padding-left: 8px; margin: 25px 0 15px; text-transform: uppercase; }

        /* Campaign Alert */
        #campaign-alert { background: var(--accent-gold); color: #000; font-size: 11px; font-weight: 900; padding: 10px; border-radius: 6px; margin-bottom: 15px; display: none; text-align: center; line-height: 1.4; }

        /* Field Operations */
        .op-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .op-card { background: var(--biz-card); border: 1px solid #333; border-radius: 10px; padding: 12px; position: relative; }
        .op-icon { position: absolute; top: 12px; right: 12px; color: var(--accent-gold); opacity: 0.5; font-size: 16px; }
        .op-label { font-size: 9px; color: var(--text-sub); font-weight: 900; }
        .op-val { font-size: 13px; font-weight: 900; display: flex; align-items: center; gap: 6px; margin-top: 4px; }

        /* Area Search */
        .area-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .area-card { background: var(--biz-card); border-radius: 10px; overflow: hidden; border: 1px solid #333; text-decoration: none; color: inherit; }
        .area-img { height: 70px; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; position: relative; }
        .area-img::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,0.4); }
        .area-name { position: relative; z-index: 1; font-size: 12px; font-weight: 900; }
        .area-links { display: flex; padding: 8px; gap: 4px; background: #161a1d; }
        .a-link { flex: 1; font-size: 9px; font-weight: bold; text-align: center; padding: 6px 0; border-radius: 4px; color: #fff; text-decoration: none; }
        .rak-bg { background: var(--rakuten-green); } .jal-bg { background: var(--jalan-orange); } .iky-bg { background: var(--ikyu-gold); }

        /* Coupon Section with Ribbon */
        .coupon-group { margin-bottom: 20px; }
        .cp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .cp-item { background: var(--biz-card); border: 1px solid #333; border-radius: 10px; display: flex; min-height: 80px; text-decoration: none; overflow: hidden; }
        .cp-side { width: 80px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; color: #fff; text-align: center; padding: 5px; }
        .cp-main { flex: 1; padding: 10px; display: flex; flex-direction: column; justify-content: center; }
        .cp-title { font-size: 11px; font-weight: 800; color: #fff; line-height: 1.4; }
        .hidden-coupons { display: none; margin-top: 10px; }
        .ribbon-btn { width: 100%; background: #2d3436; color: var(--text-sub); border: none; padding: 8px; border-radius: 6px; font-size: 10px; font-weight: 800; margin-top: 10px; cursor: pointer; text-transform: uppercase; }

        /* Other UI */
        .search-panel { background: var(--biz-card); border: 1px solid var(--accent-gold); border-radius: 12px; padding: 20px; margin-top: 20px; }
        .biz-select { width: 100%; background: #000; color: #fff; border: 1px solid #444; height: 45px; border-radius: 6px; padding: 0 10px; margin-bottom: 12px; }
        .search-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .btn-search { height: 40px; border-radius: 6px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 10px; font-weight: 900; color: #fff; opacity: 0.2; pointer-events: none; }
        .btn-search.active { opacity: 1; pointer-events: auto; }
        .tips-card { background: var(--biz-card); border: 1px solid #333; border-radius: 8px; padding: 14px; margin-bottom: 8px; cursor: pointer; display: flex; align-items: center; gap: 12px; }
        #modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 6000; align-items: center; justify-content: center; padding: 20px; }
        #modal-content { background: var(--biz-card); border: 1px solid var(--accent-gold); padding: 25px; border-radius: 15px; max-width: 500px; width: 100%; position: relative; }
    </style>
</head>
<body>

<div id="emergency-bar"></div>
<header class="biz-header"><a href="#" class="biz-logo">TRIP_DASH.</a><div id="header-date" style="font-size: 10px; font-weight: 900; font-family: monospace;"></div></header>

<div class="container">
    <div id="campaign-alert"></div>
    <div class="section-title">Field Operations</div>
    <div class="op-grid">
        <div class="op-card"><i class="fa-solid fa-cloud-sun op-icon"></i><div class="op-label">WEATHER</div><div class="op-val" id="temp-val">--°C</div><div id="local-city" style="font-size:9px; color:var(--text-sub);">Detecting...</div></div>
        <div class="op-card"><i class="fa-solid fa-train op-icon"></i><div class="op-label">SHINKANSEN</div><div class="op-val"><div class="status-dot bg-green" id="dot-s" style="width:8px;height:8px;border-radius:50%"></div><span id="txt-s">Normal</span></div></div>
        <div class="op-card"><i class="fa-solid fa-plane op-icon"></i><div class="op-label">AIRLINE</div><div class="op-val"><div class="status-dot bg-green" id="dot-a" style="width:8px;height:8px;border-radius:50%"></div><span id="txt-a">Normal</span></div></div>
        <div class="op-card"><i class="fa-solid fa-rss op-icon"></i><div class="op-label">NEWS</div><div id="news-tag" style="font-size:11px; font-weight:900;">No Alerts</div></div>
    </div>

    <section id="recom-section" style="display:none;"><div class="section-title">Recommended Hotels</div><div id="recom-root" class="area-grid"></div></section>
    
    <div class="section-title">Quick Area Search</div>
    <div class="area-grid" id="area-root"></div>

    <div class="search-panel">
        <select class="biz-select" id="area-dropdown" onchange="updateSearchBtns()">
            <option value="">その他のエリアを検索</option>
            <optgroup label="主要エリア"><option value="tokyo" data-rak="https://a.r10.to/hYb8ED" data-jal="https://www.jalan.net/" data-iky="https://www.ikyu.com/">東京</option><option value="osaka" data-rak="https://a.r10.to/hkI4ez" data-jal="https://www.jalan.net/" data-iky="https://www.ikyu.com/">大阪</option></optgroup>
        </select>
        <div class="search-btns">
            <a href="#" id="s-rak" target="_blank" class="btn-search rak-bg">楽天</a>
            <a href="#" id="s-jal" target="_blank" class="btn-search jal-bg">じゃらん</a>
            <a href="#" id="s-iky" target="_blank" class="btn-search iky-bg">一休</a>
        </div>
    </div>

    <div class="section-title">Active Coupons</div>
    <div id="coupon-root"></div>

    <div class="section-title">Business Intelligence</div>
    <div id="tips-root"></div>
</div>

<div id="modal-overlay" onclick="closeModal()"><div id="modal-content" onclick="event.stopPropagation()"><div id="modal-body"></div></div></div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSYeo6mC85kmstRg6iJaxb7dgvy37mPo3knc09k0-82LZF_M5xaYRoRXbsUJig1CKldigIl03CT0Kww/pub?gid=0&single=true&output=csv";
const AREAS = [
    { name: 'TOKYO / 東京', img: 'https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?w=400', rak: 'https://a.r10.to/hYb8ED', jal: 'https://www.jalan.net/', iky: 'https://www.ikyu.com/' },
    { name: 'OSAKA / 大阪', img: 'https://images.unsplash.com/photo-1590559899731-a382839e5549?w=400', rak: 'https://a.r10.to/hkI4ez', jal: 'https://www.jalan.net/', iky: 'https://www.ikyu.com/' },
    { name: 'NAGOYA / 名古屋', img: 'https://images.unsplash.com/photo-1596230529625-7ee10f7b09b6?w=400', rak: 'https://a.r10.to/hPVp2x', jal: 'https://www.jalan.net/', iky: 'https://www.ikyu.com/' },
    { name: 'FUKUOKA / 福岡', img: 'https://images.unsplash.com/photo-1621350485987-a27909010419?w=400', rak: 'https://a.r10.to/hPdo3g', jal: 'https://www.jalan.net/', iky: 'https://www.ikyu.com/' }
];

function toggleCoupons(id) {
    const el = document.getElementById(id);
    const btn = el.previousElementSibling;
    const isHidden = window.getComputedStyle(el).display === 'none';
    el.style.display = isHidden ? 'grid' : 'none';
    btn.innerText = isHidden ? '▲ Close' : '▼ More Coupons';
}

function updateSearchBtns() {
    const sel = document.getElementById('area-dropdown');
    const opt = sel.options[sel.selectedIndex];
    ['rak', 'jal', 'iky'].forEach(k => {
        const btn = document.getElementById(`s-${k}`);
        if(opt && opt.value) { btn.href = opt.dataset[k]; btn.classList.add('active'); }
        else { btn.href = "#"; btn.classList.remove('active'); }
    });
}

async function loadData() {
    try {
        const res = await fetch(CSV_URL);
        const csv = await res.text();
        const rows = csv.split(/\r?\n/).map(r => r.split(',').map(s => s.trim().replace(/^"|"$/g, '')));
        const now = new Date();
        let hHtml = ''; let tHtml = '';
        let cpData = { rak: [], jal: [], iky: [], otr: [] };

        rows.slice(1).forEach(row => {
            const [type, brand, title, start, end, url, img_url, disc, fTxt] = row;
            if(!type) return;
            if(type !== 'EMERGENCY' && start && end && (now < new Date(start) || now > new Date(end))) return;

            if(type === 'HOTEL') {
                const bCol = brand.includes("楽天")?"#28a745":brand.includes("じゃらん")?"#ff9900":"#a68b5e";
                hHtml += `<a href="${url}" target="_blank" class="area-card"><div class="area-img" style="background-image:url('${img_url||''}')"><div class="mini-brand" style="position:absolute;top:5px;left:5px;background:${bCol};font-size:8px;padding:2px 4px;border-radius:3px;color:#fff;font-weight:900;">${brand}</div><div class="area-name" style="font-size:10px;">${title}</div></div></a>`;
            } else if(type === 'COUPON') {
                const bCol = brand.includes("楽天")?"#28a745":brand.includes("じゃらん")?"#ff9900":"#a68b5e";
                const cat = brand.includes("楽天")?'rak':brand.includes("じゃらん")?'jal':brand.includes("一休")?'iky':'otr';
                cpData[cat].push(`<a href="${url}" target="_blank" class="cp-item"><div class="cp-side" style="background:${bCol}">${disc}</div><div class="cp-main"><div class="cp-title">${title}</div></div></a>`);
            } else if(type === 'TIPS') {
                tHtml += `<div class="tips-card" onclick="showTips('${title}', '${fTxt}')"><i class="fa-solid fa-lightbulb" style="color:var(--accent-gold)"></i><div style="font-size:12px;font-weight:800;">${title}</div></div>`;
            }
        });

        // クーポン描画（各社4件制限）
        let cpFullHtml = '';
        Object.entries(cpData).forEach(([key, items]) => {
            if(items.length === 0) return;
            cpFullHtml += `<div class="coupon-group"><div class="cp-grid">${items.slice(0,4).join('')}</div>`;
            if(items.length > 4) {
                cpFullHtml += `<button class="ribbon-btn" onclick="toggleCoupons('cp-extra-${key}')">▼ More Coupons</button><div id="cp-extra-${key}" class="hidden-coupons cp-grid">${items.slice(4).join('')}</div>`;
            }
            cpFullHtml += `</div>`;
        });

        document.getElementById('recom-root').innerHTML = hHtml;
        document.getElementById('recom-section').style.display = hHtml?'block':'none';
        document.getElementById('coupon-root').innerHTML = cpFullHtml;
        document.getElementById('tips-root').innerHTML = tHtml;
    } catch(e) {}
}

function init() {
    const d = new Date(); document.getElementById('header-date').innerText = d.toLocaleDateString();
    // Campaign Check
    const day = d.getDate(); const alert = document.getElementById('campaign-alert'); let msgs = [];
    if([5,10,15,20,25,30].includes(day)) msgs.push('楽天：5と0のつく日');
    if([1,9,11,19,21,29,31].includes(day)) msgs.push('一休：1と9のつく日');
    if(day === 10) msgs.push('じゃらん：お得な10日間');
    if(msgs.length) { alert.innerHTML = msgs.join(' | '); alert.style.display = 'block'; }
    // Area Render
    document.getElementById('area-root').innerHTML = AREAS.map(a => `<div class="area-card"><div class="area-img" style="background-image:url('${a.img}')"><div class="area-name">${a.name}</div></div><div class="area-links"><a href="${a.rak}" class="a-link rak-bg">楽天</a><a href="${a.jal}" class="a-link jal-bg">じゃらん</a><a href="${a.iky}" class="a-link iky-bg">一休</a></div></div>`).join('');
    loadData();
}
function showTips(title, desc) { document.getElementById('modal-body').innerHTML = `<h3 style="color:var(--accent-gold);margin-top:0">${title}</h3><p style="font-size:14px;line-height:1.6;color:#ccc;white-space:pre-wrap;">${desc}</p>`; document.getElementById('modal-overlay').style.display = 'flex'; }
function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
init();
</script>
</body>
</html>
