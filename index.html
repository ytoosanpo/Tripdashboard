<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIP_DASH. | ビジネス旅行ダッシュボード</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        :root {
            --biz-bg: #0d0f11; --biz-card: #161a1d; --biz-blue: #007aff;
            --rakuten-green: #28a745; --jalan-orange: #ff9900; --other-gray: #333333;
            --text-main: #ffffff; --text-sub: #8e8e93; --accent-gold: #d4af37; --header-h: 60px;
        }
        body { margin: 0; background: var(--biz-bg); font-family: -apple-system, sans-serif; color: var(--text-main); line-height: 1.4; padding-bottom: 60px; }
        
        /* ヘッダー */
        .biz-header { position: fixed; top: 0; width: 100%; height: var(--header-h); background: rgba(13,15,17,0.8); backdrop-filter: blur(20px); border-bottom: 1px solid #333; z-index: 2000; display: flex; align-items: center; padding: 0 15px; box-sizing: border-box; }
        .biz-logo { font-weight: 900; color: var(--accent-gold); text-decoration: none; font-size: 18px; letter-spacing: 2px; }

        /* インテリジェンス・ハブ */
        .intel-hub { margin-top: calc(var(--header-h) + 15px); padding: 0 12px; }
        .intel-tagline { font-size: 10px; color: var(--accent-gold); font-weight: bold; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 6px; }
        .intel-tagline::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--accent-gold), transparent); }
        .main-monitor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .monitor-card { background: var(--biz-card); border-radius: 12px; padding: 15px; text-decoration: none; color: inherit; border: 1px solid #2d3436; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .monitor-label { font-size: 10px; color: var(--text-sub); display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
        .monitor-val { font-size: 14px; font-weight: 800; }

        .quick-action-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
        .action-btn { background: var(--biz-card); border-radius: 10px; padding: 10px 5px; text-align: center; text-decoration: none; color: var(--text-main); border: 1px solid #333; }
        .action-btn i { font-size: 18px; color: var(--accent-gold); margin-bottom: 4px; display: block; }
        .action-btn span { font-size: 9px; font-weight: bold; color: var(--text-sub); }

        .section-title { padding: 15px 15px 8px; font-size: 11px; font-weight: 800; color: var(--text-sub); border-bottom: 1px solid #2d3436; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; text-transform: uppercase; }

        /* セール（キラキラ黄金・立体） */
        .sale-container { padding: 0 12px; }
        .limited-sale-card { 
            background: linear-gradient(135deg, #1e1b10 0%, #161a1d 100%); border: 2px solid var(--accent-gold); 
            border-radius: 12px; text-decoration: none; color: inherit; display: flex; overflow: hidden; margin-bottom: 15px; position: relative;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7), inset 0 0 10px rgba(212,175,55,0.3);
        }
        .limited-sale-card::after {
            content: ""; position: absolute; top: -50%; left: -60%; width: 25%; height: 200%;
            background: rgba(255, 255, 255, 0.2); transform: rotate(30deg); animation: shine 5s infinite;
        }
        @keyframes shine { 0% { left: -60%; } 20% { left: 120%; } 100% { left: 120%; } }
        .sale-badge-big { background: var(--accent-gold); color: #000; width: 85px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; line-height: 1; text-align: center; border-right: 1px solid rgba(0,0,0,0.2); }
        .sale-content { padding: 18px; flex: 1; z-index: 1; }
        .sale-title { font-size: 15px; font-weight: 900; }
        .sale-desc { font-size: 12px; color: #ffd700; font-weight: bold; }

        /* ブランド別チケットデザイン */
        .coupon-group { margin-bottom: 25px; padding: 0 12px; }
        .group-label { font-size: 11px; font-weight: 900; margin-bottom: 12px; color: var(--text-sub); display: flex; align-items: center; gap: 8px; }
        .coupon-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        .coupon-card { 
            background: #fff; border-radius: 8px; overflow: hidden; text-decoration: none; color: #333; 
            display: flex; flex-direction: column; height: 135px; position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }
        .coupon-card::before, .coupon-card::after {
            content: ""; position: absolute; width: 14px; height: 14px; background: var(--biz-bg); border-radius: 50%; top: 40px; z-index: 10;
        }
        .coupon-card::before { left: -7px; }
        .coupon-card::after { right: -7px; }

        .coupon-label { padding: 10px 5px; text-align: center; font-size: 11px; font-weight: 900; color: #fff; background: var(--other-gray); }
        .coupon-main { padding: 12px 10px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; border-top: 2px dashed #eee; background: #fff; }
        .coupon-title { font-size: 11px; font-weight: 800; line-height: 1.3; color: #1a1a1a; }
        .coupon-code { font-family: 'Courier New', monospace; font-size: 10px; padding: 5px; text-align: center; font-weight: bold; border-radius: 4px; }

        /* 楽天グリーン設定 */
        .coupon-card.rakuten .coupon-label { background: var(--rakuten-green); }
        .coupon-card.rakuten .coupon-code { border: 1.5px solid #d4edda; color: #155724; background: #f0fff4; }
        
        /* じゃらんオレンジ設定 */
        .coupon-card.jalan .coupon-label { background: var(--jalan-orange); }
        .coupon-card.jalan .coupon-code { border: 1.5px solid #ffe0b2; color: #e65100; background: #fffcf5; }

        .coupon-card.other .coupon-code { border: 1.5px solid #eee; color: #444; background: #f8f8f8; }

        /* TIPS */
        .tips-grid { padding: 0 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .tips-card-new { background: #f4f1ea; border-radius: 2px; padding: 15px; border: 1px solid #dcd9d0; position: relative; cursor: pointer; box-shadow: 6px 6px 0px rgba(0,0,0,0.5); }
        .tips-card-new::after { content: "INTEL"; position: absolute; top: -8px; right: 10px; background: #1a1a1a; color: #fff; font-size: 8px; padding: 2px 6px; }
        .tips-title-new { color: #1a1a1a; font-family: serif; font-size: 13px; font-weight: 900; border-top: 1.5px solid #1a1a1a; padding: 5px 0; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; z-index: 3000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: #f4f1ea; color: #1a1a1a; width: 100%; max-width: 500px; padding: 30px; position: relative; border-radius: 4px; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 30px; color: #888; cursor: pointer; }
    </style>
</head>
<body>

<header class="biz-header"><a href="#" class="biz-logo">TRIP_DASH.</a></header>

<div class="intel-hub">
    <div class="intel-tagline">Intelligence Hub</div>
    <div class="main-monitor-grid">
        <a href="https://traininfo.jr-central.co.jp/shinkansen/pc/ja/index.html" target="_blank" class="monitor-card">
            <div class="monitor-label"><i class="fa-solid fa-train"></i> Transit Status</div>
            <div class="monitor-val">東海道新幹線<br>平常運転</div>
        </a>
        <div class="monitor-card">
            <div class="monitor-label"><i class="fa-solid fa-cloud-sun"></i> Tokyo Weather</div>
            <div class="monitor-val">12°C<br>Cloudy</div>
        </div>
    </div>
    <div class="quick-action-grid">
        <a href="https://www.jartic.or.jp/" target="_blank" class="action-btn"><i class="fa-solid fa-car"></i><span>渋滞</span></a>
        <a href="https://ja.flightaware.com/live/" target="_blank" class="action-btn"><i class="fa-solid fa-plane"></i><span>空路</span></a>
        <a href="https://weathernews.jp/onebox/radar/" target="_blank" class="action-btn"><i class="fa-solid fa-cloud-showers-heavy"></i><span>雨雲</span></a>
        <a href="https://news.google.com/" target="_blank" class="action-btn"><i class="fa-solid fa-rss"></i><span>NEWS</span></a>
    </div>
</div>

<div class="section-title"><i class="fa-solid fa-fire"></i> Priority Sales</div>
<div id="sale-area" class="sale-container"></div>

<div class="section-title"><i class="fa-solid fa-ticket"></i> Premium Tickets</div>
<div id="coupon-root"></div>

<div class="section-title"><i class="fa-solid fa-newspaper"></i> Business Briefing</div>
<div id="tips-area" class="tips-grid"></div>

<div id="modalOverlay" class="modal-overlay" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle" style="font-family:serif; border-bottom:2px solid #1a1a1a; padding-bottom:10px;"></h2>
        <div id="modalBody" style="font-size:16px; line-height:1.8; margin-top:15px; white-space:pre-wrap;"></div>
    </div>
</div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSYeo6mC85kmstRg6iJaxb7dgvy37mPo3knc09k0-82LZF_M5xaYRoRXbsUJig1CKldigIl03CT0Kww/pub?gid=0&single=true&output=csv";

async function updateDashboard() {
    try {
        const response = await fetch(CSV_URL);
        const data = await response.text();
        const rows = data.split('\n').map(row => row.split(','));
        const now = new Date();

        let saleHtml = ''; let tipsHtml = '';
        let couponData = { rakuten: [], jalan: [], other: [] };

        for(let i = 1; i < rows.length; i++) {
            const row = rows[i].map(s => s?.trim());
            const [type, title, start, end, url, desc, discount, fullText] = row;
            if(!type || !title) continue;

            if (now >= new Date(start) && now <= new Date(end)) {
                if (type === 'SALE') {
                    saleHtml += `<a href="${url}" class="limited-sale-card"><div class="sale-badge-big"><span style="font-size:10px;">MAX</span><div style="font-size:22px;">${discount}</div></div><div class="sale-content"><div class="sale-title">${title}</div><div class="sale-desc">${desc}</div></div></a>`;
                } else if (type === 'COUPON') {
                    const cClass = title.includes("楽天")?"rakuten":title.includes("じゃらん")?"jalan":"other";
                    const card = `<a href="${url}" class="coupon-card ${cClass}"><div class="coupon-label">${discount}</div><div class="coupon-main"><div class="coupon-title">${title}</div><div class="coupon-code">${desc}</div></div></a>`;
                    couponData[cClass].push(card);
                } else if (type === 'TIPS') {
                    tipsHtml += `<div class="tips-card-new" onclick="openModal(\`${title}\`, \`${fullText || desc}\`)"><div class="tips-title-new">${title}</div></div>`;
                }
            }
        }

        const couponRoot = document.getElementById('coupon-root');
        couponRoot.innerHTML = '';
        const groups = [{id:'rakuten', name:'RAKUTEN TRAVEL'}, {id:'jalan', name:'JALAN.NET'}, {id:'other', name:'OTHERS'}];
        groups.forEach(g => {
            let gHtml = `<div class="coupon-group"><div class="group-label">${g.name}</div><div class="coupon-grid">`;
            if(couponData[g.id].length > 0) {
                couponData[g.id].forEach((card, idx) => {
                    if(idx === 4) gHtml += `<div id="more-${g.id}" style="display:none; contents;">`;
                    gHtml += card;
                });
                if(couponData[g.id].length > 4) gHtml += `</div><button style="grid-column: span 2; background: #222; color: #888; border: none; padding: 10px; border-radius: 8px; font-size: 10px; margin-top: 10px;" onclick="document.getElementById('more-${g.id}').style.display='contents';this.style.display='none'">+ VIEW MORE</button>`;
            } else {
                gHtml += `<a href="#" class="action-btn" style="grid-column: span 2; display:block; width:100%; box-sizing:border-box;">SITE CHECK</a>`;
            }
            gHtml += `</div></div>`;
            couponRoot.innerHTML += gHtml;
        });
        document.getElementById('sale-area').innerHTML = saleHtml || '<p style="padding:15px;color:#555;">NO SALES</p>';
        document.getElementById('tips-area').innerHTML = tipsHtml || '<p style="padding:15px;color:#555;">NO UPDATES</p>';
    } catch (e) { console.error(e); }
}

function openModal(title, text) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalBody').innerText = text;
    document.getElementById('modalOverlay').style.display = 'flex';
}
function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
updateDashboard();
</script>
</body>
</html>
