<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TRIP_DASH. | OFFICIAL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        :root {
            --bg-black: #0d0f11;
            --card-gray: #1c2126;
            --text-main: #ffffff;
            --text-sub: #8e8e93;
            --gold: #d4af37;
            --alert-red: #e74c3c;
            --rakuten-red: #bf0000;
            --jalan-orange: #ff9900;
            --ikyu-gold: #a68d52;
            --header-h: 120px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg-black); color: var(--text-main); font-family: -apple-system, sans-serif; padding-top: var(--header-h); }
        .container { padding: 15px; max-width: 800px; margin: 0 auto; }

        /* HEADER & NAV (継承) */
        header { position: fixed; top: 0; left: 0; width: 100%; background: rgba(13, 15, 17, 0.95); backdrop-filter: blur(10px); z-index: 9000; border-bottom: 1px solid #2a2a2a; }
        .header-top { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; }
        .logo { font-weight: 900; color: var(--gold); font-size: 20px; letter-spacing: 2px; }
        nav { display: flex; justify-content: center; gap: 8px; padding: 0 10px 12px; overflow-x: auto; }
        .nav-link { font-size: 11px; font-weight: 900; color: var(--text-main); text-decoration: none; padding: 8px 14px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); flex-shrink: 0; }

        /* SECTION HEADER */
        .section-header { display: flex; align-items: center; margin: 25px 0 15px; }
        .section-title { font-size: 11px; font-weight: 900; color: var(--gold); letter-spacing: 1.5px; }
        .section-line { height: 1px; background: linear-gradient(90deg, var(--gold), transparent); width: 100%; margin-left: 10px; opacity: 0.4; }

        /* PRIORITY SALES (最大3件) */
        .sale-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .sale-card {
            background: #1c1c1e; border-radius: 20px; border: 1px solid #2c2c2e;
            padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;
            text-decoration: none; position: relative; overflow: hidden; transition: 0.3s;
        }

        /* セール開催中の強調（光の帯＋ゴールド枠） */
        .sale-card.active-sale { border: 1px solid var(--gold); box-shadow: 0 0 20px rgba(212, 175, 55, 0.2); }
        .sale-card.active-sale::after {
            content: ""; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
            transform: skewX(-25deg); animation: card-flash 4s infinite;
        }
        @keyframes card-flash { 0% { left: -100%; } 25% { left: 150%; } 100% { left: 150%; } }

        .brand-info { display: flex; align-items: center; gap: 15px; }
        .brand-logo-circle {
            width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: 900; color: #fff;
        }
        .brand-rakuten { background: var(--rakuten-red); }
        .brand-jalan { background: var(--jalan-orange); }
        .brand-ikyu { background: var(--ikyu-gold); }

        .sale-info-text { display: flex; flex-direction: column; }
        .sale-name { font-size: 15px; font-weight: 900; color: #fff; display: flex; align-items: center; gap: 6px; }
        
        /* 割引率のアピールタグ */
        .sale-f-txt { font-size: 10px; background: var(--alert-red); color: #fff; padding: 1px 6px; border-radius: 4px; font-weight: 900; margin-left: 5px; }

        .sale-disc { font-size: 11px; color: var(--text-sub); margin-top: 3px; }
        
        /* 開始日のアピール */
        .sale-start-date { font-size: 10px; color: var(--gold); font-weight: 900; margin-top: 4px; display: flex; align-items: center; gap: 4px; }

        .sale-badge {
            padding: 8px 16px; border-radius: 12px; font-size: 11px; font-weight: 900;
            color: var(--gold); border: 1px solid var(--gold); white-space: nowrap;
        }
        .active-sale .sale-badge { background: var(--gold); color: #000; }

        /* エラー・情報なし時の表示 */
        .no-sale-info { font-size: 11px; color: var(--text-sub); text-align: center; padding: 20px; border: 1px dashed #2c2c2e; border-radius: 20px; }
    </style>
</head>
<body>

    <header id="main-header">
        <div class="header-top">
            <div class="logo">TRIP_DASH.</div>
            <div class="refresh-btn" onclick="forceReloadData()"><i id="refresh-icon" class="fa-solid fa-arrows-rotate"></i></div>
        </div>
        <nav><a href="#sale" class="nav-link">Sale</a><a href="#area" class="nav-link">Area</a></nav>
    </header>

    <div class="container">
        <section id="sale">
            <div class="section-header">
                <div class="section-title">PRIORITY SALES</div>
                <div class="section-line"></div>
            </div>

            <div class="sale-grid" id="priority-sale-grid">
                </div>
        </section>
    </div>

    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSYeo6mC85kmstRg6iJaxb7dgvy37mPo3knc09k0-82LZF_M5xaYRoRXbsUJig1CKldigIl03CT0Kww/pub?gid=0&single=true&output=csv";

        async function forceReloadData() {
            try {
                const res = await fetch(CSV_URL + `&t=${new Date().getTime()}`);
                const text = await res.text();
                processCSVData(text);
            } catch (e) { console.error("Load Error"); }
        }

        function processCSVData(text) {
            const rows = text.split('\n').slice(1).filter(r => r.trim());
            const now = new Date();
            const grid = document.getElementById('priority-sale-grid');
            grid.innerHTML = '';

            // 1. まず全SALEデータをパース
            let saleItems = rows.map(line => {
                const cols = line.split('\t').map(c => c.trim());
                if (cols.length < 9) return null;
                const [type, brand, title, start, end, url, direct, disc, fTxt] = cols;
                return { type, brand, title, start, end, url, disc, fTxt };
            }).filter(item => item && item.type === 'SALE');

            // 2. 開催中を優先しつつ、上位3件に絞る
            const activeSales = saleItems.filter(s => now >= new Date(s.start) && now <= new Date(s.end)).slice(0, 3);
            
            // 3. 開催中がない場合のフォールバック（予定されているセールを表示）
            const displayItems = activeSales.length > 0 ? activeSales : saleItems.slice(0, 3);

            if (displayItems.length === 0) {
                grid.innerHTML = '<div class="no-sale-info">現在、ご案内できる特別セールはございません。</div>';
                return;
            }

            displayItems.forEach(item => {
                const isActive = now >= new Date(item.start) && now <= new Date(item.end);
                const brandKey = item.brand.includes('楽天') ? 'rakuten' : (item.brand.includes('じゃらん') ? 'jalan' : 'ikyu');
                const brandInitial = item.brand.includes('楽天') ? 'R' : (item.brand.includes('じゃらん') ? 'J' : '一');
                const startDateStr = item.start.replace(/\//g, '.');

                const cardHtml = `
                    <a href="${item.url}" class="sale-card ${isActive ? 'active-sale' : ''}">
                        <div class="brand-info">
                            <div class="brand-logo-circle brand-${brandKey}">${brandInitial}</div>
                            <div class="sale-info-text">
                                <div class="sale-name">
                                    ${item.brand}
                                    ${item.fTxt ? `<span class="sale-f-txt">${item.fTxt}</span>` : ''}
                                </div>
                                <div class="sale-disc">${item.disc}</div>
                                <div class="sale-start-date">
                                    <i class="fa-regular fa-calendar-check"></i> 期間: ${startDateStr} 〜
                                </div>
                            </div>
                        </div>
                        <div class="sale-badge">${isActive ? '予約する' : '詳細確認'}</div>
                    </a>
                `;
                grid.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        forceReloadData();
    </script>
</body>
</html>
