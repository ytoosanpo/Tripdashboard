<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TRIP_DASH. | Tactical</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        :root {
            --biz-bg: #0d0f11; --biz-card: #1c1f23;
            --rakuten-green: #28a745; --jalan-orange: #ff9900; --ikyu-gold: #a68b5e;
            --text-main: #ffffff; --text-sub: #8e8e93; --accent-gold: #d4af37; 
            --emergency-red: #e74c3c;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--biz-bg); color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding-top: 70px;
        }
        
        /* 緊急帯：セーフエリア対応 */
        #emergency-bar { 
            display: none; background: var(--emergency-red); color: #fff; 
            padding: calc(6px + env(safe-area-inset-top)) 15px 6px;
            font-size: 11px; font-weight: 900; text-align: center; 
            position: fixed; top: 0; width: 100%; z-index: 5000;
        }
        body.has-emergency { padding-top: 100px; }
        body.has-emergency .biz-header { top: calc(32px + env(safe-area-inset-top)); }

        .biz-header { 
            height: 60px; background: rgba(13,15,17,0.95); backdrop-filter: blur(10px);
            border-bottom: 1px solid #333; display: flex; align-items: center; 
            justify-content: space-between; padding: 0 20px;
            position: fixed; top: 0; width: 100%; z-index: 4000;
        }
        .biz-logo { font-weight: 900; color: var(--accent-gold); text-decoration: none; font-size: 18px; letter-spacing: 1px; }
        
        .container { width: 100%; max-width: 800px; margin: 0 auto; padding: 20px 15px; }
        .section-title { font-size: 10px; font-weight: 800; color: var(--text-sub); border-left: 3px solid var(--accent-gold); padding-left: 8px; margin: 25px 0 15px; text-transform: uppercase; letter-spacing: 1px; }

        /* HOTEL SWIPE */
        .swipe-wrap { display: flex; overflow-x: auto; gap: 12px; padding-bottom: 15px; scroll-snap-type: x mandatory; }
        .swipe-wrap::-webkit-scrollbar { display: none; }
        .hotel-card-mini { flex: 0 0 240px; background: var(--biz-card); border-radius: 12px; overflow: hidden; border: 1px solid #333; text-decoration: none; color: inherit; scroll-snap-align: start; }
        .mini-img { height: 130px; background-size: cover; background-position: center; position: relative; background-color: #222; }
        .mini-brand { position: absolute; top: 8px; left: 8px; font-size: 8px; font-weight: 900; padding: 3px 6px; border-radius: 4px; color: #fff; }
        .mini-info { padding: 12px; }
        .mini-name { font-size: 13px; font-weight: 900; color: #fff; height: 38px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.45; }

        /* COUPON LOGIC */
        .coupon-group { margin-bottom: 20px; }
        .cp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .cp-item { background: var(--biz-card); border: 1px solid #333; border-radius: 8px; display: flex; height: 70px; text-decoration: none; overflow: hidden; }
        .cp-side { width: 70px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; color: #fff; text-align: center; line-height: 1.2; }
        .cp-main { flex: 1; padding: 10px; display: flex; flex-direction: column; justify-content: center; }
        .cp-title { font-size: 11px; font-weight: 800; color: #fff; line-height: 1.3; }
        
        .hidden-coupons { display: none; }
        .hidden-coupons.is-open { display: grid; margin-top: 8px; }
        .more-btn { width: 100%; background: #262a2e; border: 1px solid #444; color: var(--text-sub); font-size: 10px; font-weight: 800; padding: 10px; border-radius: 6px; margin-top: 8px; cursor: pointer; }

        /* TIPS */
        .tips-card { background: var(--biz-card); border: 1px solid #333; border-radius: 8px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
        .tips-icon { color: var(--accent-gold); font-size: 14px; }
        .tips-title { font-size: 12px; font-weight: 800; color: #eee; }

        /* FIELD OP */
        .op-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .op-card { background: var(--biz-card); border: 1px solid #333; border-radius: 10px; padding: 12px; }
        .op-label { font-size: 9px; color: var(--text-sub); font-weight: 900; }
        .op-val { font-size: 13px; font-weight: 900; margin-top: 4px; display: flex; align-items: center; gap: 6px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .bg-green { background: #2ecc71; } .bg-red { background: var(--emergency-red); }
    </style>
</head>
<body>

<div id="emergency-bar"></div>
<header class="biz-header">
    <a href="#" class="biz-logo">TRIP_DASH.</a>
    <div id="header-date" style="font-size: 10px; font-weight: 900; font-family: monospace;"></div>
</header>

<div class="container">
    <div class="section-title">Field Operations</div>
    <div class="op-grid">
        <div class="op-card"><div class="op-label">WEATHER</div><div class="op-val" id="temp-val">--°C</div><div id="local-city" style="font-size:9px; color:var(--text-sub);">Detecting...</div></div>
        <div class="op-card"><div class="op-label">SHINKANSEN</div><div class="op-val"><div id="dot-s" class="status-dot bg-green"></div><span id="txt-s">Normal</span></div></div>
        <div class="op-card"><div class="op-label">AIRLINE</div><div class="op-val"><div id="dot-a" class="status-dot bg-green"></div><span id="txt-a">Normal</span></div></div>
        <div class="op-card"><div class="op-label">NEWS</div><div id="news-tag" style="font-size:11px; font-weight:900;">No Alerts</div></div>
    </div>

    <section id="recom-section" style="display:none;">
        <div class="section-title">Recommended Hotels</div>
        <div class="swipe-wrap" id="recom-root"></div>
    </section>

    <section id="coupon-section" style="display:none;">
        <div class="section-title">Active Coupons</div>
        <div id="coupon-root"></div>
    </section>

    <div class="section-title">Business Intelligence</div>
    <div id="tips-root"></div>
</div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSYeo6mC85kmstRg6iJaxb7dgvy37mPo3knc09k0-82LZF_M5xaYRoRXbsUJig1CKldigIl03CT0Kww/pub?gid=0&single=true&output=csv";

function toggleCoupons(btn, id) {
    const target = document.getElementById(id);
    const isOpen = target.classList.toggle('is-open');
    btn.innerText = isOpen ? "閉じる" : "さらに表示";
}

async function loadData() {
    try {
        const res = await fetch(CSV_URL);
        const csv = await res.text();
        const rows = csv.split(/\r?\n/).map(r => r.split(',').map(s => s.trim().replace(/^"|"$/g, '')));
        const now = new Date();
        
        let hHtml = ''; let tHtml = '';
        let coupons = { rak:[], jal:[], iky:[], otr:[] };

        rows.slice(1).forEach(row => {
            const [type, brand, title, start, end, url, img_url, disc, fTxt] = row;
            if(!type) return;
            const isExpired = (start && end && (now < new Date(start) || now > new Date(end)));
            if(type !== 'EMERGENCY' && isExpired) return;

            if(type === 'EMERGENCY') {
                const bar = document.getElementById('emergency-bar');
                bar.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${title}`;
                bar.style.display = 'block'; document.body.classList.add('has-emergency');
            } else if(type === 'HOTEL') {
                const bCol = brand.includes("楽天")?"#28a745":brand.includes("じゃらん")?"#ff9900":"#a68b5e";
                const bgStyle = img_url ? `background-image:url('${img_url}')` : `background-color:#222`;
                hHtml += `<a href="${url}" target="_blank" class="hotel-card-mini">
                    <div class="mini-img" style="${bgStyle}"><div class="mini-brand" style="background:${bCol}">${brand}</div></div>
                    <div class="mini-info"><div class="mini-name">${title}</div></div></a>`;
            } else if(type === 'COUPON') {
                const bCol = brand.includes("楽天")?"#28a745":brand.includes("じゃらん")?"#ff9900":"#a68b5e";
                const key = brand.includes("楽天")?"rak":brand.includes("じゃらん")?"jal":brand.includes("一休")?"iky":"otr";
                coupons[key].push(`<a href="${url}" target="_blank" class="cp-item">
                    <div class="cp-side" style="background:${bCol}">${disc}</div>
                    <div class="cp-main"><div class="cp-title">${title}</div></div></a>`);
            } else if(type === 'TIPS') {
                tHtml += `<div class="tips-card"><i class="fa-solid fa-lightbulb tips-icon"></i><div class="tips-title">${title}</div></div>`;
            }
        });

        // クーポン表示ロジック
        let cpHtml = '';
        for(let key in coupons) {
            if(coupons[key].length === 0) continue;
            const visible = coupons[key].slice(0, 4).join('');
            const hidden = coupons[key].slice(4).join('');
            cpHtml += `<div class="coupon-group"><div class="cp-grid">${visible}</div>`;
            if(hidden) {
                const id = `cp-more-${key}`;
                cpHtml += `<div id="${id}" class="cp-grid hidden-coupons">${hidden}</div><button class="more-btn" onclick="toggleCoupons(this, '${id}')">さらに表示</button>`;
            }
            cpHtml += `</div>`;
        }

        document.getElementById('recom-root').innerHTML = hHtml;
        document.getElementById('recom-section').style.display = hHtml ? 'block' : 'none';
        document.getElementById('coupon-root').innerHTML = cpHtml;
        document.getElementById('coupon-section').style.display = cpHtml ? 'block' : 'none';
        document.getElementById('tips-root').innerHTML = tHtml;

    } catch(e) { console.error(e); }
}

function init() {
    const d = new Date(); 
    document.getElementById('header-date').innerText = `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} OPS`;
    loadData();
}
init();
</script>
</body>
</html>
