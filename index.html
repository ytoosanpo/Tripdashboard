<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TRIP_DASH. | OFFICIAL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        :root {
            --bg-black: #0d0f11; --card-gray: #1c2126;
            --text-main: #ffffff; --text-sub: #8e8e93;
            --gold: #d4af37; --alert-red: #e74c3c;
            --success-green: #2ecc71; --caution-yellow: #f1c40f; --blue: #007aff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { background: var(--bg-black); color: var(--text-main); font-family: -apple-system, sans-serif; padding-top: 140px; }

        /* EMERGENCY BANNER (最上部) */
        #emergency-banner {
            display: none; position: fixed; top: 0; left: 0; width: 100%;
            background: var(--alert-red); color: #fff; padding: 10px;
            font-size: 11px; font-weight: 900; text-align: center; z-index: 10000;
            letter-spacing: 1px;
        }

        /* HEADER & NAV */
        header {
            position: fixed; top: 0; left: 0; width: 100%;
            background: rgba(13, 15, 17, 0.95); backdrop-filter: blur(10px);
            z-index: 9000; border-bottom: 1px solid #2a2a2a;
            transition: top 0.3s;
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px 10px; }
        .logo { font-weight: 900; color: var(--gold); font-size: 20px; letter-spacing: 2px; }
        
        .refresh-btn {
            width: 36px; height: 36px; border-radius: 10px; border: 1px solid rgba(212,175,55,0.3);
            color: var(--gold); display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .refresh-btn.success { border-color: var(--success-green); color: var(--success-green); background: rgba(46,204,113,0.1); }
        .spin { animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        nav { display: flex; gap: 20px; padding: 0 20px 15px; overflow-x: auto; }
        .nav-link { font-size: 10px; font-weight: 900; color: var(--text-sub); text-decoration: none; text-transform: uppercase; }

        /* HUB CONTENT */
        .container { padding: 20px; max-width: 800px; margin: 0 auto; }
        .section-header { display: flex; align-items: center; margin: 20px 0; }
        .section-title { font-size: 12px; font-weight: 900; color: var(--gold); }
        .section-line { height: 1px; background: linear-gradient(90deg, var(--gold), transparent); width: 100%; margin-left: 15px; opacity: 0.5; }

        .hub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .hub-card { background: var(--card-gray); border-radius: 16px; padding: 20px; border: 1px solid #2a2a2a; cursor: pointer; min-height: 110px; }
        .hub-label { font-size: 11px; color: var(--text-sub); font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .hub-val { font-size: 16px; font-weight: 900; display: flex; align-items: center; gap: 8px; }

        .sub-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .sub-card { background: var(--card-gray); border-radius: 14px; padding: 15px 5px; border: 1px solid #2a2a2a; text-align: center; cursor: pointer; }
        .sub-icon { font-size: 18px; color: var(--gold); margin-bottom: 8px; }
        .sub-txt { font-size: 9px; color: var(--text-sub); font-weight: 900; }

        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot.green { background: var(--success-green); box-shadow: 0 0 8px var(--success-green); }
        .dot.yellow { background: var(--caution-yellow); box-shadow: 0 0 8px var(--caution-yellow); }
        .dot.red { background: var(--alert-red); box-shadow: 0 0 8px var(--alert-red); }

        /* MODAL (以前の定義を維持) */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--card-gray); width: 100%; max-width: 340px; border-radius: 24px; border: 1px solid var(--gold); padding: 30px 20px; }
        .btn-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .choice-btn { padding: 16px; border-radius: 12px; color: #fff; font-weight: 900; text-align: center; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>

    <div id="emergency-banner"></div>

    <header id="main-header">
        <div class="header-top">
            <div class="logo">TRIP_DASH.</div>
            <div class="refresh-btn" id="refresh-btn" onclick="forceReloadData()">
                <i id="refresh-icon" class="fa-solid fa-arrows-rotate"></i>
            </div>
        </div>
        <nav>
            <a href="#field-ops" class="nav-link">Hub</a>
            <a href="#sale" class="nav-link">Sale</a>
            <a href="#area" class="nav-link">Area</a>
            <a href="#coupon" class="nav-link">Coupon</a>
            <a href="#tips" class="nav-link">Tips</a>
        </nav>
    </header>

    <div class="container">
        <section id="field-ops">
            <div class="section-header">
                <div class="section-title">INTELLIGENCE HUB</div>
                <div class="section-line"></div>
            </div>

            <div class="hub-grid">
                <div class="hub-card" onclick="openModal('transit')">
                    <div class="hub-label"><i class="fa-solid fa-train"></i> Transit</div>
                    <div class="hub-val" id="transit-display"><div class="dot green"></div> 正常運行</div>
                </div>
                <div class="hub-card" onclick="openModal('weather')">
                    <div class="hub-label"><i class="fa-solid fa-location-dot"></i> <span id="location-name">Tokyo</span></div>
                    <div class="hub-val" id="weather-display">--°C</div>
                </div>
            </div>

            <div class="sub-grid">
                <div class="sub-card" onclick="openModal('highway')">
                    <i class="fa-solid fa-car sub-icon" id="icon-highway"></i>
                    <div class="sub-txt">HIGHWAY</div>
                </div>
                <div class="sub-card" onclick="openModal('flight')">
                    <i class="fa-solid fa-plane sub-icon" id="icon-flight"></i>
                    <div class="sub-txt">FLIGHT</div>
                </div>
                <div class="sub-card" onclick="openModal('rain')">
                    <i class="fa-solid fa-cloud-showers-heavy sub-icon"></i>
                    <div class="sub-txt">RAIN</div>
                </div>
                <div class="sub-card" onclick="openModal('news')">
                    <i class="fa-solid fa-rss sub-icon"></i>
                    <div class="sub-txt">NEWS</div>
                </div>
            </div>
        </section>
    </div>

    <div id="hub-modal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div id="modal-title" style="color:var(--gold); font-weight:900; text-align:center; margin-bottom:20px; font-size:14px;"></div>
            <div id="modal-btns" class="btn-grid"></div>
            <button onclick="closeModal()" style="width:100%; background:none; border:none; color:var(--text-sub); margin-top:20px; font-weight:900; font-size:12px; cursor:pointer;">CLOSE</button>
        </div>
    </div>

    <script>
        const CSV_BASE_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSYeo6mC85kmstRg6iJaxb7dgvy37mPo3knc09k0-82LZF_M5xaYRoRXbsUJig1CKldigIl03CT0Kww/pub?gid=0&single=true&output=csv";

        const MODAL_DATA = {
            transit: { t: "TRANSIT INFO", b: [ {n:"JR東日本", l:"https://traininfo.jreast.co.jp/train_info/service.aspx", c:"#28a745"}, {n:"東京メトロ", l:"https://www.tokyometro.jp/unkou/", c:"var(--blue)"}, {n:"JR東海", l:"https://traininfo.jr-central.co.jp/shinkansen/pc/ja/index.html", c:"#ff9900"} ] },
            weather: { t: "WEATHER INFO", b: [ {n:"気象庁", l:"https://www.jma.go.jp/jp/yoho/", c:"var(--blue)"}, {n:"ウェザーニュース", l:"https://weathernews.jp/onebox/", c:"#e67e22"}, {n:"日本気象協会", l:"https://tenki.jp/", c:"#2ecc71"} ] },
            highway: { t: "HIGHWAY INFO", b: [ {n:"iHighway", l:"https://ihighway.jp/", c:"#2c3e50"}, {n:"ドラぷら", l:"https://www.driveplaza.com/", c:"var(--blue)"}, {n:"JARTIC", l:"https://www.jartic.or.jp/", c:"#e74c3c"} ] },
            flight: { t: "FLIGHT INFO", b: [ {n:"JAL 運航状況", l:"https://www.jal.co.jp/cms/other/ja/weather_info_dom.html", c:"#e74c3c"}, {n:"ANA 運航状況", l:"https://www.ana.co.jp/fs/dom/jp/", c:"var(--blue)"}, {n:"スカイマーク", l:"https://www.skymark.co.jp/ja/fly/flight_status.html", c:"#f1c40f"} ] },
            rain: { t: "RAIN RADAR", b: [ {n:"雨雲レーダー", l:"https://www.jma.go.jp/bosai/nowc/", c:"var(--blue)"}, {n:"Yahoo! 天気", l:"https://weather.yahoo.co.jp/weather/zoomradar/", c:"#e74c3c"}, {n:"MSN 天気", l:"https://www.msn.com/ja-jp/weather/maps/rain/", c:"var(--blue)"} ] },
            news: { t: "LATEST NEWS", b: [ {n:"Yahoo! ニュース", l:"https://news.yahoo.co.jp/", c:"#e74c3c"}, {n:"NHK ニュース", l:"https://www3.nhk.or.jp/news/", c:"var(--blue)"}, {n:"日経新聞", l:"https://www.nikkei.com/", c:"#2c3e50"} ] }
        };

        async function forceReloadData() {
            const btn = document.getElementById('refresh-btn');
            const icon = document.getElementById('refresh-icon');
            icon.classList.add('spin');
            
            try {
                const res = await fetch(CSV_BASE_URL + `&t=${new Date().getTime()}`);
                const text = await res.text();
                processCSVData(text);
                await getIPWeather();
                
                icon.classList.remove('spin');
                icon.className = "fa-solid fa-check";
                btn.classList.add('success');
                setTimeout(() => {
                    icon.className = "fa-solid fa-arrows-rotate";
                    btn.classList.remove('success');
                }, 2000);
            } catch (e) { icon.classList.remove('spin'); }
        }

        async function getIPWeather() {
            try {
                const ipRes = await fetch('https://ipapi.co/json/');
                const ipData = await ipRes.json();
                document.getElementById('location-name').innerText = ipData.city || "Tokyo";
                const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${ipData.latitude}&longitude=${ipData.longitude}&current_weather=true`);
                const wData = await wRes.json();
                const temp = Math.round(wData.current_weather.temperature);
                const disp = document.getElementById('weather-display');
                const hasCaution = disp.innerHTML.includes('dot yellow') || disp.innerHTML.includes('dot red');
                disp.innerHTML = (hasCaution ? disp.querySelector('.dot').outerHTML : '') + ` ${temp}°C Current`;
            } catch (e) { document.getElementById('weather-display').innerHTML = "12°C Cloudy"; }
        }

        function processCSVData(text) {
            const rows = text.split('\n').slice(1).filter(r => r.trim());
            const banner = document.getElementById('emergency-banner');
            const header = document.getElementById('main-header');
            
            // 初期状態リセット
            banner.style.display = 'none';
            header.style.top = '0';
            document.body.style.paddingTop = '110px';
            document.getElementById('transit-display').innerHTML = `<div class="dot green"></div> 正常運行`;
            document.getElementById('icon-highway').style.color = "var(--gold)";
            document.getElementById('icon-flight').style.color = "var(--gold)";

            rows.forEach(line => {
                const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.trim().replace(/^"|"$/g, ''));
                const [type, brand, title] = cols;

                if (type === 'EMERGENCY') {
                    // EMERGENCY発動：バナー表示
                    banner.innerText = `【！】 ${title}`;
                    banner.style.display = 'block';
                    header.style.top = '35px'; // バナーの高さ分ヘッダーを下げる
                    document.body.style.paddingTop = '145px';

                    // 強制🔴/🟡転換
                    document.getElementById('transit-display').innerHTML = `<div class="dot red"></div> ${title}`;
                    document.getElementById('icon-highway').style.color = "var(--alert-red)";
                    document.getElementById('icon-flight').style.color = "var(--alert-red)";
                    
                    const wDisp = document.getElementById('weather-display');
                    if(!wDisp.innerHTML.includes('dot')) {
                        wDisp.innerHTML = `<div class="dot yellow"></div>` + wDisp.innerHTML;
                    }
                }
            });
        }

        function openModal(key) {
            const data = MODAL_DATA[key];
            document.getElementById('modal-title').innerText = data.t;
            document.getElementById('modal-btns').innerHTML = data.b.map(b => `<a href="${b.l}" target="_blank" class="choice-btn" style="background:${b.c}">${b.n}</a>`).join('');
            document.getElementById('hub-modal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('hub-modal').style.display = 'none'; }

        forceReloadData();
    </script>
</body>
</html>
