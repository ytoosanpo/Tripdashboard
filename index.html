<!DOCTYPE html>  
<html lang="ja">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>TRIP_DASH. | ビジネス旅行ダッシュボード</title>  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />  
    <style>  
        :root {  
            --biz-bg: #1a1c1e; --biz-card: #282a2d; --biz-blue: #007aff;  
            --text-main: #ffffff; --text-sub: #b0b3b8; --accent-gold: #d4af37; --header-h: 65px;  
        }  
        body { margin: 0; background: var(--biz-bg); font-family: -apple-system, sans-serif; color: var(--text-main); }  
        .biz-header { position: fixed; top: 0; width: 100%; height: var(--header-h); background: rgba(26,28,30,0.85); backdrop-filter: blur(15px); border-bottom: 1px solid #3a3b3c; z-index: 2000; display: flex; align-items: center; padding: 0 20px; box-sizing: border-box; }  
        .biz-logo { font-weight: 900; color: var(--accent-gold); text-decoration: none; font-size: 20px; }  
  
        /* インテリジェンス */  
        .intel-section { margin-top: calc(var(--header-h) + 15px); padding: 0 15px; }  
        .builtin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }  
        .builtin-card { border-radius: 12px; padding: 15px; text-decoration: none; color: inherit; border: 1px solid #3a3b3c; background: var(--biz-card); }  
        .weather-card { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); border: none; }  
        .intel-label { font-size: 11px; color: var(--accent-gold); margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }  
        .status-dot { width: 8px; height: 8px; background: #4caf50; border-radius: 50%; box-shadow: 0 0 8px #4caf50; }  
        .intel-val { font-size: 14px; font-weight: bold; margin: 0; }  
  
        .intel-icon-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 20px; }  
        .icon-btn { background: var(--biz-card); border-radius: 10px; padding: 10px; border: 1px solid #3a3b3c; text-decoration: none; color: inherit; text-align: center; font-size: 10px; }  
        .icon-btn i { font-size: 16px; margin-bottom: 5px; display: block; color: var(--accent-gold); }  
  
        /* 動的要素 */  
        .section-title { padding: 20px 20px 10px; font-size: 12px; font-weight: bold; color: var(--accent-gold); display: flex; align-items: center; gap: 8px; }  
        .sale-container, .coupon-grid { padding: 0 15px; display: grid; gap: 10px; }  
  
        /* セールカード */  
        .limited-sale-card { background: linear-gradient(145deg, #2d2a20 0%, #1a1c1e 100%); border: 1px solid var(--accent-gold); border-radius: 12px; padding: 15px; text-decoration: none; color: inherit; display: none; }  
          
        /* クーポンカード */  
        .coupon-card { background: #fff; border-radius: 8px; display: none; overflow: hidden; border: 1px solid #ddd; text-decoration: none; color: #333; }  
        .coupon-left { background: var(--biz-blue); color: #fff; padding: 10px; width: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 9px; font-weight: bold; border-right: 2px dashed #fff; text-align: center; }  
        .coupon-main { flex: 1; padding: 10px; background: #f8f9fa; }  
        .coupon-code { display: inline-block; background: #eef2f7; padding: 2px 8px; border-radius: 4px; font-family: monospace; font-size: 11px; margin-top: 4px; border: 1px dashed #abc; color: var(--biz-blue); font-weight: bold; }  
  
        .timer { color: #ff453a; font-size: 11px; font-weight: bold; margin-top: 8px; }  
    </style>  
</head>  
<body>  
  
<header class="biz-header"><a href="#" class="biz-logo">TRIP_DASH.</a></header>  
  
<div class="intel-section">  
    <div class="builtin-grid">  
        <a href="https://traininfo.jr-central.co.jp/shinkansen/pc/ja/index.html" target="_blank" class="builtin-card">  
            <div class="intel-label"><span class="status-dot"></span> JR 運行状況</div>  
            <p class="intel-val">東海道新幹線<br>平常運転</p>  
        </a>  
        <a href="https://weathernews.jp/onebox/" target="_blank" class="builtin-card weather-card">  
            <div class="intel-label" style="color:#fff;"><i class="fa-solid fa-cloud-sun"></i> 東京の天気</div>  
            <p class="intel-val" style="color:#fff;">12°C Cloudy</p>  
        </a>  
    </div>  
    <div class="intel-icon-grid">  
        <a href="https://www.jartic.or.jp/" target="_blank" class="icon-btn"><i class="fa-solid fa-car"></i>渋滞情報</a>  
        <a href="https://ja.flightaware.com/live/" target="_blank" class="icon-btn"><i class="fa-solid fa-plane"></i>フライト</a>  
        <a href="https://weathernews.jp/onebox/radar/" target="_blank" class="icon-btn"><i class="fa-solid fa-cloud-showers-heavy"></i>雨雲レーダー</a>  
    </div>  
</div>  
  
<div class="section-title"><i class="fa-solid fa-fire"></i> Priority Sales</div>  
<div id="sale-area" class="sale-container"></div>  
  
<div class="section-title"><i class="fa-solid fa-ticket"></i> Active Coupons</div>  
<div id="coupon-area" class="coupon-grid"></div>  
  
<script>  
/** * 【設定】スプレッドシートをCSV公開したURLをここに貼る  
 */  
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSYeo6mC85kmstRg6iJaxb7dgvy37mPo3knc09k0-82LZF_M5xaYRoRXbsUJig1CKldigIl03CT0Kww/pub?gid=0&single=true&output=csv
";  
  
async function updateDashboard() {  
    try {  
        const response = await fetch(CSV_URL);  
        const data = await response.text();  
        const rows = data.split('\n').map(row => row.split(','));  
        const now = new Date();  
  
        let saleHtml = '';  
        let couponHtml = '';  
  
        // 2行目から解析  
        for(let i = 1; i < rows.length; i++) {  
            const [type, title, start, end, url, descOrCode, discount] = rows[i];  
            if(!type) continue;  
  
            const startTime = new Date(start);  
            const endTime = new Date(end);  
  
            // 【自動判定】現在時刻が開始〜終了の間であれば表示  
            if (now >= startTime && now <= endTime) {  
                if (type.trim() === 'SALE') {  
                    saleHtml += `  
                    <a href="${url}" class="limited-sale-card" style="display:block">  
                        <span style="background:var(--accent-gold); color:#000; font-size:9px; padding:2px 6px; border-radius:3px; font-weight:bold;">LIMITED</span>  
                        <h3 style="margin:8px 0 5px; font-size:16px;">${title}</h3>  
                        <p style="font-size:11px; color:var(--text-sub); margin:0;">${descOrCode}</p>  
                        <div class="timer" id="timer-${i}">終了まで計算中...</div>  
                    </a>`;  
                    setupTimer(`timer-${i}`, endTime);  
                } else if (type.trim() === 'COUPON') {  
                    couponHtml += `  
                    <a href="${url}" class="coupon-card" style="display:flex">  
                        <div class="coupon-left">COUPON<br>${discount}</div>  
                        <div class="coupon-main">  
                            <div style="font-size:12px; font-weight:bold;">${title}</div>  
                            <div class="coupon-code">${descOrCode}</div>  
                        </div>  
                    </a>`;  
                }  
            }  
        }  
        document.getElementById('sale-area').innerHTML = saleHtml || '<p style="font-size:11px; color:#555;">現在開催中のセールはありません</p>';  
        document.getElementById('coupon-area').innerHTML = couponHtml || '<p style="font-size:11px; color:#555;">現在有効なクーポンはありません</p>';  
  
    } catch (e) { console.error("Load Error", e); }  
}  
  
function setupTimer(id, end) {  
    setInterval(() => {  
        const now = new Date();  
        const diff = end - now;  
        if (diff <= 0) {  
            document.getElementById(id).closest('.limited-sale-card').style.display = 'none';  
            return;  
        }  
        const h = Math.floor(diff / 3600000);  
        const m = Math.floor((diff % 3600000) / 60000);  
        const s = Math.floor((diff % 60000) / 1000);  
        const el = document.getElementById(id);  
        if(el) el.innerHTML = `<i class="fa-solid fa-clock"></i> 残り ${h}時間${m}分${s}秒`;  
    }, 1000);  
}  
  
updateDashboard();  
</script>  
</body>  
</html>
