<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TRIP_DASH. | INTELLIGENCE HUB</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        :root {
            --biz-bg: #0d0f11; --biz-card: #1c2126;
            --rakuten: #28a745; --jalan: #ff9900; --ikyu: #a68b5e;
            --text-main: #ffffff; --text-sub: #8e8e93; --gold: #d4af37;
            --alert-red: #e74c3c; --success-green: #2ecc71;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { background: var(--biz-bg); color: var(--text-main); font-family: -apple-system, sans-serif; padding-top: 60px; padding-bottom: 80px; }

        #emergency-banner { display: none; background: var(--alert-red); color: #fff; padding: 12px; font-size: 11px; font-weight: 900; text-align: center; position: fixed; top: 0; width: 100%; z-index: 9999; }

        /* HEADER */
        .header { height: 60px; border-bottom: 1px solid #333; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: sticky; top: 0; background: var(--biz-bg); z-index: 4000; }
        .logo { font-weight: 900; color: var(--gold); font-size: 18px; letter-spacing: 2px; }
        .date-now { font-size: 10px; font-weight: 900; }

        .container { width: 100%; max-width: 800px; margin: 0 auto; padding: 20px 15px; }
        .section-title { font-size: 10px; font-weight: 900; color: var(--gold); border-left: 4px solid var(--gold); padding-left: 12px; margin: 35px 0 15px; text-transform: uppercase; letter-spacing: 1px; }

        /* 1. INTELLIGENCE HUB (計器板) */
        .hub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .hub-card { background: var(--biz-card); border-radius: 12px; padding: 15px; border: 1px solid #2a2a2a; }
        .hub-label { font-size: 9px; color: var(--text-sub); font-weight: 900; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
        .hub-val { font-size: 13px; font-weight: 900; display: flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success-green); box-shadow: 0 0 8px var(--success-green); }

        /* 2. FIELD OPERATIONS (運行状況ミニカード) */
        .field-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
        .field-card { background: var(--biz-card); border-radius: 10px; padding: 12px 5px; border: 1px solid #2a2a2a; text-align: center; }
        .field-icon { font-size: 16px; color: var(--gold); opacity: 0.5; margin-bottom: 4px; }
        .field-txt { font-size: 8px; color: var(--text-sub); font-weight: 900; }

        /* 3. AREA SEARCH (画像背景セクション) */
        .area-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .area-card { height: 110px; border-radius: 12px; background-size: cover; background-position: center; position: relative; overflow: hidden; cursor: pointer; border: 1px solid #333; }
        .area-card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 70%); }
        .area-card:last-child { grid-column: span 2; height: 80px; }
        .area-info { position: absolute; bottom: 12px; left: 12px; z-index: 2; }
        .area-name { font-size: 12px; font-weight: 900; color: #fff; letter-spacing: 1px; }
        .area-sub { font-size: 8px; color: var(--gold); font-weight: 900; }

        /* 4. NOW ON SALE (ゴールド極太枠) */
        #special-sale-notify { display: none; background: linear-gradient(90deg, #b38910, #d4af37); color: #000; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 11px; font-weight: 900; text-align: center; }
        .sale-card { background: #000; border: 2.5px solid var(--gold); border-radius: 12px; margin-bottom: 15px; display: flex; text-decoration: none; overflow: hidden; }
        .sale-side { width: 90px; background: var(--gold); color: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; }
        .sale-main { flex: 1; padding: 18px; }
        .sale-title { font-size: 15px; font-weight: 900; color: #fff; }
        .sale-disc { font-size: 10px; color: var(--gold); margin-top: 6px; font-weight: 800; }

        /* 5. HOTEL SEARCH (スワイパー) */
        .hotel-swiper { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 10px; scroll-snap-type: x mandatory; }
        .hotel-card { flex: 0 0 270px; background: var(--biz-card); border-radius: 14px; border: 1px solid #333; overflow: hidden; text-decoration: none; scroll-snap-align: start; }
        .hotel-img { height: 140px; background-size: cover; background-position: center; position: relative; }
        .hotel-tag { position: absolute; top: 10px; left: 10px; font-size: 9px; padding: 4px 10px; border-radius: 4px; color: #fff; font-weight: 900; }
        .hotel-info { padding: 15px; }

        /* 6. PREMIUM COUPONS (ボーディングパス) */
        .cp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .cp-item { background: #e0e5eb; border-radius: 6px; display: flex; height: 110px; text-decoration: none; overflow: hidden; border: 1px solid #333; }
        .cp-main { flex: 1; padding: 12px; color: #1a1d21; display: flex; flex-direction: column; justify-content: center; }
        .cp-val { font-size: 18px; font-weight: 900; color: #000; }
        .cp-side { width: 35%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 900; position: relative; }
        .cp-side::before { content: ''; position: absolute; left: -1px; top: 10px; bottom: 10px; border-left: 2px dashed rgba(0,0,0,0.1); }

        /* 7. BUSINESS INTELLIGENCE (TIPS) */
        .tips-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .tips-card { background: #fdfaf5; border-radius: 4px; padding: 25px 15px; border: 1px solid #d4af37; text-align: center; color: #000; text-decoration: none; font-weight: 900; font-size: 13px; }

        /* FOOTER & SNS */
        .footer { margin-top: 60px; padding: 40px 20px; border-top: 1px solid #333; text-align: center; }
        .sns-links { display: flex; justify-content: center; gap: 25px; margin-bottom: 25px; }
        .sns-links a { color: var(--text-sub); font-size: 20px; }

        /* MODAL */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--biz-card); width: 100%; max-width: 400px; border-radius: 24px; border: 1px solid var(--gold); padding: 30px 20px; }
        .aff-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .aff-btn { padding: 18px; border-radius: 12px; color: #fff; font-weight: 900; text-align: center; text-decoration: none; font-size: 14px; }
        
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="emergency-banner"></div>
    <header class="header">
        <div class="logo">TRIP_DASH.</div>
        <div id="date-now" class="date-now"></div>
    </header>

    <div class="container">
        <div id="special-sale-notify"></div>

        <div class="section-title">Intelligence Hub</div>
        <div class="hub-grid">
            <div class="hub-card">
                <div class="hub-label"><i class="fa-solid fa-cloud-sun"></i> TOKYO WEATHER</div>
                <div class="hub-val">12°C / CLOUDY</div>
            </div>
            <div class="hub-card">
                <div class="hub-label"><i class="fa-solid fa-train"></i> SHINKANSEN</div>
                <div class="hub-val"><div class="dot"></div> NORMAL</div>
            </div>
        </div>

        <div class="field-grid">
            <div class="field-card"><i class="fa-solid fa-car field-icon"></i><div class="field-txt">HIGHWAY</div></div>
            <div class="field-card"><i class="fa-solid fa-plane field-icon"></i><div class="field-txt">FLIGHT</div></div>
            <div class="field-card"><i class="fa-solid fa-umbrella field-icon"></i><div class="field-txt">RAIN</div></div>
            <div class="field-card" onclick="location.reload()"><i class="fa-solid fa-rotate field-icon"></i><div class="field-txt">RELOAD</div></div>
        </div>

        <div class="section-title">Area Search</div>
        <div class="area-grid" id="area-root"></div>

        <div class="section-title">Now on Sale!!!</div>
        <div id="sale-root"></div>

        <div class="section-title">Hotel Search</div>
        <div id="hotel-root" class="hotel-swiper"></div>

        <div class="section-title">Premium Coupons</div>
        <div id="coupon-root" class="cp-grid"></div>

        <div class="section-title">Business Intelligence</div>
        <div id="tips-root" class="tips-grid"></div>
    </div>

    <footer class="footer">
        <div class="sns-links">
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="#"><i class="fa-brands fa-youtube"></i></a>
            <a href="#"><i class="fa-brands fa-tiktok"></i></a>
        </div>
        <div style="font-size:9px; color:var(--text-sub);">&copy; 2026 TRIP_DASH. PROMOTION INCLUDED</div>
    </footer>

    <div id="area-modal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div id="modal-area-name" style="color:var(--gold); font-weight:900; text-align:center; margin-bottom:25px; font-size:16px;"></div>
            <div class="aff-grid" id="aff-buttons"></div>
            <button onclick="closeModal()" style="width:100%; background:none; border:none; color:var(--text-sub); margin-top:25px; font-weight:900; cursor:pointer;">CLOSE</button>
        </div>
    </div>

    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSYeo6mC85kmstRg6iJaxb7dgvy37mPo3knc09k0-82LZF_M5xaYRoRXbsUJig1CKldigIl03CT0Kww/pub?gid=0&single=true&output=csv";

        const AREA_CONFIG = [
            { id: "tokyo", name: "TOKYO", sub: "STATION", img: "https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?auto=format&fit=crop&w=400&q=80", links: { rakuten: "https://a.r10.to/hYb8ED", jalan: "https://www.jalan.net/uw/uwp2011/uww2011init.do?keyword=%2593%258C%258B%259E%2589w", ikyu: "https://www.ikyu.com/tokyo/140000/" } },
            { id: "osaka", name: "OSAKA", sub: "UMEDA", img: "https://images.unsplash.com/photo-1590559899731-a382839e5549?auto=format&fit=crop&w=400&q=80", links: { rakuten: "https://a.r10.to/hkI4ez", jalan: "https://www.jalan.net/uw/uwp2011/uww2011search.do", ikyu: "https://www.ikyu.com/osaka/31101101/" } },
            { id: "nagoya", name: "NAGOYA", sub: "STATION", img: "https://images.unsplash.com/photo-1571752402773-8208643864a7?auto=format&fit=crop&w=400&q=80", links: { rakuten: "https://a.r10.to/hPVp2x", jalan: "https://www.jalan.net/uw/uwp2011/uww2011search.do", ikyu: "https://www.ikyu.com/tokai/23060311/" } },
            { id: "fukuoka", name: "FUKUOKA", sub: "HAKATA", img: "https://images.unsplash.com/photo-1623150532454-057088b3f114?auto=format&fit=crop&w=400&q=80", links: { rakuten: "https://a.r10.to/hPdo3g", jalan: "https://www.jalan.net/uw/uwp2011/uww2011search.do", ikyu: "https://www.ikyu.com/kyushu/35090111/" } },
            { id: "other", name: "OTHER AREAS", sub: "ALL JAPAN", img: "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=800&q=80", links: { rakuten: "https://a.r10.to/hPwqVk", jalan: "https://www.jalan.net/", ikyu: "https://www.ikyu.com/" } }
        ];

        function initApp() {
            const now = new Date();
            const day = now.getDate();
            const notify = document.getElementById('special-sale-notify');
            if ([5,10,15,20,25,30].includes(day)) {
                notify.innerHTML = `【本日開催】5と0のつく日SALE`; notify.style.display = 'block';
            } else if (day === 20) {
                notify.innerHTML = `【本日開催】じゃらんの日SALE`; notify.style.display = 'block';
            }

            document.getElementById('area-root').innerHTML = AREA_CONFIG.map(a => `
                <div class="area-card" style="background-image:url('${a.img}')" onclick="openAreaModal('${a.id}')">
                    <div class="area-info"><div class="area-name">${a.name}</div><div class="area-sub">${a.sub}</div></div>
                </div>
            `).join('');

            updateTime(); loadData();
        }

        function updateTime() {
            const n = new Date();
            document.getElementById('date-now').innerText = n.toLocaleDateString('ja-JP', {month:'numeric', day:'numeric', weekday:'short'}).toUpperCase().replace(/\//g, '.') + " " + n.toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'});
        }

        function openAreaModal(id) {
            const area = AREA_CONFIG.find(a => a.id === id);
            document.getElementById('modal-area-name').innerText = area.name + " SEARCH";
            document.getElementById('aff-buttons').innerHTML = `
                <a href="${area.links.rakuten}" target="_blank" class="aff-btn" style="background:var(--rakuten)">RAKUTEN TRAVEL</a>
                <a href="${area.links.jalan}" target="_blank" class="aff-btn" style="background:var(--jalan)">JALAN.NET</a>
                <a href="${area.links.ikyu}" target="_blank" class="aff-btn" style="background:var(--ikyu)">IKYU.COM</a>
            `;
            document.getElementById('area-modal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('area-modal').style.display = 'none'; }

        async function loadData() {
            try {
                const res = await fetch(CSV_URL);
                const text = await res.text();
                const rows = text.split(/\r?\n/).slice(1).filter(l => l.trim()).map(line => line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.trim().replace(/^"|"$/g, '')));
                
                let sHtml = '', cHtml = '', hHtml = '', tHtml = '';
                const now = new Date();

                rows.forEach(row => {
                    const [type, brand, title, start, end, url, direct_url, disc, fTxt] = row;
                    if (type === 'EMERGENCY' && title) {
                        const eb = document.getElementById('emergency-banner');
                        eb.innerText = `【！】 ${title}`; eb.style.display = 'block'; return;
                    }
                    if (start && end && (now < new Date(start) || now > new Date(end))) return;

                    if (type === 'SALE') {
                        sHtml += `<a href="${url}" target="_blank" class="sale-card"><div class="sale-side"><span>MAX</span><b>${fTxt}</b></div><div class="sale-main"><div class="sale-title">${title}</div><div class="sale-disc">${disc}</div></div></a>`;
                    } else if (type === 'COUPON') {
                        const bCol = brand.includes("楽天") ? "var(--rakuten)" : "var(--jalan)";
                        cHtml += `<a href="${url}" target="_blank" class="cp-item"><div class="cp-main"><div class="cp-val">${fTxt}</div><div class="cp-info">${title}</div></div><div class="cp-side" style="background:${bCol}">${brand}</div></a>`;
                    } else if (type === 'HOTEL') {
                        const bCol = brand.includes("楽天") ? "var(--rakuten)" : brand.includes("じゃらん") ? "var(--jalan)" : "var(--ikyu)";
                        hHtml += `<a href="${url}" target="_blank" class="hotel-card"><div class="hotel-img" style="background-image:url('${direct_url}')"><div class="hotel-tag" style="background:${bCol}">${brand}</div></div><div class="hotel-info"><div style="font-weight:900;font-size:14px;">${title}</div><div style="color:var(--gold);font-size:12px;margin-top:5px;">★ ${fTxt}</div></div></a>`;
                    } else if (type === 'TIPS') {
                        tHtml += `<a href="${url || '#'}" target="_blank" class="tips-card">${title}</a>`;
                    }
                });
                document.getElementById('sale-root').innerHTML = sHtml;
                document.getElementById('coupon-root').innerHTML = cHtml;
                document.getElementById('hotel-root').innerHTML = hHtml;
                document.getElementById('tips-root').innerHTML = tHtml;
            } catch (e) { console.error(e); }
        }
        initApp();
    </script>
</body>
</html>
