<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>TRIP_DASH.</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN",sans-serif;background:#000;color:#fff}
.section-title{font-weight:900;margin:20px;font-size:14px}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.dot-green{background:#3cb371}
.dot-red{background:#e74c3c}

.area-swipe-container{display:flex;overflow-x:auto;gap:12px;padding:0 15px 20px;scroll-snap-type:x mandatory}
.area-swipe-set{min-width:260px;display:grid;grid-template-rows:1fr 1fr;gap:10px;scroll-snap-align:start}
.area-card{background:#111;border-radius:12px;padding:12px}
.area-name{font-size:14px;font-weight:900}
.area-spot{font-size:11px;opacity:.7;margin:4px 0}
.area-btn{display:block;text-align:center;font-size:11px;background:#007aff;color:#fff;padding:6px;border-radius:6px;text-decoration:none}

.gourmet-grid{display:flex;gap:10px;padding:0 15px}
.gourmet-btn{flex:1;text-align:center;background:#111;padding:10px;border-radius:10px;color:#fff;text-decoration:none;font-size:11px}

.h-scroll{display:flex;gap:10px;overflow-x:auto;padding:0 15px 20px}
.item-card{min-width:160px;background:#111;border-radius:12px;overflow:hidden}
.item-img{width:100%;height:100px;object-fit:cover}
.item-info{padding:8px}
.choice-btn{display:block;text-align:center;background:#007aff;color:#fff;border-radius:6px;padding:6px;margin-top:6px;font-size:11px;text-decoration:none}

.sns-bar{display:flex;justify-content:space-around;padding:10px 0;background:#111}
.sns-bar a{color:#fff;font-size:18px}

.banner-scroll{display:flex;gap:12px;overflow-x:auto;padding:0 15px 15px}
.banner-scroll img{height:90px;border-radius:10px}
</style>
</head>

<body>

<!-- SNS -->
<div class="sns-bar">
<a href="#"><i class="fa-brands fa-x-twitter"></i></a>
<a href="#"><i class="fa-brands fa-instagram"></i></a>
<a href="#"><i class="fa-brands fa-tiktok"></i></a>
<a href="#"><i class="fa-brands fa-line"></i></a>
</div>

<!-- セールバナー -->
<div class="banner-scroll">
<img src="https://placehold.co/320x180?text=RAKUTEN+SALE">
<img src="https://placehold.co/320x180?text=JALAN+SALE">
<img src="https://placehold.co/320x180?text=IKYU+SALE">
</div>

<section id="hub">
<div class="section-title">INTELLIGENCE HUB</div>
<div style="padding:0 15px">
<div id="transit-display"><span class="status-dot dot-green"></span> 運行情報</div>
<div id="weather-display" style="margin-top:6px"><span class="status-dot dot-green"></span> 天気</div>
</div>
</section>

<section id="area">
<div class="section-title">AREA EXPLORER</div>
<div id="area-swipe" class="area-swipe-container"></div>
</section>

<section id="gourmet">
<div class="section-title">GOURMET</div>
<div class="gourmet-grid">
<a href="//ck.jp.ap.valuecommerce.com/servlet/referral?sid=3762635&pid=892538158&vc_url=https%3A%2F%2Ftabelog.com%2F%2F" target="_blank" class="gourmet-btn">食べログ</a>
<a href="//ck.jp.ap.valuecommerce.com/servlet/referral?sid=3762635&pid=892538160&vc_url=https%3A%2F%2Frestaurant.ikyu.com%2F" target="_blank" class="gourmet-btn">一休</a>
<a href="//ck.jp.ap.valuecommerce.com/servlet/referral?sid=3762635&pid=892538162&vc_url=https%3A%2F%2Fwww.hotpepper.jp%2F%3Fvos%3Dnhppvccp99002" target="_blank" class="gourmet-btn">Hotpepper</a>
</div>
</section>

<section id="gadget">
<div class="section-title">GADGETS</div>
<div id="gadget-list" class="h-scroll"></div>
</section>

<script>
const MASTER_CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vSYeo6mC85kmstRg6iJaxb7dgvy37mPo3knc09k0-82LZF_M5xaYRoRXbsUJig1CKldigIl03CT0Kww/pub?output=csv";

async function loadCSV(){
  const res=await fetch(MASTER_CSV+"&t="+Date.now());
  const text=await res.text();
  parseCSV(text);
}

function parseCSV(text){
  const rows=text.trim().split("\n").slice(1);
  let emergency=false;
  let areas=[];
  const gadgetWrap=document.getElementById("gadget-list");
  gadgetWrap.innerHTML="";

  rows.forEach(r=>{
    const cols=r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v=>v.replace(/^"|"$/g,""));
    const type=cols[0];

    if(type==="EMERGENCY") emergency=true;

    if(type==="AREA"){
      areas.push({
        name:cols[2],
        spot:cols[3],
        url:cols[5],
        lat:parseFloat(cols[6]),
        lng:parseFloat(cols[7])
      });
    }

    if(type==="GADGET"){
      gadgetWrap.innerHTML+=`
      <div class="item-card">
        <img src="${cols[7]}" class="item-img">
        <div class="item-info">
          <div style="font-size:12px;font-weight:900">${cols[2]}</div>
          <a href="${cols[5]}" target="_blank" class="choice-btn">${cols[1]}で購入する</a>
        </div>
      </div>`;
    }
  });

  if(emergency){
    document.getElementById("transit-display").innerHTML=
      `<span class="status-dot dot-red"></span><span style="color:#e74c3c"> 見合わせ / 欠航</span>`;
    document.getElementById("weather-display").innerHTML=
      `<span class="status-dot dot-red"></span><span style="color:#e74c3c"> 要確認</span>`;
  }

  initArea(areas);
}

function calcDist(a,b,c,d){
  const R=6371;
  const dLat=(c-a)*Math.PI/180;
  const dLng=(d-b)*Math.PI/180;
  const x=Math.sin(dLat/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

async function initArea(list){
  const loc=await fetch("https://ipapi.co/json/").then(r=>r.json());
  let near=list[0],min=1e9;
  list.forEach(a=>{
    const d=calcDist(loc.latitude,loc.longitude,a.lat,a.lng);
    if(d<min){min=d;near=a;}
  });
  const sorted=[near,...list.filter(x=>x!==near)];
  renderArea(sorted);
}

function renderArea(list){
  const wrap=document.getElementById("area-swipe");
  wrap.innerHTML="";
  for(let i=0;i<list.length;i+=2){
    const set=document.createElement("div");
    set.className="area-swipe-set";
    for(let j=0;j<2;j++){
      if(!list[i+j])continue;
      const a=list[i+j];
      set.innerHTML+=`
      <div class="area-card">
        <div class="area-name">${a.name}</div>
        <div class="area-spot">${a.spot}</div>
        <a href="${a.url}" target="_blank" class="area-btn">検索</a>
      </div>`;
    }
    wrap.appendChild(set);
  }
}

loadCSV();
</script>

</body>
</html>
