<script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSYeo6mC85kmstRg6iJaxb7dgvy37mPo3knc09k0-82LZF_M5xaYRoRXbsUJig1CKldigIl03CT0Kww/pub?gid=0&single=true&output=csv";
    
    // Ver1.11確定リンク
    const MODAL_DATA = {
        transit: { t: "RAILWAY STATUS", b: [{n: "JR東日本", l: "https://traininfo.jreast.co.jp/train_info/kanto.aspx", c: "#28a745"},{n: "東京メトロ", l: "https://www.tokyometro.jp/unko/", c: "#007aff"},{n: "都営交通", l: "https://www.kotsu.metro.tokyo.jp/subway/schedule/", c: "#e74c3c"},{n: "東急電鉄", l: "https://www.tokyu.co.jp/unko/", c: "#e60012"},{n: "Yahoo! 路線", l: "https://transit.yahoo.co.jp/diainfo", c: "#ff9900"}] },
        weather: { t: "WEATHER DETAILS", b: [{n: "tenki.jp", l: "https://tenki.jp/", c: "#007aff"},{n: "ウェザーニュース", l: "https://weathernews.jp/onebox/", c: "#2ecc71"},{n: "気象庁", l: "https://www.jma.go.jp/bosai/", c: "#34495e"},{n: "Yahoo! 天気", l: "https://weather.yahoo.co.jp/weather/", c: "#ff9900"}] },
        highway: { t: "HIGHWAY TRAFFIC", b: [{n: "ドラぷら", l: "https://www.driveplaza.com/", c: "#28a745"},{n: "iHighway", l: "https://c-ihighway.jp/", c: "#f39c12"},{n: "JARTIC", l: "https://www.jartic.or.jp/", c: "#34495e"},{n: "首都高", l: "https://search.shutoko-eng.jp/rtmap.html", c: "#007aff"}] },
        flight: { t: "FLIGHT STATUS", b: [{n: "JAL 運航", l: "https://www.jal.co.jp/cms/other/ja/weather_info_dom.html", c: "#e74c3c"},{n: "ANA 運航", l: "https://www.ana.co.jp/fs/dom/jp/", c: "#007aff"},{n: "羽田空港", l: "https://tokyo-haneda.com/flight/index.html", c: "#34495e"},{n: "成田空港", l: "https://www.narita-airport.jp/jp/flight/", c: "#007aff"}] },
        rain: { t: "RAIN RADAR", b: [{n: "Yahoo!", l: "https://weather.yahoo.co.jp/weather/zoomradar/", c: "#e74c3c"},{n: "JMA ナウキャスト", l: "https://www.jma.go.jp/bosai/nowc/", c: "#007aff"},{n: "ウェザーニュース", l: "https://weathernews.jp/onebox/radar/", c: "#2ecc71"}] },
        news: { t: "LATEST NEWS", b: [{n: "Yahoo!", l: "https://news.yahoo.co.jp/", c: "#e74c3c"},{n: "NHK", l: "https://www3.nhk.or.jp/news/", c: "#28a745"},{n: "日経", l: "https://www.nikkei.com/", c: "#34495e"},{n: "Google", l: "https://news.google.com/", c: "#4285f4"}] }
    };

    let currentTipsPages = []; let currentPageIdx = 0; let currentTipsTitle = "";

    async function forceReloadData() {
        const btn = document.getElementById('refresh-btn');
        const icon = document.getElementById('refresh-icon');
        icon.classList.add('spin');
        try {
            const res = await fetch(CSV_URL + `&t=${new Date().getTime()}`);
            const text = await res.text();
            processCSVData(text);
            await getIPWeather();
            icon.className = "fa-solid fa-check";
            icon.classList.remove('spin');
            btn.classList.add('success');
            setTimeout(() => { icon.className = "fa-solid fa-arrows-rotate"; btn.classList.remove('success'); }, 2000);
        } catch (e) { icon.classList.remove('spin'); }
    }

    async function getIPWeather() {
        try {
            const ipRes = await fetch('https://ipapi.co/json/');
            const ipData = await ipRes.json();
            document.getElementById('location-name').innerText = ipData.city || "Tokyo";
            const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${ipData.latitude}&longitude=${ipData.longitude}&current_weather=true`);
            const wData = await wRes.json();
            document.getElementById('weather-display').innerHTML = `<div class="dot green"></div> ${Math.round(wData.current_weather.temperature)}°C Current`;
        } catch (e) { document.getElementById('weather-display').innerHTML = `<div class="dot green"></div> --°C`; }
    }

    function processCSVData(text) {
        const rows = text.split('\n').slice(1).filter(r => r.trim());
        const now = new Date();
        const hour = now.getHours();
        const date = now.getDate();
        const bannerE = document.getElementById('emergency-banner');
        const bannerS = document.getElementById('sale-banner');
        const tipsContainer = document.getElementById('tips-container');
        
        bannerE.style.display = 'none'; bannerS.style.display = 'none';
        tipsContainer.innerHTML = '';
        
        let saleTopFound = false;
        let coupons = { rakuten: [], jalan: [], ikyu: [] };
        const brands = { '楽天トラベル': 'rakuten', 'じゃらん': 'jalan', '一休.com': 'ikyu' };
        const colors = { 'rakuten': 'var(--rakuten-red)', 'jalan': 'var(--jalan-orange)', 'ikyu': 'var(--ikyu-gold)' };
        
        rows.forEach(line => {
            const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.trim().replace(/^"|"$/g, ''));
            const [type, brand, title, start, end, url, direct, disc, fTxt] = cols;
            const sDate = new Date(start); const eDate = new Date(end);

            if (type === 'EMERGENCY' && now >= sDate && now <= eDate) {
                bannerE.innerText = `【！】 ${title}`; bannerE.style.display = 'block';
                document.getElementById('main-header').style.top = '30px';
                document.body.style.paddingTop = '150px';
            }
            if (type === 'SALE_TOP' && now >= sDate && now <= eDate) {
                document.getElementById('sale-banner-text').innerText = title;
                bannerS.style.display = 'block'; bannerS.href = url; bannerS.className = 'sale-today'; saleTopFound = true;
            }
            if (type === 'TIPS') {
                const card = document.createElement('div'); card.className = 'tips-card'; card.onclick = () => openTips(title, disc);
                card.innerHTML = `<i class="fa-solid fa-lightbulb tips-icon"></i><div class="tips-title">${title}</div>`;
                tipsContainer.appendChild(card);
            }
            // SALEセクションの個別URL反映ロジック (ver.1.25復元)
            if (type === 'SALE' && brands[brand] && now >= sDate && now <= eDate) {
                const id = brands[brand]; const card = document.getElementById(`card-${id}`);
                card.classList.add('active-sale');
                card.href = url; // CSVのURLで上書き
                document.getElementById(`disc-${id}`).innerText = disc;
                document.getElementById(`badge-${id}`).innerText = fTxt || 'SALE';
            }
            if (type === 'COUPON' && brands[brand] && now >= sDate && now <= eDate) {
                coupons[brands[brand]].push({ title, url, fTxt, end, disc });
            }
        });

        // 楽天5と0のつく日 & 前日告知判定ロジック (ver.1.11, 1.32復元)
        if (!saleTopFound) {
            const targetDays = [5, 10, 15, 20, 25, 30];
            const tomorrow = new Date(now); tomorrow.setDate(date + 1);
            
            if (targetDays.includes(date)) {
                // 当日
                document.getElementById('sale-banner-text').innerText = "楽天トラベル｜本日 5と0のつく日 ポイント4倍";
                bannerS.style.display = 'block'; bannerS.href = "https://travel.rakuten.co.jp/camp/50bunrui/"; bannerS.className = 'sale-rakuten-day';
            } else if (targetDays.includes(tomorrow.getDate()) && hour >= 15) {
                // 前日15時以降
                document.getElementById('sale-banner-text').innerText = "予告｜明日 5と0のつく日 ポイント4倍";
                bannerS.style.display = 'block'; bannerS.href = "https://travel.rakuten.co.jp/camp/50bunrui/"; bannerS.className = 'sale-preview';
            }
        }

        const container = document.getElementById('coupon-list'); container.innerHTML = '';
        Object.keys(coupons).forEach(b => {
            if (coupons[b].length === 0) return;
            const group = document.createElement('div'); group.className = 'coupon-group';
            const grid = document.createElement('div'); grid.className = 'coupon-grid';
            coupons[b].forEach((c, i) => {
                const isHidden = i >= 4 ? 'style="display:none"' : '';
                const endD = new Date(c.end); const diffDays = Math.ceil((endD - now) / (1000 * 60 * 60 * 24));
                const limitBadge = (diffDays > 0 && diffDays <= 3) ? `<div class="limit-badge">残り${diffDays}日</div>` : '';
                grid.innerHTML += `<a href="${c.url}" target="_blank" class="coupon-card" ${isHidden}>${limitBadge}<div class="coupon-main"><div class="coupon-title-sub">${c.title}</div><div class="coupon-fTxt">${c.fTxt}</div><div class="coupon-disc-sub">${c.disc}</div></div><div class="coupon-side" style="background:${colors[b]}"><div class="coupon-side-label">UNTIL</div><div class="coupon-end-date">${endD.getMonth()+1}/${endD.getDate()}</div></div></a>`;
            });
            group.appendChild(grid);
            if (coupons[b].length > 4) {
                const r = document.createElement('div'); r.className = 'show-more-ribbon'; r.innerText = `${b.toUpperCase()} 他のクーポンをみる (${coupons[b].length-4})`;
                r.onclick = () => { grid.querySelectorAll('.coupon-card').forEach(el => el.style.display = 'flex'); r.style.display = 'none'; };
                group.appendChild(r);
            }
            container.appendChild(group);
        });
    }
    // 以下Tipsモーダル文字数200, PC3列グリッド、Hubリンク等のver1.41調整を統合...
