<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRIP_DASH. | Business Intelligence</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        :root {
            --biz-bg: #0d0f11; --biz-card: #161a1d;
            --rakuten-green: #28a745; --jalan-orange: #ff9900; --ikyu-gold: #a68b5e;
            --text-main: #ffffff; --text-sub: #8e8e93; --accent-gold: #d4af37; --header-h: 60px;
        }
        * { box-sizing: border-box; scroll-behavior: smooth; }
        body { margin: 0; background: var(--biz-bg); font-family: -apple-system, sans-serif; color: var(--text-main); line-height: 1.4; overflow-x: hidden; padding-top: calc(var(--header-h) + 45px); }
        
        /* FIXED HEADER & NAV */
        .header-group { position: fixed; top: 0; width: 100%; z-index: 2000; }
        .biz-header { height: var(--header-h); background: rgba(13,15,17,0.9); backdrop-filter: blur(20px); border-bottom: 1px solid #333; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; }
        .biz-logo { font-weight: 900; color: var(--accent-gold); text-decoration: none; font-size: 18px; letter-spacing: 2px; }
        .nav-bar { background: rgba(22,26,29,0.9); backdrop-filter: blur(20px); border-bottom: 1px solid #333; padding: 10px 0; display: flex; justify-content: center; gap: 20px; }
        .nav-link { color: var(--text-sub); text-decoration: none; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }

        .container { width: 100%; max-width: 1000px; margin: 0 auto; padding: 0 12px; }

        /* BANNER */
        #day-alert-banner { display: none; background: linear-gradient(90deg, #d4af37, #b8860b); color: #000; padding: 10px; text-align: center; font-weight: 900; font-size: 13px; margin-bottom: 15px; border-radius: 4px; }

        /* QUICK ACCESS (TOP GRID) */
        .quick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .quick-item { background: #1c1f23; border: 1px solid #333; border-radius: 6px; padding: 12px; text-decoration: none; color: #fff; }
        .quick-label { font-size: 9px; color: var(--accent-gold); font-weight: 900; display: flex; align-items: center; gap: 5px; margin-bottom: 4px; }
        .quick-val { font-size: 11px; font-weight: 800; display: flex; gap: 12px; }
        .quick-val span { cursor: pointer; }

        .section-title { padding: 30px 0 10px; font-size: 11px; font-weight: 800; color: var(--text-sub); border-bottom: 1px solid #2d3436; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }

        /* SALE FLASH */
        .limited-sale-card { background: linear-gradient(135deg, #1e1b10 0%, #161a1d 100%); border: 1px solid var(--accent-gold); border-radius: 8px; text-decoration: none; color: inherit; display: flex; overflow: hidden; margin-bottom: 12px; position: relative; height: 85px; }
        .limited-sale-card::after { content: ""; position: absolute; top: -50%; left: -60%; width: 20%; height: 200%; background: rgba(255, 255, 255, 0.15); transform: rotate(30deg); animation: shine 4s infinite; }
        @keyframes shine { 0% { left: -60%; } 20% { left: 120%; } 100% { left: 120%; } }
        .sale-badge-big { background: var(--accent-gold); color: #000; width: 90px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; line-height: 1; }
        .sale-content { padding: 10px 15px; flex: 1; display: flex; flex-direction: column; justify-content: center; }

        /* HOTEL */
        .hotel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
        .hotel-card { position: relative; height: 130px; border-radius: 10px; overflow: hidden; background-size: cover; background-position: center; border: 1px solid #333; display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; }
        .hotel-card::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, rgba(0,0,0,0.9) 35%, rgba(0,0,0,0.1) 100%); }
        .hotel-city { position: relative; font-size: 13px; font-weight: 900; color: #fff; margin-bottom: 6px; z-index: 2; }
        .hotel-select { width: 100%; background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.3); padding: 8px; border-radius: 4px; font-size: 10px; appearance: none; z-index: 2; position: relative; }
        .search-trigger-link { display: none; position: relative; z-index: 2; width: 100%; margin-top: 8px; padding: 8px; border-radius: 4px; color: #fff; font-size: 10px; font-weight: 900; text-decoration: none; text-align: center; }

        /* COUPON (FIXED) */
        .coupon-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .coupon-card { display: flex; background: #1c1f23; border-radius: 6px; overflow: hidden; text-decoration: none; border: 1px solid #333; height: 90px; }
        .coupon-main { flex: 7; padding: 12px; border-right: 1px dotted #444; display: flex; flex-direction: column; justify-content: center; }
        .coupon-brand-label { font-size: 7px; color: var(--accent-gold); font-weight: 900; margin-bottom: 3px; }
        .coupon-title { font-size: 11px; font-weight: 900; color: #fff; line-height: 1.2; }
        .coupon-stub { flex: 3; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 8px; color: #fff; text-align: center; }
        .stub-text { font-size: 9px; font-weight: 900; }

        /* TIPS UI */
        .tips-area { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin-bottom: 40px; }
        .tips-card-modern { background: #1c1f23; border-radius: 10px; padding: 20px; border: 1px solid #333; display: flex; align-items: center; gap: 15px; cursor: pointer; position: relative; }
        .tips-icon { width: 45px; height: 45px; background: rgba(212, 175, 55, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--accent-gold); font-size: 20px; flex-shrink: 0; }

        .rakuten-bg { background: var(--rakuten-green) !important; } .jalan-bg { background: var(--jalan-orange) !important; } .ikyu-bg { background: var(--ikyu-gold) !important; }

        /* FOOTER */
        footer { margin-top: 80px; padding: 60px 15px; background: #080a0c; border-top: 1px solid #333; text-align: center; }
        .footer-sns { display: flex; justify-content: center; gap: 30px; margin-bottom: 30px; }
        .footer-sns a { color: var(--text-main); font-size: 24px; text-decoration: none; }
        .footer-copy { font-size: 10px; color: var(--text-sub); letter-spacing: 2px; text-transform: uppercase; margin-top: 20px; }
    </style>
</head>
<body>

<div class="header-group">
    <header class="biz-header">
        <a href="#" class="biz-logo">TRIP_DASH.</a>
        <div id="header-date" style="font-size: 11px; font-weight: 800; color: var(--text-sub); font-family: monospace;">---.--.-- ---</div>
    </header>
    <div class="nav-bar">
        <a href="#sale-section" class="nav-link">Sale</a>
        <a href="#hotel-section" class="nav-link">Hotel</a>
        <a href="#coupon-section" class="nav-link">Coupon</a>
        <a href="#tips-section" class="nav-link">Intelligence</a>
    </div>
</div>

<div class="container">
    <div id="day-alert-banner"></div>

    <div class="section-title">Field Operations</div>
    <div class="quick-grid">
        <a id="weather-link" href="https://weather.yahoo.co.jp/weather/" target="_blank" class="quick-item">
            <div class="quick-label"><i class="fa-solid fa-cloud-sun"></i> LOCAL WEATHER</div>
            <div class="quick-val" id="local-city">Detecting Area...</div>
        </a>
        <div class="quick-item">
            <div class="quick-label"><i class="fa-solid fa-train"></i> SHINKANSEN</div>
            <div class="quick-val">
                <span onclick="window.open('https://traininfo.jr-central.co.jp/shinkansen/pc/ja/index.html')">東海</span>
                <span onclick="window.open('https://traininfo.jreast.co.jp/train_info/shinkansen.aspx')">東日本</span>
                <span onclick="window.open('https://www.train-info.westjr.co.jp/shinkansen/')">西日本</span>
            </div>
        </div>
        <div class="quick-item">
            <div class="quick-label"><i class="fa-solid fa-plane"></i> FLIGHT INFO</div>
            <div class="quick-val">
                <span onclick="window.open('https://www.jal.co.jp/cms/other/ja/weather_info_dom.html')">JAL</span>
                <span onclick="window.open('https://www.ana.co.jp/fs/dom/jp/')">ANA</span>
                <span onclick="window.open('https://www.skymark.co.jp/ja/fleets/flight_info.html')">SKY</span>
            </div>
        </div>
        <div class="quick-item">
            <div class="quick-label"><i class="fa-solid fa-newspaper"></i> BUSINESS NEWS</div>
            <div class="quick-val">
                <span onclick="window.open('https://news.yahoo.co.jp/categories/business')">経済</span>
                <span onclick="window.open('https://news.yahoo.co.jp/categories/it')">IT</span>
                <span onclick="window.open('https://news.yahoo.co.jp/pickup')">主要</span>
            </div>
        </div>
    </div>

    <section id="sale-section" style="display:none;"><div class="section-title">Now on Sale!!!</div><div id="sale-area"></div></section>
    
    <section id="hotel-section">
        <div class="section-title">Hotel Search</div>
        <div class="hotel-grid" id="hotel-grid-root"></div>
    </section>

    <section id="coupon-section" style="display:none;"><div class="section-title">Premium Coupons</div><div id="coupon-root"></div></section>

    <section id="tips-section">
        <div class="section-title">Business Intelligence</div>
        <div id="tips-area" class="tips-area"></div>
    </section>
</div>

<footer>
    <div class="footer-sns">
        <a href="https://www.instagram.com/hazusanai_mens" target="_blank"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://x.com/tokutabi_pro" target="_blank"><i class="fa-brands fa-x-twitter"></i></a>
    </div>
    <p class="footer-copy">&copy; 2026 TRIP_DASH. All Rights Reserved.</p>
</footer>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSYeo6mC85kmstRg6iJaxb7dgvy37mPo3knc09k0-82LZF_M5xaYRoRXbsUJig1CKldigIl03CT0Kww/pub?gid=0&single=true&output=csv";

async function initLocation() {
    try {
        const res = await fetch('https://ip-api.com/json/?lang=ja');
        const data = await res.json();
        if(data.city) {
            document.getElementById('local-city').innerText = `${data.regionName} ${data.city}`;
            document.getElementById('weather-link').href = `https://weather.yahoo.co.jp/weather/search/?p=${encodeURIComponent(data.city)}`;
        }
    } catch (e) { document.getElementById('local-city').innerText = "Tokyo / 東京"; }
}

function initDayDisplay() {
    const now = new Date();
    const days = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
    document.getElementById('header-date').innerText = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${days[now.getDay()]}`;
    const d = now.getDate();
    const banner = document.getElementById('day-alert-banner');
    if([5,10,15,20,25,30].includes(d)) { banner.innerText = `本日 ${d}日は「楽天トラベル 5と0のつく日」開催中`; banner.style.display = 'block'; }
    else if([1,9,19].includes(d)) { banner.innerText = `本日 ${d}日は「一休の日」ポイント還元開催中`; banner.style.display = 'block'; }
}

const AREAS = [
    { name: 'TOKYO / 東京', img: 'https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?w=600', rakuten: 'https://a.r10.to/hYb8ED', jalan: 'https://ck.jp.ap.valuecommerce.com/servlet/referral?sid=3762635&pid=892535803&vc_url=https%3A%2F%2Fwww.jalan.net%2Fuw%2Fuwp2011%2Fuww2011init.do%3Fkeyword%3D%2593%258C%258B%259E%2589w%26distCd%3D06%26rootCd%3D7701%26screenId%3DFWPCTOP', ikyu: 'https://ck.jp.ap.valuecommerce.com/servlet/referral?sid=3762635&pid=892535794&vc_url=https%3A%2F%2Fwww.ikyu.com%2Ftokyo%2F140000%2F' },
    { name: 'OSAKA / 大阪', img: 'https://images.unsplash.com/photo-1590559899731-a382839e5549?w=600', rakuten: 'https://a.r10.to/hkI4ez', jalan: 'https://ck.jp.ap.valuecommerce.com/servlet/referral?sid=3762635&pid=892535803&vc_url=https%3A%2F%2Fwww.jalan.net%2Fuw%2Fuwp2011%2Fuww2011search.do', ikyu: 'https://ck.jp.ap.valuecommerce.com/servlet/referral?sid=3762635&pid=892535794&vc_url=https%3A%2F%2Fwww.ikyu.com%2Fosaka%2F' },
    { name: 'NAGOYA / 名古屋', img: 'https://images.unsplash.com/photo-1596230529625-7ee10f7b09b6?w=600', rakuten: 'https://a.r10.to/hPVp2x', jalan: 'https://ck.jp.ap.valuecommerce.com/servlet/referral?sid=3762635&pid=892535803&vc_url=https%3A%2F%2Fwww.jalan.net%2Fuw%2Fuwp2011%2Fuww2011search.do', ikyu: 'https://ck.jp.ap.valuecommerce.com/servlet/referral?sid=3762635&pid=892535794&vc_url=https%3A%2F%2Fwww.ikyu.com%2Ftokai%2F23060311%2F' },
    { name: 'FUKUOKA / 福岡', img: 'https://images.unsplash.com/photo-1621350485987-a27909010419?w=600', rakuten: 'https://a.r10.to/hPdo3g', jalan: 'https://ck.jp.ap.valuecommerce.com/servlet/referral?sid=3762635&pid=892535803&vc_url=https%3A%2F%2Fwww.jalan.net%2Fuw%2Fuwp2011%2Fuww2011search.do', ikyu: 'https://ck.jp.ap.valuecommerce.com/servlet/referral?sid=3762635&pid=892535794&vc_url=https%3A%2F%2Fwww.ikyu.com%2Fkyushu%2F35090111%2F' }
];

function initHotelGrid() {
    document.getElementById('hotel-grid-root').innerHTML = AREAS.map((area, idx) => `
        <div class="hotel-card" style="background-image: url('${area.img}')">
            <div class="hotel-city">${area.name}</div>
            <select class="hotel-select" onchange="updateSearchLink(this, ${idx})">
                <option value="">サイトを選択</option>
                <option value="rakuten">楽天トラベル</option>
                <option value="jalan">じゃらん</option>
                <option value="ikyu">一休.com</option>
            </select>
            <a href="#" target="_blank" class="search-trigger-link">SEARCH</a>
        </div>
    `).join('');
}

function updateSearchLink(selectEl, idx) {
    const linkBtn = selectEl.nextElementSibling;
    const site = selectEl.value;
    if (site) {
        linkBtn.style.display = 'block';
        linkBtn.className = 'search-trigger-link ' + (site==='rakuten'?'rakuten-bg':site==='jalan'?'jalan-bg':'ikyu-bg');
        linkBtn.href = AREAS[idx][site];
    } else { linkBtn.style.display = 'none'; }
}

async function updateDashboard() {
    try {
        const response = await fetch(CSV_URL);
        const data = await response.text();
        const rows = data.split(/\r?\n/).map(row => row.split(','));
        const now = new Date();
        let saleHtml = ''; let tipsHtml = '';
        let couponHtml = '';

        for(let i = 1; i < rows.length; i++) {
            const row = rows[i].map(s => s?.trim());
            if(row.length < 6) continue;
            const [type, brand, title, start, end, url, desc, discount, fullText] = row;
            const cleanUrl = url.replace(/['"]+/g, '');
            if(!type || !title || now < new Date(start) || now > new Date(end)) continue;

            const bKey = brand.includes("楽天")?"rakuten":brand.includes("じゃらん")?"jalan":brand.includes("一休")?"ikyu":"other";
            
            if (type === 'SALE') {
                saleHtml += `<a href="${cleanUrl}" target="_blank" class="limited-sale-card"><div class="sale-badge-big"><div style="font-size:9px;">MAX</div><div style="font-size:20px;">${discount}</div></div><div class="sale-content"><div style="font-size:9px; font-weight:900; color:var(--accent-gold);">${brand}</div><div style="font-size:13px; font-weight:900; color:#fff;">${title}</div><div style="font-size:9px; color:#ffd700;">${desc}</div></div></a>`;
            } else if (type === 'COUPON') {
                couponHtml += `<a href="${cleanUrl}" target="_blank" class="coupon-card"><div class="coupon-main"><div class="coupon-brand-label">${brand}</div><div class="coupon-title">${title}</div></div><div class="coupon-stub ${bKey}-bg"><div class="stub-text">${desc}</div></div></a>`;
            } else if (type === 'TIPS') {
                tipsHtml += `<div class="tips-card-modern" onclick="alert('${fullText || desc}')"><div class="tips-icon"><i class="fa-solid fa-lightbulb"></i></div><div><div style="font-size:13px; font-weight:800; color:#fff;">${title}</div><div style="font-size:10px; color:var(--text-sub); margin-top:4px;">${desc}</div></div></div>`;
            }
        }
        if(saleHtml) { document.getElementById('sale-area').innerHTML = saleHtml; document.getElementById('sale-section').style.display = 'block'; }
        if(couponHtml) { document.getElementById('coupon-root').innerHTML = `<div class="coupon-grid">${couponHtml}</div>`; document.getElementById('coupon-section').style.display = 'block'; }
        document.getElementById('tips-area').innerHTML = tipsHtml;
    } catch (e) { console.error(e); }
}

initLocation(); initDayDisplay(); initHotelGrid(); updateDashboard();
</script>
</body>
</html>
