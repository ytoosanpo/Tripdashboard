<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TRIP_DASH. | ver. 2.8.1</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        :root {
            --biz-bg: #0d0f11; --biz-card: #1c1f23;
            --rakuten: #28a745; --jalan: #ff9900; --ikyu: #a68b5e;
            --text-main: #ffffff; --text-sub: #8e8e93; --gold: #d4af37;
            --alert-red: #e74c3c; --success-green: #2ecc71;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { background: var(--biz-bg); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding-top: 60px; overflow-x: hidden; }

        /* 新聞見出し風キャンペーン */
        #campaign-alert { display: none; border-top: 3px double var(--gold); border-bottom: 3px double var(--gold); background: #1a1500; color: var(--gold); padding: 12px; font-weight: 900; font-size: 13px; text-align: center; margin: 0 15px 25px; font-family: "Hiragino Mincho ProN", serif; }

        .biz-header { height: 60px; background: rgba(13,15,17,0.95); border-bottom: 1px solid #333; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: fixed; top: 0; width: 100%; z-index: 4000; }
        .biz-logo { font-weight: 900; color: var(--gold); font-size: 18px; text-decoration: none; letter-spacing: 1px; }

        .container { width: 100%; max-width: 800px; margin: 0 auto; padding: 25px 15px; }
        .section-title { font-size: 10px; font-weight: 800; color: var(--text-sub); border-left: 3px solid var(--gold); padding-left: 10px; margin: 30px 0 15px; text-transform: uppercase; letter-spacing: 1px; }

        /* Field Operations */
        .op-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .op-card { background: var(--biz-card); border-radius: 12px; padding: 18px; border: 1px solid #2a2a2a; position: relative; }
        .op-icon { position: absolute; top: 18px; right: 18px; color: var(--gold); opacity: 0.4; font-size: 16px; }
        .op-label { font-size: 9px; font-weight: 900; color: var(--text-sub); margin-bottom: 6px; }
        .op-val { font-size: 13px; font-weight: 900; display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
        .dot-green { background: var(--success-green); box-shadow: 0 0 8px var(--success-green); }
        .dot-red { background: var(--alert-red); box-shadow: 0 0 8px var(--alert-red); }
        .op-select { width: 100%; background: #000; color: var(--gold); border: 1px solid #444; font-size: 10px; padding: 6px; border-radius: 4px; font-weight: 800; outline: none; }

        /* Area Search */
        .area-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .area-card { background: var(--biz-card); border-radius: 12px; border: 1px solid #2a2a2a; overflow: hidden; }
        .area-name { padding: 15px; text-align: center; font-weight: 900; font-size: 13px; color: #fff; border-bottom: 1px solid #2a2a2a; }
        .area-links { display: grid; grid-template-columns: 1fr 1fr 1fr; }
        .a-link { padding: 12px 0; font-size: 10px; font-weight: 900; text-align: center; color: #fff; text-decoration: none; border-right: 1px solid #1a1a1a; transition: 0.2s; }
        .a-link:last-child { border-right: none; }
        .a-link:active { opacity: 0.7; }

        /* Search Panel */
        .search-panel { background: var(--biz-card); border: 1px solid var(--gold); border-radius: 12px; padding: 20px; margin-top: 15px; }
        .biz-select { width: 100%; background: #000; color: #fff; border: 1px solid #333; height: 50px; border-radius: 8px; padding: 0 15px; font-size: 14px; margin-bottom: 12px; appearance: none; }
        #main-search-btn { width: 100%; height: 50px; background: #3d3d29; color: #7a7a52; border: none; border-radius: 8px; font-weight: 900; pointer-events: none; transition: 0.3s; }
        #main-search-btn.active { background: var(--gold); color: #000; pointer-events: auto; }

        /* Hotel Carousel (1.6.0 Signature Style) */
        .hotel-swiper { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 10px; scroll-snap-type: x mandatory; }
        .hotel-swiper::-webkit-scrollbar { display: none; }
        .hotel-card { flex: 0 0 280px; scroll-snap-align: start; background: var(--biz-card); border-radius: 12px; border: 1px solid #2a2a2a; text-decoration: none; overflow: hidden; }
        .hotel-img { height: 140px; background-size: cover; background-position: center; position: relative; }
        .hotel-tag { position: absolute; top: 12px; left: 12px; font-size: 9px; padding: 4px 10px; border-radius: 4px; color: #fff; font-weight: 900; }
        .hotel-info { padding: 15px; }
        .hotel-title { font-size: 14px; font-weight: 900; color: #fff; margin-bottom: 10px; height: 40px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .hotel-price { font-size: 11px; color: var(--gold); font-weight: bold; }

        /* Coupons */
        .cp-item { background: var(--biz-card); border-radius: 12px; display: flex; height: 90px; text-decoration: none; border: 1px solid #2a2a2a; overflow: hidden; margin-bottom: 12px; }
        .cp-side { width: 85px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: #fff; text-align: center; line-height: 1.2; }
        .cp-main { flex: 1; padding: 15px; display: flex; align-items: center; font-size: 12px; font-weight: 800; color: #fff; border-left: 1px solid #333; line-height: 1.4; }

        /* BI Tips */
        .tips-card { background: var(--biz-card); border-radius: 12px; padding: 20px; border: 1px solid #2a2a2a; display: flex; align-items: center; gap: 15px; margin-bottom: 10px; }
        .tips-card i { color: var(--gold); font-size: 18px; }
        .tips-text { font-size: 13px; font-weight: 800; color: #fff; }
    </style>
</head>
<body>
    <header class="biz-header">
        <div class="biz-logo">TRIP_DASH.</div>
        <div id="header-date" style="font-size: 11px; font-weight: 900; color: var(--text-sub); font-family: monospace;"></div>
    </header>

    <div class="container">
        <div id="campaign-alert"></div>

        <div class="section-title">Field Operations</div>
        <div class="op-grid">
            <div class="op-card">
                <i class="fa-solid fa-cloud-sun op-icon"></i>
                <div class="op-label">WEATHER</div>
                <div class="op-val"><div class="dot dot-green" id="dot-w"></div><span id="txt-w">Stable</span></div>
                <select class="op-select" onchange="if(this.value) window.open(this.value,'_blank')">
                    <option value="">RESOURCES</option>
                    <option value="https://tenki.jp/">日本気象協会</option>
                    <option value="https://weathernews.jp/">ウェザーニュース</option>
                    <option value="https://www.windy.com/">Windy.com</option>
                </select>
            </div>
            <div class="op-card">
                <i class="fa-solid fa-train op-icon"></i>
                <div class="op-label">SHINKANSEN</div>
                <div class="op-val"><div class="dot dot-green" id="dot-s"></div><span id="txt-s">Normal</span></div>
                <select class="op-select" onchange="if(this.value) window.open(this.value,'_blank')">
                    <option value="">RESOURCES</option>
                    <option value="https://traininfo.jreast.co.jp/train_info/shinkansen.aspx">JR東日本</option>
                    <option value="https://traininfo.jr-central.co.jp/shinkansen/pc/index.html">JR東海</option>
                    <option value="https://trafficinfo.westjr.co.jp/sanyo_shinkansen.html">JR西日本</option>
                </select>
            </div>
            <div class="op-card">
                <i class="fa-solid fa-plane op-icon"></i>
                <div class="op-label">AIRLINE</div>
                <div class="op-val"><div class="dot dot-green" id="dot-a"></div><span id="txt-a">Normal</span></div>
                <select class="op-select" onchange="if(this.value) window.open(this.value,'_blank')">
                    <option value="">RESOURCES</option>
                    <option value="https://www.jal.co.jp/cms/other/ja/weather_info_dom.html">JAL 運航状況</option>
                    <option value="https://www.ana.co.jp/fs/dom/jp/">ANA 運航状況</option>
                </select>
            </div>
            <div class="op-card">
                <i class="fa-solid fa-rss op-icon"></i>
                <div class="op-label">NEWS</div>
                <div class="op-val"><div class="dot dot-green" id="dot-n"></div><span id="txt-n">No Alerts</span></div>
                <select class="op-select" onchange="if(this.value) window.open(this.value,'_blank')">
                    <option value="">RESOURCES</option>
                    <option value="https://www.nikkei.com/">日本経済新聞</option>
                    <option value="https://www.bloomberg.co.jp/">Bloomberg</option>
                </select>
            </div>
        </div>

        <div class="section-title">Quick Area Search</div>
        <div class="area-grid">
            <div class="area-card">
                <div class="area-name">TOKYO / 東京</div>
                <div class="area-links">
                    <a href="https://a.r10.to/hYb8ED" class="a-link" style="background:var(--rakuten)">楽天</a>
                    <a href="https://www.jalan.net/" class="a-link" style="background:var(--jalan)">じゃらん</a>
                    <a href="https://www.ikyu.com/" class="a-link" style="background:var(--ikyu)">一休</a>
                </div>
            </div>
            <div class="area-card">
                <div class="area-name">OSAKA / 大阪</div>
                <div class="area-links">
                    <a href="https://a.r10.to/hkI4ez" class="a-link" style="background:var(--rakuten)">楽天</a>
                    <a href="https://www.jalan.net/" class="a-link" style="background:var(--jalan)">じゃらん</a>
                    <a href="https://www.ikyu.com/" class="a-link" style="background:var(--ikyu)">一休</a>
                </div>
            </div>
        </div>

        <div class="search-panel">
            <select class="biz-select" id="site-select" onchange="document.getElementById('main-search-btn').className=this.value?'active':''">
                <option value="">その他のエリアを検索（サイトを選択）</option>
                <option value="https://travel.rakuten.co.jp/">楽天トラベル</option>
                <option value="https://www.jalan.net/">じゃらんnet</option>
                <option value="https://www.ikyu.com/">一休.com</option>
            </select>
            <button id="main-search-btn" onclick="window.open(document.getElementById('site-select').value, '_blank')">SEARCH AREA</button>
        </div>

        <div class="section-title">Recommended Hotels</div>
        <div class="hotel-swiper" id="hotel-root"></div>

        <div class="section-title">Active Coupons</div>
        <div id="coupon-root"></div>

        <div class="section-title">Business Intelligence</div>
        <div id="tips-root"></div>
    </div>

<script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSYeo6mC85kmstRg6iJaxb7dgvy37mPo3knc09k0-82LZF_M5xaYRoRXbsUJig1CKldigIl03CT0Kww/pub?gid=0&single=true&output=csv";

    async function loadData() {
        const res = await fetch(CSV_URL);
        const csv = await res.text();
        const rows = csv.split('\n').slice(1).map(r => r.split(',').map(c => c.trim().replace(/^"|"$/g, '')));
        
        let hHtml = '', cHtml = '', tHtml = '';
        const now = new Date();

        rows.forEach(row => {
            const [type, brand, title, start, end, url, img, disc, fTxt] = row;
            if (start && end && (now < new Date(start) || now > new Date(end))) return;

            if (type === 'HOTEL') {
                const bCol = brand.includes("楽天") ? "var(--rakuten)" : brand.includes("じゃらん") ? "var(--jalan)" : "var(--ikyu)";
                hHtml += `<a href="${url}" target="_blank" class="hotel-card"><div class="hotel-img" style="background-image:url('${img}')"><div class="hotel-tag" style="background:${bCol}">${brand}</div></div><div class="hotel-info"><div class="hotel-title">${title}</div><div class="hotel-price">${disc} 〉</div></div></a>`;
            } else if (type === 'COUPON') {
                const bCol = brand.includes("楽天") ? "var(--rakuten)" : brand.includes("じゃらん") ? "var(--jalan)" : "var(--ikyu)";
                cHtml += `<a href="${url}" target="_blank" class="cp-item"><div class="cp-side" style="background:${bCol}">${disc}</div><div class="cp-main">${title}</div></a>`;
            } else if (type === 'TIPS') {
                tHtml += `<div class="tips-card"><i class="fa-solid fa-lightbulb"></i><div class="tips-text">${title}</div></div>`;
            }
        });

        document.getElementById('hotel-root').innerHTML = hHtml;
        document.getElementById('coupon-root').innerHTML = cHtml;
        document.getElementById('tips-root').innerHTML = tHtml;
    }

    function init() {
        const d = new Date(); document.getElementById('header-date').innerText = d.toLocaleDateString() + ' SAT';
        const day = d.getDate(); const alert = document.getElementById('campaign-alert'); let msgs = [];
        if([5,10,15,20,25,30].includes(day)) msgs.push('【楽天】5と0のつく日：高級宿 5%OFF');
        if([1,9,11,19,21,29,31].includes(day)) msgs.push('【一休】1と9のつく日：ポイント10%以上');
        if(day === 10) msgs.push('【じゃらん】お得な10日間');
        if(msgs.length) { alert.innerHTML = msgs.join(' / '); alert.style.display = 'block'; }
        loadData();
    }
    init();
</script>
</body>
</html>
