<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIP_DASH. | ビジネス旅行ダッシュボード</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        :root {
            --biz-bg: #121416; --biz-card: #1c1e21; --biz-blue: #007aff;
            --rakuten-green: #28a745; --jalan-orange: #ff9900;
            --text-main: #ffffff; --text-sub: #b0b3b8; --accent-gold: #d4af37; --header-h: 60px;
        }
        body { margin: 0; background: var(--biz-bg); font-family: -apple-system, sans-serif; color: var(--text-main); line-height: 1.4; }
        .biz-header { position: fixed; top: 0; width: 100%; height: var(--header-h); background: rgba(18,20,22,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid #333; z-index: 2000; display: flex; align-items: center; padding: 0 15px; box-sizing: border-box; }
        .biz-logo { font-weight: 900; color: var(--accent-gold); text-decoration: none; font-size: 18px; letter-spacing: 1px; }

        /* インテリジェンスセクション（上部） */
        .intel-section { margin-top: calc(var(--header-h) + 10px); padding: 0 12px; }
        .builtin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .builtin-card { border-radius: 10px; padding: 12px; text-decoration: none; color: inherit; border: 1px solid #333; background: var(--biz-card); }
        .weather-card { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); border: none; }
        .intel-label { font-size: 10px; color: var(--accent-gold); margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }
        .status-dot { width: 6px; height: 6px; background: #4caf50; border-radius: 50%; box-shadow: 0 0 6px #4caf50; }
        .intel-val { font-size: 13px; font-weight: bold; margin: 0; }

        .intel-icon-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 15px; }
        .icon-btn { background: var(--biz-card); border-radius: 8px; padding: 8px; border: 1px solid #333; text-decoration: none; color: inherit; text-align: center; font-size: 9px; }
        .icon-btn i { font-size: 14px; margin-bottom: 3px; display: block; color: var(--accent-gold); }

        /* セール（強調表示） */
        .section-title { padding: 10px 15px 5px; font-size: 11px; font-weight: bold; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 1px; }
        .sale-container { padding: 0 12px; margin-bottom: 15px; }
        .limited-sale-card { 
            background: linear-gradient(145deg, #25282c 0%, #1c1e21 100%); 
            border: 2px solid var(--accent-gold); 
            border-radius: 12px; padding: 15px; text-decoration: none; color: inherit; display: block;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2); position: relative; overflow: hidden;
        }
        .limited-sale-card::after {
            content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.05), transparent);
            transform: rotate(45deg); animation: shine 3s infinite;
        }
        @keyframes shine { 0% { transform: translateX(-100%) rotate(45deg); } 100% { transform: translateX(100%) rotate(45deg); } }

        /* クーポン（2列並び & カラー判定） */
        .coupon-grid { padding: 0 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .coupon-card { 
            background: #fff; border-radius: 8px; overflow: hidden; 
            text-decoration: none; color: #333; display: flex; flex-direction: column; 
            border: 1px solid #ddd; height: 100%;
        }
        .coupon-label { 
            padding: 4px; text-align: center; font-size: 9px; font-weight: 900; color: #fff;
            background: var(--biz-blue); /* デフォルト */
        }
        .label-rakuten { background: var(--rakuten-green) !important; }
        .label-jalan { background: var(--jalan-orange) !important; }
        
        .coupon-main { padding: 8px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .coupon-title { font-size: 11px; font-weight: bold; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .coupon-code { font-family: monospace; font-size: 10px; color: var(--biz-blue); border: 1px dashed #ccc; padding: 2px; text-align: center; background: #f0f4f8; border-radius: 4px; }
        
        .timer { color: #ff453a; font-size: 10px; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

<header class="biz-header"><a href="#" class="biz-logo">TRIP_DASH.</a></header>

<div class="intel-section">
    <div class="builtin-grid">
        <a href="https://traininfo.jr-central.co.jp/shinkansen/pc/ja/index.html" target="_blank" class="builtin-card">
            <div class="intel-label"><span class="status-dot"></span> JR 運行状況</div>
            <p class="intel-val">東海道新幹線<br>平常運転</p>
        </a>
        <a href="https://weathernews.jp/onebox/" target="_blank" class="builtin-card weather-card">
            <div class="intel-label" style="color:#fff;"><i class="fa-solid fa-cloud-sun"></i> 東京の天気</div>
            <p class="intel-val" style="color:#fff;">12°C Cloudy</p>
        </a>
    </div>
    <div class="intel-icon-grid">
        <a href="https://www.jartic.or.jp/" target="_blank" class="icon-btn"><i class="fa-solid fa-car"></i>渋滞</a>
        <a href="https://ja.flightaware.com/live/" target="_blank" class="icon-btn"><i class="fa-solid fa-plane"></i>フライト</a>
        <a href="https://weathernews.jp/onebox/radar/" target="_blank" class="icon-btn"><i class="fa-solid fa-cloud-showers-heavy"></i>雨雲</a>
    </div>
</div>

<div class="section-title"><i class="fa-solid fa-fire"></i> Priority Sales</div>
<div id="sale-area" class="sale-container"></div>

<div class="section-title"><i class="fa-solid fa-ticket"></i> Active Coupons</div>
<div id="coupon-area" class="coupon-grid"></div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSYeo6mC85kmstRg6iJaxb7dgvy37mPo3knc09k0-82LZF_M5xaYRoRXbsUJig1CKldigIl03CT0Kww/pub?gid=0&single=true&output=csv";

async function updateDashboard() {
    try {
        const response = await fetch(CSV_URL);
        const data = await response.text();
        const rows = data.split('\n').map(row => row.split(','));
        const now = new Date();

        let saleHtml = '';
        let couponHtml = '';

        for(let i = 1; i < rows.length; i++) {
            const [type, title, start, end, url, descOrCode, discount] = rows[i];
            if(!type || !title) continue;

            const startTime = new Date(start);
            const endTime = new Date(end);

            if (now >= startTime && now <= endTime) {
                if (type.trim() === 'SALE') {
                    saleHtml += `
                    <a href="${url}" class="limited-sale-card">
                        <span style="background:var(--accent-gold); color:#000; font-size:10px; padding:2px 6px; border-radius:3px; font-weight:bold;">LIMITED SALE</span>
                        <h3 style="margin:10px 0 5px; font-size:16px;">${title}</h3>
                        <p style="font-size:12px; color:var(--text-sub); margin:0;">${descOrCode}</p>
                        <div class="timer" id="timer-${i}">終了まで計算中...</div>
                    </a>`;
                    setupTimer(`timer-${i}`, endTime);
                } else if (type.trim() === 'COUPON') {
                    // ブランドカラー判定
                    let labelClass = "";
                    if (title.includes("楽天")) labelClass = "label-rakuten";
                    if (title.includes("じゃらん")) labelClass = "label-jalan";

                    couponHtml += `
                    <a href="${url}" class="coupon-card">
                        <div class="coupon-label ${labelClass}">${discount || 'COUPON'}</div>
                        <div class="coupon-main">
                            <div class="coupon-title">${title}</div>
                            <div class="coupon-code">${descOrCode}</div>
                        </div>
                    </a>`;
                }
            }
        }
        document.getElementById('sale-area').innerHTML = saleHtml || '<p style="font-size:11px; color:#555;">現在開催中のセールはありません</p>';
        document.getElementById('coupon-area').innerHTML = couponHtml || '<p style="font-size:11px; color:#555;">現在有効なクーポンはありません</p>';

    } catch (e) { console.error("Load Error", e); }
}

function setupTimer(id, end) {
    setInterval(() => {
        const now = new Date();
        const diff = end - now;
        if (diff <= 0) {
            const el = document.getElementById(id);
            if(el) el.closest('.limited-sale-card').style.display = 'none';
            return;
        }
        const h = Math.floor(diff / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        document.getElementById(id).innerHTML = `<i class="fa-solid fa-clock"></i> 残り ${h}h ${m}m ${s}s`;
    }, 1000);
}

updateDashboard();
</script>
</body>
</html>
