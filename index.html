<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRIP_DASH. | Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        :root {
            --biz-bg: #0d0f11; --biz-card: #1c1f23;
            --rakuten-green: #28a745; --jalan-orange: #ff9900; --ikyu-gold: #a68b5e;
            --text-main: #ffffff; --text-sub: #8e8e93; --accent-gold: #d4af37; --header-h: 65px;
            /* Brand Colors */
            --jr-tokai: #f60; --jr-east: #008000; --jr-west: #0072bc;
            --jal-red: #e0000e; --ana-blue: #0067b1; --sky-blue: #003399;
            --nikkei: #004098; --newspicks: #000000; --bloomberg: #285ae6;
        }
        * { box-sizing: border-box; scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--biz-bg); font-family: -apple-system, sans-serif; color: var(--text-main); line-height: 1.4; overflow-x: hidden; padding-top: calc(var(--header-h) + 20px); }
        
        .header-group { position: fixed; top: 0; width: 100%; z-index: 3000; }
        .biz-header { height: var(--header-h); background: rgba(13,15,17,0.95); backdrop-filter: blur(20px); border-bottom: 1px solid #333; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .biz-logo { font-weight: 900; color: var(--accent-gold); text-decoration: none; font-size: 20px; letter-spacing: 2px; }
        .nav-bar { background: rgba(22,26,29,0.95); backdrop-filter: blur(20px); border-bottom: 1px solid #333; padding: 12px 0; display: flex; justify-content: center; gap: 25px; }
        .nav-link { color: var(--text-sub); text-decoration: none; font-size: 11px; font-weight: 800; text-transform: uppercase; }

        .container { width: 100%; max-width: 1000px; margin: 0 auto; padding: 0 15px; }
        .section-title { padding: 25px 0 10px; font-size: 10px; font-weight: 800; color: var(--text-sub); border-bottom: 1px solid #2d3436; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; }

        /* FIELD OPERATIONS: PANEL UI */
        .panel-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .op-panel { background: var(--biz-card); border: 1px solid #333; border-radius: 12px; padding: 15px; position: relative; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); overflow: hidden; }
        .op-panel:active { transform: scale(0.97); background: #25282c; }
        .panel-icon-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .panel-icon { font-size: 20px; color: var(--accent-gold); }
        .panel-status { font-size: 10px; font-weight: 800; display: flex; align-items: center; gap: 4px; }
        .status-ok { color: #2ecc71; }
        .panel-label { font-size: 11px; font-weight: 900; color: #fff; display: block; }
        .panel-sub { font-size: 9px; color: var(--text-sub); margin-top: 2px; }

        /* EXPANDABLE SECTION */
        .expand-content { max-height: 0; opacity: 0; overflow: hidden; transition: all 0.4s ease; padding: 0; }
        .op-panel.is-open .expand-content { max-height: 200px; opacity: 1; padding-top: 15px; margin-top: 10px; border-top: 1px solid #333; }
        
        .op-btn-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .op-btn { height: 42px; border-radius: 6px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #fff; font-size: 10px; font-weight: 900; border: 1px solid rgba(255,255,255,0.05); }

        /* SALE FLASH (AS PREVIOUS) */
        .limited-sale-card { background: linear-gradient(135deg, #1e1b10 0%, #161a1d 100%); border: 1px solid var(--accent-gold); border-radius: 10px; text-decoration: none; color: inherit; display: flex; overflow: hidden; margin-bottom: 12px; position: relative; height: 90px; }
        .limited-sale-card::after { content: ""; position: absolute; top: -50%; left: -60%; width: 20%; height: 200%; background: rgba(255, 255, 255, 0.1); transform: rotate(30deg); animation: shine 4s infinite; }
        @keyframes shine { 0% { left: -60%; } 20% { left: 120%; } 100% { left: 120%; } }
        .sale-badge-big { background: var(--accent-gold); color: #000; width: 100px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; }
        .sale-content { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: center; }

        /* HOTEL UI */
        .hotel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
        .hotel-card { background: var(--biz-card); border-radius: 12px; overflow: hidden; border: 1px solid #333; }
        .hotel-header { position: relative; height: 70px; background-size: cover; background-position: center; display: flex; align-items: center; padding: 0 15px; }
        .hotel-header::before { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,0.5); }
        .hotel-city { position: relative; font-size: 15px; font-weight: 900; color: #fff; z-index: 2; }
        .hotel-btn-group { display: flex; padding: 10px; gap: 6px; background: #161a1d; }
        .hotel-btn { flex: 1; height: 44px; border-radius: 6px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 10px; font-weight: 900; color: #fff; }

        .rak-bg { background: var(--rakuten-green); } .jal-bg { background: var(--jalan-orange); } .iky-bg { background: var(--ikyu-gold); }
    </style>
</head>
<body>

<div class="header-group">
    <header class="biz-header">
        <a href="#" class="biz-logo">TRIP_DASH.</a>
        <div id="header-date" style="font-size: 11px; font-weight: 800; color: var(--text-sub); font-family: monospace;"></div>
    </header>
    <div class="nav-bar">
        <a href="#sale-section" class="nav-link">Sale</a>
        <a href="#hotel-section" class="nav-link">Hotel</a>
        <a href="#coupon-section" class="nav-link">Coupon</a>
        <a href="#tips-section" class="nav-link">Biz</a>
    </div>
</div>

<div class="container">
    <div class="section-title">Field Operations</div>
    <div class="panel-grid">
        <div class="op-panel" onclick="this.classList.toggle('is-open')">
            <div class="panel-icon-row">
                <i class="fa-solid fa-cloud-sun panel-icon"></i>
                <div class="panel-status status-ok" id="temp-val">--°C</div>
            </div>
            <span class="panel-label">WEATHER</span>
            <span class="panel-sub" id="local-city">Detecting...</span>
            <div class="expand-content">
                <a id="weather-detail-btn" href="#" target="_blank" class="op-btn" style="background:#333; width:100%;">詳細予報を表示</a>
            </div>
        </div>

        <div class="op-panel" onclick="this.classList.toggle('is-open')">
            <div class="panel-icon-row">
                <i class="fa-solid fa-train panel-icon"></i>
                <div class="panel-status status-ok"><i class="fa-solid fa-circle"></i> 通常</div>
            </div>
            <span class="panel-label">SHINKANSEN</span>
            <span class="panel-sub">運行状況を確認</span>
            <div class="expand-content">
                <div class="op-btn-row">
                    <a href="https://traininfo.jr-central.co.jp/shinkansen/pc/ja/index.html" target="_blank" class="op-btn" style="background:var(--jr-tokai)">東海</a>
                    <a href="https://traininfo.jreast.co.jp/train_info/shinkansen.aspx" target="_blank" class="op-btn" style="background:var(--jr-east)">東日本</a>
                    <a href="https://www.train-info.westjr.co.jp/shinkansen/" target="_blank" class="op-btn" style="background:var(--jr-west)">西日本</a>
                </div>
            </div>
        </div>

        <div class="op-panel" onclick="this.classList.toggle('is-open')">
            <div class="panel-icon-row">
                <i class="fa-solid fa-plane panel-icon"></i>
                <div class="panel-status status-ok"><i class="fa-solid fa-circle"></i> 定時</div>
            </div>
            <span class="panel-label">FLIGHTS</span>
            <span class="panel-sub">国内線 運航情報</span>
            <div class="expand-content">
                <div class="op-btn-row">
                    <a href="https://www.jal.co.jp/cms/other/ja/weather_info_dom.html" target="_blank" class="op-btn" style="background:var(--jal-red)">JAL</a>
                    <a href="https://www.ana.co.jp/fs/dom/jp/" target="_blank" class="op-btn" style="background:var(--ana-blue)">ANA</a>
                    <a href="https://www.skymark.co.jp/ja/fleets/flight_info.html" target="_blank" class="op-btn" style="background:var(--sky-blue)">SKY</a>
                </div>
            </div>
        </div>

        <div class="op-panel" onclick="this.classList.toggle('is-open')">
            <div class="panel-icon-row">
                <i class="fa-solid fa-briefcase panel-icon"></i>
            </div>
            <span class="panel-label">INTELLIGENCE</span>
            <span class="panel-sub">ビジネスニュース</span>
            <div class="expand-content">
                <div class="op-btn-row">
                    <a href="https://www.nikkei.com/" target="_blank" class="op-btn" style="background:var(--nikkei)">日経</a>
                    <a href="https://newspicks.com/" target="_blank" class="op-btn" style="background:var(--newspicks)">NP</a>
                    <a href="https://www.bloomberg.co.jp/" target="_blank" class="op-btn" style="background:var(--bloomberg)">BBG</a>
                </div>
            </div>
        </div>
    </div>

    <section id="sale-section" style="display:none;"><div class="section-title">Now on Sale!!!</div><div id="sale-area"></div></section>
    <section id="hotel-section"><div class="section-title">Hotel Search</div><div class="hotel-grid" id="hotel-grid-root"></div></section>
    <section id="coupon-section" style="display:none;"><div class="section-title">Premium Coupons</div><div id="coupon-root"></div></section>
    <section id="tips-section"><div class="section-title">Business Tips</div><div id="tips-area" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap:15px; margin-bottom:50px;"></div></section>
</div>

<footer>
    <div class="footer-sns" style="display:flex; justify-content:center; gap:40px; margin-bottom:30px;">
        <a href="https://www.instagram.com/hazusanai_mens" target="_blank" style="color:#fff; font-size:24px;"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://x.com/tokutabi_pro" target="_blank" style="color:#fff; font-size:24px;"><i class="fa-brands fa-x-twitter"></i></a>
    </div>
    <p style="text-align:center; font-size:10px; color:var(--text-sub);">&copy; 2026 TRIP_DASH.</p>
</footer>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSYeo6mC85kmstRg6iJaxb7dgvy37mPo3knc09k0-82LZF_M5xaYRoRXbsUJig1CKldigIl03CT0Kww/pub?gid=0&single=true&output=csv";

async function initLocation() {
    try {
        const res = await fetch('https://ip-api.com/json/?lang=ja');
        const data = await res.json();
        if(data.city) {
            document.getElementById('local-city').innerText = `${data.regionName} ${data.city}`;
            document.getElementById('weather-detail-btn').href = `https://weather.yahoo.co.jp/weather/search/?p=${encodeURIComponent(data.city)}`;
            // 擬似気温（本来はOpenWeatherMap等が必要だがUI用にランダム表示）
            document.getElementById('temp-val').innerText = (Math.floor(Math.random() * 10) + 5) + "°C";
        }
    } catch (e) { document.getElementById('local-city').innerText = "Tokyo"; }
}

const AREAS = [
    { name: 'TOKYO / 東京', img: 'https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?w=600', rakuten: 'https://a.r10.to/hYb8ED', jalan: 'https://ck.jp.ap.valuecommerce.com/servlet/referral?sid=3762635&pid=892535803&vc_url=https%3A%2F%2Fwww.jalan.net%2Fuw%2Fuwp2011%2Fuww2011init.do%3Fkeyword%3D%2593%258C%258B%259E%2589w', ikyu: 'https://ck.jp.ap.valuecommerce.com/servlet/referral?sid=3762635&pid=892535794&vc_url=https%3A%2F%2Fwww.ikyu.com%2Ftokyo%2F140000%2F' },
    { name: 'OSAKA / 大阪', img: 'https://images.unsplash.com/photo-1590559899731-a382839e5549?w=600', rakuten: 'https://a.r10.to/hkI4ez', jalan: 'https://ck.jp.ap.valuecommerce.com/servlet/referral?sid=3762635&pid=892535803&vc_url=https%3A%2F%2Fwww.jalan.net%2Fuw%2Fuwp2011%2Fuww2011search.do', ikyu: 'https://ck.jp.ap.valuecommerce.com/servlet/referral?sid=3762635&pid=892535794&vc_url=https%3A%2F%2Fwww.ikyu.com%2Fosaka%2F' },
    { name: 'NAGOYA / 名古屋', img: 'https://images.unsplash.com/photo-1596230529625-7ee10f7b09b6?w=600', rakuten: 'https://a.r10.to/hPVp2x', jalan: 'https://ck.jp.ap.valuecommerce.com/servlet/referral?sid=3762635&pid=892535803&vc_url=https%3A%2F%2Fwww.jalan.net%2Fuw%2Fuwp2011%2Fuww2011search.do', ikyu: 'https://ck.jp.ap.valuecommerce.com/servlet/referral?sid=3762635&pid=892535794&vc_url=https%3A%2F%2Fwww.ikyu.com%2Ftokai%2F23060311%2F' },
    { name: 'FUKUOKA / 福岡', img: 'https://images.unsplash.com/photo-1621350485987-a27909010419?w=600', rakuten: 'https://a.r10.to/hPdo3g', jalan: 'https://ck.jp.ap.valuecommerce.com/servlet/referral?sid=3762635&pid=892535803&vc_url=https%3A%2F%2Fwww.jalan.net%2Fuw%2Fuwp2011%2Fuww2011search.do', ikyu: 'https://ck.jp.ap.valuecommerce.com/servlet/referral?sid=3762635&pid=892535794&vc_url=https%3A%2F%2Fwww.ikyu.com%2Fkyushu%2F35090111%2F' }
];

function initDay() {
    const now = new Date();
    const days = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
    document.getElementById('header-date').innerText = `${now.getFullYear()}.${now.getMonth()+1}.${now.getDate()} ${days[now.getDay()]}`;
}

function initHotels() {
    document.getElementById('hotel-grid-root').innerHTML = AREAS.map(a => `<div class="hotel-card"><div class="hotel-header" style="background-image:url('${a.img}')"><div class="hotel-city">${a.name}</div></div><div class="hotel-btn-group"><a href="${a.rakuten}" target="_blank" class="hotel-btn rak-bg">楽天</a><a href="${a.jalan}" target="_blank" class="hotel-btn jal-bg">じゃらん</a><a href="${a.ikyu}" target="_blank" class="hotel-btn iky-bg">一休.com</a></div></div>`).join('');
}

async function updateData() {
    try {
        const response = await fetch(CSV_URL);
        const data = await response.text();
        const rows = data.split(/\r?\n/).map(row => row.split(','));
        const now = new Date();
        let sHtml = ''; let tHtml = ''; let coupons = {rak:[], jal:[], iky:[], otr:[]};

        for(let i=1; i<rows.length; i++){
            const [type, brand, title, start, end, url, desc, disc, fTxt] = rows[i].map(s=>s?.trim());
            if(!type || now < new Date(start) || now > new Date(end)) continue;
            const link = url.replace(/['"]+/g, '');

            if(type === 'SALE'){
                sHtml += `<a href="${link}" target="_blank" class="limited-sale-card"><div class="sale-badge-big"><div style="font-size:10px;">MAX</div><div style="font-size:22px;">${disc}</div></div><div class="sale-content"><div style="font-size:8px; font-weight:900; color:var(--accent-gold);">${brand}</div><div style="font-size:13px; font-weight:900; color:#fff;">${title}</div><div style="font-size:9px; color:var(--text-sub);">${desc}</div></div></a>`;
            } else if(type === 'COUPON'){
                const k = brand.includes("楽天")?"rak":brand.includes("じゃらん")?"jal":brand.includes("一休")?"iky":"otr";
                coupons[k].push(`<a href="${link}" target="_blank" class="coupon-card"><div class="coupon-main"><div class="coupon-brand-label">${brand}</div><div class="coupon-title">${title}</div></div><div class="coupon-stub ${k}-bg"><div style="font-size:10px; font-weight:900;">${desc}</div></div></a>`);
            } else if(type === 'TIPS'){
                tHtml += `<div class="tips-card-modern" style="background:var(--biz-card); border-radius:12px; padding:20px; border:1px solid #333; display:flex; align-items:center; gap:15px;" onclick="alert('${fTxt||desc}')"><div style="width:40px; height:40px; background:rgba(212,175,55,0.1); border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--accent-gold);"><i class="fa-solid fa-lightbulb"></i></div><div><div style="font-size:13px; font-weight:800; color:#fff;">${title}</div><div style="font-size:9px; color:var(--text-sub);">${desc}</div></div></div>`;
            }
        }
        if(sHtml) { document.getElementById('sale-area').innerHTML = sHtml; document.getElementById('sale-section').style.display='block'; }
        let cpHtml = '';
        for(let k in coupons){
            if(coupons[k].length){
                cpHtml += `<div class="coupon-grid">${coupons[k].slice(0,4).join('')}</div>`;
                if(coupons[k].length > 4) cpHtml += `<div class="expand-ribbon" onclick="toggleCp('${k}',this)">+ VIEW MORE</div><div id="more-${k}" style="display:none; margin-top:10px;" class="coupon-grid">${coupons[k].slice(4).join('')}</div>`;
            }
        }
        if(cpHtml) { document.getElementById('coupon-root').innerHTML = cpHtml; document.getElementById('coupon-section').style.display='block'; }
        document.getElementById('tips-area').innerHTML = tHtml;
    } catch(e) {}
}

function toggleCp(k, b){ 
    const e = document.getElementById('more-'+k); 
    const open = e.style.display === 'none'; 
    e.style.display = open ? 'grid' : 'none'; 
    b.innerText = open ? 'CLOSE' : '+ VIEW MORE'; 
}

initLocation(); initDay(); initHotels(); updateData();
</script>
</body>
</html>
