<script>
async function updateData() {
    try {
        const res = await fetch(CSV_URL); 
        if (!res.ok) throw new Error('Network error');
        const csv = await res.text();
        const rows = csv.split(/\r?\n/).map(r => r.split(','));
        const now = new Date();
        
        let sHtml = ''; let tHtml = ''; let hHtml = ''; let coupons = {rak:[], jal:[], iky:[], otr:[]};
        let hotelCount = 0;

        // データループ開始（エラーが出てもスキップするように構成）
        for(let i=1; i<rows.length; i++) {
            try {
                const [type, brand, title, start, end, url, direct_url, disc, fTxt] = rows[i].map(s=>s?.trim().replace(/^"|"$/g, '') || '');
                if(!type || type === "") continue;

                // 日付チェック（不正な日付でも止まらないように）
                const startDate = new Date(start);
                const endDate = new Date(end);
                if(type !== 'EMERGENCY' && (isNaN(startDate) || isNaN(endDate) || now < startDate || now > endDate)) continue;

                if(type === 'EMERGENCY') {
                    const bar = document.getElementById('emergency-bar');
                    bar.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${title}`;
                    bar.style.display = 'block'; document.body.classList.add('has-emergency');
                } else if(type === 'HOTEL' && hotelCount < 10) {
                    const bCol = brand.includes("楽天") ? "#28a745" : brand.includes("じゃらん") ? "#ff9900" : "#a68b5e";
                    const seedUrl = direct_url || url || "default";
                    const imgId = Math.abs(seedUrl.split('').reduce((a,b)=>{a=((a<<5)-a)+b.charCodeAt(0);return a&a},0)) % 50;
                    hHtml += `<a href="${url}" target="_blank" class="hotel-card-mini">
                        <div class="mini-img" style="background-image:url('https://picsum.photos/id/${imgId}/400/300')"><div class="mini-brand" style="background:${bCol}">${brand}</div></div>
                        <div class="mini-info"><div class="mini-name">${title || '名称未設定ホテル'}</div><div style="font-size:9px; color:var(--accent-gold); font-weight:900; margin-top:4px;">${fTxt || 'CHECK DETAILS'} <i class="fa-solid fa-chevron-right"></i></div></div></a>`;
                    hotelCount++;
                } else if(type === 'SALE') {
                    sHtml += `<a href="${url}" target="_blank" class="sale-card"><div class="sale-badge"><div class="m-txt">SALE</div><div class="d-txt">${disc || '-'}</div></div><div class="sale-info"><div class="sale-title">${title}</div><div class="sale-timer" data-end="${end}"></div></div></a>`;
                } else if(type === 'COUPON') {
                    const k = brand.includes("楽天")?"rak":brand.includes("じゃらん")?"jal":brand.includes("一休")?"iky":"otr";
                    coupons[k].push(`<a href="${url}" target="_blank" class="coupon-item"><div class="cp-ribbon"><i class="fa-solid fa-star"></i></div><div class="cp-side ${k}-bg">${disc || 'COUPON'}</div><div class="cp-main"><div class="cp-brand">${brand}</div><div class="cp-title">${title}</div></div></a>`);
                } else if(type === 'TIPS') {
                    tHtml += `<div class="op-panel" style="display:flex; align-items:center; gap:12px;"><div style="width:35px; height:35px; background:rgba(212,175,55,0.1); border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--accent-gold);"><i class="fa-solid fa-lightbulb"></i></div><div><div style="font-size:12px; font-weight:800;">${title}</div><div style="font-size:9px; color:var(--text-sub);">${fTxt || ''}</div></div></div>`;
                }
            } catch (e) { console.error("Row processing error:", e); }
        }

        // DOM反映
        document.getElementById('recom-hotel-root').innerHTML = hHtml;
        document.getElementById('recom-hotel-section').style.display = hHtml?'block':'none';
        document.getElementById('sale-area').innerHTML = sHtml;
        document.getElementById('sale-section').style.display = sHtml?'block':'none';
        
        let cpHtml = '';
        for(let k in coupons) {
            if(coupons[k].length === 0) continue;
            cpHtml += `<div class="coupon-group"><div class="coupon-grid">${coupons[k].join('')}</div></div>`;
        }
        document.getElementById('coupon-root').innerHTML = cpHtml;
        document.getElementById('coupon-section').style.display = cpHtml?'block':'none';
        document.getElementById('tips-area').innerHTML = tHtml;

    } catch(e) {
        console.error("CSV Load Error:", e);
    }
}
</script>
