<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRIP_DASH. | Business Intelligence</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        :root {
            --biz-bg: #0d0f11; --biz-card: #1c1f23;
            --rakuten-green: #28a745; --jalan-orange: #ff9900; --ikyu-gold: #a68b5e;
            --text-main: #ffffff; --text-sub: #8e8e93; --accent-gold: #d4af37; --header-h: 65px;
            /* Brand Colors */
            --jr-tokai: #f60; --jr-east: #008000; --jr-west: #0072bc;
            --jal-red: #e0000e; --ana-blue: #0067b1; --sky-blue: #003399;
            --nikkei: #004098; --newspicks: #000000; --bloomberg: #285ae6;
        }
        * { box-sizing: border-box; scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--biz-bg); font-family: -apple-system, sans-serif; color: var(--text-main); line-height: 1.4; overflow-x: hidden; padding-top: calc(var(--header-h) + 50px); }
        
        .header-group { position: fixed; top: 0; width: 100%; z-index: 3000; }
        .biz-header { height: var(--header-h); background: rgba(13,15,17,0.95); backdrop-filter: blur(20px); border-bottom: 1px solid #333; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .biz-logo { font-weight: 900; color: var(--accent-gold); text-decoration: none; font-size: 20px; letter-spacing: 2px; }
        .nav-bar { background: rgba(22,26,29,0.95); backdrop-filter: blur(20px); border-bottom: 1px solid #333; padding: 12px 0; display: flex; justify-content: center; gap: 25px; }
        .nav-link { color: var(--text-sub); text-decoration: none; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }

        .container { width: 100%; max-width: 1000px; margin: 0 auto; padding: 0 15px; }
        .section-title { padding: 30px 0 10px; font-size: 11px; font-weight: 800; color: var(--text-sub); border-bottom: 1px solid #2d3436; margin-bottom: 18px; text-transform: uppercase; letter-spacing: 1.5px; }

        /* FIELD OPERATIONS (RENEWAL) */
        .op-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 30px; }
        .op-card { background: var(--biz-card); border: 1px solid #333; border-radius: 10px; padding: 15px; }
        .op-label { font-size: 9px; color: var(--accent-gold); font-weight: 900; display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
        .op-btn-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .op-btn { height: 44px; border-radius: 6px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #fff; font-size: 10px; font-weight: 900; transition: 0.2s; border: 1px solid rgba(255,255,255,0.1); }
        .op-btn:active { transform: scale(0.95); opacity: 0.8; }
        
        /* WEATHER ONLY SPECIAL */
        .weather-card { display: flex; justify-content: space-between; align-items: center; background: var(--biz-card); border: 1px solid #333; border-radius: 10px; padding: 18px; text-decoration: none; margin-bottom: 12px; }

        /* HOTEL SEARCH (LOGOS) */
        .hotel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
        .hotel-card { background: var(--biz-card); border-radius: 12px; overflow: hidden; border: 1px solid #333; }
        .hotel-header { position: relative; height: 80px; background-size: cover; background-position: center; display: flex; align-items: center; padding: 0 20px; }
        .hotel-header::before { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,0.5); }
        .hotel-city { position: relative; font-size: 16px; font-weight: 900; color: #fff; z-index: 2; }
        .hotel-btn-group { display: flex; padding: 12px; gap: 8px; background: #161a1d; }
        .hotel-btn { flex: 1; height: 45px; border-radius: 6px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 10px; font-weight: 900; color: #fff; text-align: center; }

        /* COUPON UI */
        .coupon-group { margin-bottom: 25px; }
        .coupon-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
        .coupon-card { display: flex; background: var(--biz-card); border-radius: 8px; overflow: hidden; text-decoration: none; border: 1px solid #333; height: 85px; }
        .coupon-main { flex: 7; padding: 12px; border-right: 1px dotted #444; display: flex; flex-direction: column; justify-content: center; }
        .coupon-brand-label { font-size: 7px; color: var(--accent-gold); font-weight: 900; margin-bottom: 3px; }
        .coupon-title { font-size: 11px; font-weight: 900; color: #fff; line-height: 1.3; }
        .coupon-stub { flex: 3; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 8px; color: #fff; text-align: center; }
        .expand-ribbon { width: 100%; background: #1c1f23; color: var(--accent-gold); border: 1px solid #333; padding: 12px; font-size: 10px; font-weight: 900; text-align: center; cursor: pointer; margin-top: 10px; border-radius: 6px; }
        .more-coupons { display: none; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; margin-top: 12px; }

        /* TIPS UI */
        .tips-area { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; margin-bottom: 50px; }
        .tips-card-modern { background: var(--biz-card); border-radius: 12px; padding: 22px; border: 1px solid #333; display: flex; align-items: center; gap: 18px; cursor: pointer; position: relative; }
        .tips-icon { width: 48px; height: 48px; background: rgba(212, 175, 55, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--accent-gold); font-size: 22px; flex-shrink: 0; }

        .rak-bg { background: var(--rakuten-green); } .jal-bg { background: var(--jalan-orange); } .iky-bg { background: var(--ikyu-gold); }

        footer { padding: 60px 20px; background: #080a0c; border-top: 1px solid #333; text-align: center; }
        .footer-sns { display: flex; justify-content: center; gap: 40px; margin-bottom: 30px; }
        .footer-sns a { color: #fff; font-size: 26px; text-decoration: none; }
    </style>
</head>
<body>

<div class="header-group">
    <header class="biz-header">
        <a href="#" class="biz-logo">TRIP_DASH.</a>
        <div id="header-date" style="font-size: 11px; font-weight: 800; color: var(--text-sub); font-family: monospace;">---.--.-- ---</div>
    </header>
    <div class="nav-bar">
        <a href="#sale-section" class="nav-link">Sale</a>
        <a href="#hotel-section" class="nav-link">Hotel</a>
        <a href="#coupon-section" class="nav-link">Coupon</a>
        <a href="#tips-section" class="nav-link">Intelligence</a>
    </div>
</div>

<div class="container">
    <div id="day-alert-banner"></div>

    <div class="section-title">Field Operations</div>
    
    <a id="weather-link" href="https://weather.yahoo.co.jp/weather/" target="_blank" class="weather-card">
        <div>
            <div class="op-label" style="margin-bottom:4px;"><i class="fa-solid fa-cloud-sun"></i> LOCAL WEATHER</div>
            <div id="local-city" style="font-size: 16px; font-weight: 900;">Detecting Area...</div>
        </div>
        <i class="fa-solid fa-chevron-right" style="color:var(--accent-gold);"></i>
    </a>

    <div class="op-grid">
        <div class="op-card">
            <div class="op-label"><i class="fa-solid fa-train"></i> SHINKANSEN INFO</div>
            <div class="op-btn-row">
                <a href="https://traininfo.jr-central.co.jp/shinkansen/pc/ja/index.html" target="_blank" class="op-btn" style="background:var(--jr-tokai)">東海</a>
                <a href="https://traininfo.jreast.co.jp/train_info/shinkansen.aspx" target="_blank" class="op-btn" style="background:var(--jr-east)">東日本</a>
                <a href="https://www.train-info.westjr.co.jp/shinkansen/" target="_blank" class="op-btn" style="background:var(--jr-west)">西日本</a>
            </div>
        </div>
        <div class="op-card">
            <div class="op-label"><i class="fa-solid fa-plane"></i> FLIGHT INFO</div>
            <div class="op-btn-row">
                <a href="https://www.jal.co.jp/cms/other/ja/weather_info_dom.html" target="_blank" class="op-btn" style="background:var(--jal-red)">JAL</a>
                <a href="https://www.ana.co.jp/fs/dom/jp/" target="_blank" class="op-btn" style="background:var(--ana-blue)">ANA</a>
                <a href="https://www.skymark.co.jp/ja/fleets/flight_info.html" target="_blank" class="op-btn" style="background:var(--sky-blue)">SKY</a>
            </div>
        </div>
        <div class="op-card">
            <div class="op-label"><i class="fa-solid fa-briefcase"></i> BUSINESS INTELLIGENCE</div>
            <div class="op-btn-row">
                <a href="https://www.nikkei.com/" target="_blank" class="op-btn" style="background:var(--nikkei)">日経</a>
                <a href="https://newspicks.com/" target="_blank" class="op-btn" style="background:var(--newspicks)">NP</a>
                <a href="https://www.bloomberg.co.jp/" target="_blank" class="op-btn" style="background:var(--bloomberg)">BBG</a>
            </div>
        </div>
    </div>

    <section id="sale-section" style="display:none;"><div class="section-title">Now on Sale!!!</div><div id="sale-area"></div></section>
    
    <section id="hotel-section">
        <div class="section-title">Hotel Search</div>
        <div class="hotel-grid" id="hotel-grid-root"></div>
    </section>

    <section id="coupon-section" style="display:none;"><div class="section-title">Premium Coupons</div><div id="coupon-root"></div></section>

    <section id="tips-section">
        <div class="section-title">Business Intelligence</div>
        <div id="tips-area" class="tips-area"></div>
    </section>
</div>

<footer>
    <div class="footer-sns">
        <a href="https://www.instagram.com/hazusanai_mens" target="_blank"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://x.com/tokutabi_pro" target="_blank"><i class="fa-brands fa-x-twitter"></i></a>
    </div>
    <p style="font-size: 10px; color: var(--text-sub); letter-spacing: 2px; text-transform: uppercase;">&copy; 2026 TRIP_DASH. All Rights Reserved.</p>
</footer>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSYeo6mC85kmstRg6iJaxb7dgvy37mPo3knc09k0-82LZF_M5xaYRoRXbsUJig1CKldigIl03CT0Kww/pub?gid=0&single=true&output=csv";

async function initLocation() {
    try {
        const res = await fetch('https://ip-api.com/json/?lang=ja');
        const data = await res.json();
        if(data.city) {
            document.getElementById('local-city').innerText = `${data.regionName} ${data.city}`;
            document.getElementById('weather-link').href = `https://weather.yahoo.co.jp/weather/search/?p=${encodeURIComponent(data.city)}`;
        }
    } catch (e) { document.getElementById('local-city').innerText = "Tokyo / 東京"; }
}

function initDayDisplay() {
    const now = new Date();
    const days = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
    document.getElementById('header-date').innerText = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${days[now.getDay()]}`;
    const d = now.getDate();
    const banner = document.getElementById('day-alert-banner');
    if([5,10,15,20,25,30].includes(d)) { banner.innerText = `本日 ${d}日は「楽天トラベル 5と0のつく日」開催中`; banner.style.display = 'block'; }
    else if([1,9,19].includes(d)) { banner.innerText = `本日 ${d}日は「一休の日」ポイント還元開催中`; banner.style.display = 'block'; }
}

const AREAS = [
    { name: 'TOKYO / 東京', img: 'https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?w=600', rakuten: 'https://a.r10.to/hYb8ED', jalan: 'https://ck.jp.ap.valuecommerce.com/servlet/referral?sid=3762635&pid=892535803&vc_url=https%3A%2F%2Fwww.jalan.net%2Fuw%2Fuwp2011%2Fuww2011init.do%3Fkeyword%3D%2593%258C%258B%259E%2589w', ikyu: 'https://ck.jp.ap.valuecommerce.com/servlet/referral?sid=3762635&pid=892535794&vc_url=https%3A%2F%2Fwww.ikyu.com%2Ftokyo%2F140000%2F' },
    { name: 'OSAKA / 大阪', img: 'https://images.unsplash.com/photo-1590559899731-a382839e5549?w=600', rakuten: 'https://a.r10.to/hkI4ez', jalan: 'https://ck.jp.ap.valuecommerce.com/servlet/referral?sid=3762635&pid=892535803&vc_url=https%3A%2F%2Fwww.jalan.net%2Fuw%2Fuwp2011%2Fuww2011search.do', ikyu: 'https://ck.jp.ap.valuecommerce.com/servlet/referral?sid=3762635&pid=892535794&vc_url=https%3A%2F%2Fwww.ikyu.com%2Fosaka%2F' },
    { name: 'NAGOYA / 名古屋', img: 'https://images.unsplash.com/photo-1596230529625-7ee10f7b09b6?w=600', rakuten: 'https://a.r10.to/hPVp2x', jalan: 'https://ck.jp.ap.valuecommerce.com/servlet/referral?sid=3762635&pid=892535803&vc_url=https%3A%2F%2Fwww.jalan.net%2Fuw%2Fuwp2011%2Fuww2011search.do', ikyu: 'https://ck.jp.ap.valuecommerce.com/servlet/referral?sid=3762635&pid=892535794&vc_url=https%3A%2F%2Fwww.ikyu.com%2Ftokai%2F23060311%2F' },
    { name: 'FUKUOKA / 福岡', img: 'https://images.unsplash.com/photo-1621350485987-a27909010419?w=600', rakuten: 'https://a.r10.to/hPdo3g', jalan: 'https://ck.jp.ap.valuecommerce.com/servlet/referral?sid=3762635&pid=892535803&vc_url=https%3A%2F%2Fwww.jalan.net%2Fuw%2Fuwp2011%2Fuww2011search.do', ikyu: 'https://ck.jp.ap.valuecommerce.com/servlet/referral?sid=3762635&pid=892535794&vc_url=https%3A%2F%2Fwww.ikyu.com%2Fkyushu%2F35090111%2F' }
];

function initHotelGrid() {
    document.getElementById('hotel-grid-root').innerHTML = AREAS.map((area) => `
        <div class="hotel-card">
            <div class="hotel-header" style="background-image: url('${area.img}')"><div class="hotel-city">${area.name}</div></div>
            <div class="hotel-btn-group">
                <a href="${area.rakuten}" target="_blank" class="hotel-btn rak-bg">楽天</a>
                <a href="${area.jalan}" target="_blank" class="hotel-btn jal-bg">じゃらん</a>
                <a href="${area.ikyu}" target="_blank" class="hotel-btn iky-bg">一休.com</a>
            </div>
        </div>
    `).join('');
}

async function updateDashboard() {
    try {
        const response = await fetch(CSV_URL);
        const data = await response.text();
        const rows = data.split(/\r?\n/).map(row => row.split(','));
        const now = new Date();
        let saleHtml = ''; let tipsHtml = '';
        let coupons = { rakuten: [], jalan: [], ikyu: [], other: [] };

        for(let i = 1; i < rows.length; i++) {
            const row = rows[i].map(s => s?.trim());
            if(row.length < 6) continue;
            const [type, brand, title, start, end, url, desc, discount, fullText] = row;
            const cleanUrl = url.replace(/['"]+/g, '');
            if(!type || !title || now < new Date(start) || now > new Date(end)) continue;

            const bKey = brand.includes("楽天")?"rakuten":brand.includes("じゃらん")?"jalan":brand.includes("一休")?"ikyu":"other";
            
            if (type === 'SALE') {
                saleHtml += `<a href="${cleanUrl}" target="_blank" class="limited-sale-card"><div class="sale-badge-big"><div style="font-size:10px;">MAX</div><div style="font-size:22px;">${discount}</div></div><div class="sale-content"><div style="font-size:9px; font-weight:900; color:var(--accent-gold);">${brand}</div><div style="font-size:13px; font-weight:900; color:#fff;">${title}</div><div style="font-size:10px; color:var(--text-sub);">${desc}</div></div></a>`;
            } else if (type === 'COUPON') {
                coupons[bKey].push(`<a href="${cleanUrl}" target="_blank" class="coupon-card"><div class="coupon-main"><div class="coupon-brand-label">${brand}</div><div class="coupon-title">${title}</div></div><div class="coupon-stub ${bKey.slice(0,3)}-bg"><div style="font-size:10px; font-weight:900;">${desc}</div></div></a>`);
            } else if (type === 'TIPS') {
                tipsHtml += `<div class="tips-card-modern" onclick="alert('${fullText || desc}')"><div class="tips-icon"><i class="fa-solid fa-lightbulb"></i></div><div><div style="font-size:14px; font-weight:800; color:#fff;">${title}</div><div style="font-size:10px; color:var(--text-sub); margin-top:5px;">${desc}</div></div></div>`;
            }
        }
        if(saleHtml) { document.getElementById('sale-area').innerHTML = saleHtml; document.getElementById('sale-section').style.display = 'block'; }
        
        let cpRoot = '';
        for (const key in coupons) {
            if (coupons[key].length > 0) {
                const visible = coupons[key].slice(0, 4).join('');
                const hidden = coupons[key].length > 4 ? coupons[key].slice(4).join('') : '';
                cpRoot += `<div class="coupon-group"><div class="coupon-grid">${visible}</div>${hidden ? `<div class="more-coupons" id="more-${key}">${hidden}</div><div class="expand-ribbon" onclick="toggleMore('${key}', this)">+ VIEW ${coupons[key].length - 4} MORE DEALS</div>` : ''}</div>`;
            }
        }
        if(cpRoot) { document.getElementById('coupon-root').innerHTML = cpRoot; document.getElementById('coupon-section').style.display = 'block'; }
        document.getElementById('tips-area').innerHTML = tipsHtml;
    } catch (e) { console.error(e); }
}

function toggleMore(key, btn) {
    const el = document.getElementById('more-' + key);
    const isHidden = el.style.display === 'none' || el.style.display === '';
    el.style.display = isHidden ? 'grid' : 'none';
    btn.innerText = isHidden ? 'CLOSE' : `+ VIEW ${el.children.length} MORE DEALS`;
}

initLocation(); initDayDisplay(); initHotelGrid(); updateDashboard();
</script>
</body>
</html>
