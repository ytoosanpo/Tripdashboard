<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TRIP_DASH. | ver. 2.8.3</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        :root {
            --biz-bg: #0d0f11; --biz-card: #1c1f23;
            --rakuten: #28a745; --jalan: #ff9900; --ikyu: #a68b5e;
            --text-main: #ffffff; --text-sub: #8e8e93; --gold: #d4af37;
            --alert-red: #e74c3c; --success-green: #2ecc71;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { background: var(--biz-bg); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding-top: 60px; padding-bottom: 40px; }

        /* 警報バナー */
        #emergency-banner { display: none; background: var(--alert-red); color: #fff; padding: 12px; font-size: 11px; font-weight: 900; text-align: center; position: fixed; top: 0; width: 100%; z-index: 5000; }
        body.has-em { padding-top: 100px; } body.has-em .biz-header { top: 40px; }

        /* セール・特定日バナー（新聞風） */
        .campaign-banner { border-top: 3px double var(--gold); border-bottom: 3px double var(--gold); background: #1a1500; color: var(--gold); padding: 12px; font-weight: 900; font-size: 13px; text-align: center; margin-bottom: 15px; font-family: "Hiragino Mincho ProN", serif; }

        .biz-header { height: 60px; background: rgba(13,15,17,0.98); border-bottom: 1px solid #333; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: fixed; top: 0; width: 100%; z-index: 4000; }
        .biz-logo { font-weight: 900; color: var(--gold); font-size: 18px; text-decoration: none; }

        .container { width: 100%; max-width: 800px; margin: 0 auto; padding: 25px 15px; }
        .section-title { font-size: 10px; font-weight: 800; color: var(--text-sub); border-left: 3px solid var(--gold); padding-left: 10px; margin: 30px 0 15px; text-transform: uppercase; }

        /* Field Operations */
        .op-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .op-card { background: var(--biz-card); border-radius: 12px; padding: 18px; border: 1px solid #2a2a2a; position: relative; }
        .op-icon { position: absolute; top: 18px; right: 18px; color: var(--gold); opacity: 0.4; }
        .op-val { font-size: 13px; font-weight: 900; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
        .dot-green { background: var(--success-green); box-shadow: 0 0 8px var(--success-green); }
        .op-select { width: 100%; background: #000; color: var(--gold); border: 1px solid #444; font-size: 10px; padding: 6px; border-radius: 4px; font-weight: 800; }

        /* Hotel Carousel */
        .hotel-swiper { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 10px; scroll-snap-type: x mandatory; }
        .hotel-swiper::-webkit-scrollbar { display: none; }
        .hotel-card { flex: 0 0 260px; background: var(--biz-card); border-radius: 12px; border: 1px solid #2a2a2a; overflow: hidden; text-decoration: none; }
        .hotel-img { height: 130px; background-size: cover; background-position: center; position: relative; }
        .hotel-tag { position: absolute; top: 10px; left: 10px; font-size: 9px; padding: 3px 8px; border-radius: 4px; color: #fff; font-weight: 900; }
        .hotel-info { padding: 12px; }
        .hotel-title { font-size: 13px; font-weight: 900; color: #fff; margin-bottom: 5px; height: 38px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* Coupon Section */
        .cp-item { background: var(--biz-card); border-radius: 12px; display: flex; height: 80px; text-decoration: none; border: 1px solid #2a2a2a; overflow: hidden; margin-bottom: 10px; }
        .cp-side { width: 80px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; color: #fff; text-align: center; }
        .cp-main { flex: 1; padding: 12px; display: flex; align-items: center; font-size: 11px; font-weight: 800; color: #fff; border-left: 1px solid #333; }

        /* Footer & SNS */
        .biz-footer { border-top: 1px solid #333; padding: 30px 20px; text-align: center; margin-top: 50px; }
        .sns-icons { display: flex; justify-content: center; gap: 20px; margin-bottom: 15px; }
        .sns-icons a { color: var(--text-sub); font-size: 18px; }
    </style>
</head>
<body>
    <div id="emergency-banner"></div>
    <header class="biz-header">
        <div class="biz-logo">TRIP_DASH.</div>
        <div id="header-date" style="font-size:11px; font-weight:900; color:var(--text-sub); font-family:monospace;"></div>
    </header>

    <div class="container">
        <div id="campaign-root"></div>

        <div class="section-title">Field Operations</div>
        <div class="op-grid">
            <div class="op-card">
                <i class="fa-solid fa-cloud-sun op-icon"></i>
                <div class="op-label">WEATHER</div>
                <div class="op-val"><div class="dot dot-green"></div><span>Stable</span></div>
                <select class="op-select" onchange="if(this.value) window.open(this.value,'_blank')">
                    <option value="">RESOURCES</option>
                    <option value="https://tenki.jp/">日本気象協会</option>
                    <option value="https://weathernews.jp/">ウェザーニュース</option>
                </select>
            </div>
            <div class="op-card">
                <i class="fa-solid fa-train op-icon"></i>
                <div class="op-label">SHINKANSEN</div>
                <div class="op-val"><div class="dot dot-green"></div><span>Normal</span></div>
                <select class="op-select" onchange="if(this.value) window.open(this.value,'_blank')">
                    <option value="">RESOURCES</option>
                    <option value="https://traininfo.jreast.co.jp/train_info/shinkansen.aspx">JR東日本</option>
                    <option value="https://traininfo.jr-central.co.jp/shinkansen/pc/index.html">JR東海</option>
                </select>
            </div>
            </div>

        <div class="section-title">Recommended Hotels</div>
        <div class="hotel-swiper" id="hotel-root"></div>

        <div class="section-title">Active Coupons</div>
        <div id="coupon-root"></div>
    </div>

    <footer class="biz-footer">
        <div class="sns-icons">
            <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-line"></i></a>
        </div>
        <div class="copyright">© 2026 TRIP_DASH. ALL RIGHTS RESERVED.</div>
    </footer>

<script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSYeo6mC85kmstRg6iJaxb7dgvy37mPo3knc09k0-82LZF_M5xaYRoRXbsUJig1CKldigIl03CT0Kww/pub?gid=0&single=true&output=csv";

    async function loadData() {
        const res = await fetch(CSV_URL);
        const csv = await res.text();
        const rows = csv.split('\n').slice(1).map(r => r.split(',').map(c => c.trim().replace(/^"|"$/g, '')));
        const now = new Date();
        
        let hHtml = '', cHtml = '', sHtml = '';
        
        // 特定日判定
        const day = now.getDate();
        if([5,10,15,20,25,30].includes(day)) sHtml += `<div class="campaign-banner">【楽天】5と0のつく日：高級・温泉宿 5%OFF</div>`;
        if([1,9,11,19,21,29,31].includes(day)) sHtml += `<div class="campaign-banner">【一休】1と9のつく日：ポイント10%以上還元</div>`;

        rows.forEach(row => {
            const [type, brand, title, start, end, url, img, disc] = row;
            if(start && end && (now < new Date(start) || now > new Date(end))) return;

            if(type === 'SALE') {
                sHtml += `<div class="campaign-banner">${title}</div>`;
            } else if(type === 'HOTEL') {
                const bCol = brand.includes("楽天") ? "var(--rakuten)" : brand.includes("じゃらん") ? "var(--jalan)" : "var(--ikyu)";
                hHtml += `<a href="${url}" target="_blank" class="hotel-card"><div class="hotel-img" style="background-image:url('${img}')"><div class="hotel-tag" style="background:${bCol}">${brand}</div></div><div class="hotel-info"><div class="hotel-title">${title}</div></div></a>`;
            } else if(type === 'COUPON') {
                const bCol = brand.includes("楽天") ? "var(--rakuten)" : brand.includes("じゃらん") ? "var(--jalan)" : "var(--ikyu)";
                cHtml += `<a href="${url}" target="_blank" class="cp-item"><div class="cp-side" style="background:${bCol}">${disc}</div><div class="cp-main">${title}</div></a>`;
            }
        });
        document.getElementById('campaign-root').innerHTML = sHtml;
        document.getElementById('hotel-root').innerHTML = hHtml;
        document.getElementById('coupon-root').innerHTML = cHtml;
    }
    loadData();
</script>
</body>
</html>
