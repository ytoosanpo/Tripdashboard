<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TRIP_DASH. | OFFICIAL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        :root {
            --bg-black: #0d0f11;
            --card-gray: #1c2126;
            --text-main: #ffffff;
            --text-sub: #8e8e93;
            --gold: #d4af37;
            --alert-red: #e74c3c;
            --success-green: #2ecc71;
            --rakuten-red: #bf0000;
            --jalan-orange: #ff9900;
            --ikyu-gold: #a68d52;
            --header-h: 120px;
        }

        /* 既存のベーススタイル */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { background: var(--bg-black); color: var(--text-main); font-family: -apple-system, sans-serif; padding-top: var(--header-h); }
        .container { padding: 15px; max-width: 800px; margin: 0 auto; }

        /* HEADER, NAV, BANNER, HUB (前verを継承) */
        header { position: fixed; top: 0; left: 0; width: 100%; background: rgba(13, 15, 17, 0.95); backdrop-filter: blur(10px); z-index: 9000; border-bottom: 1px solid #2a2a2a; }
        .header-top { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; }
        .logo { font-weight: 900; color: var(--gold); font-size: 20px; letter-spacing: 2px; }
        .refresh-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid rgba(212,175,55,0.3); color: var(--gold); display: flex; align-items: center; justify-content: center; background: rgba(212, 175, 55, 0.05); cursor: pointer; }
        .refresh-btn.success { border-color: var(--success-green); color: var(--success-green); }
        .spin { animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        nav { display: flex; justify-content: center; align-items: center; gap: 8px; padding: 0 10px 12px; overflow-x: auto; }
        nav::-webkit-scrollbar { display: none; }
        .nav-link { font-size: 11px; font-weight: 900; color: var(--text-main); text-decoration: none; padding: 8px 14px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); flex-shrink: 0; }
        
        #emergency-banner { display: none; position: fixed; top: 0; left: 0; width: 100%; background: var(--alert-red); color: #fff; padding: 8px 10px; font-size: 10px; font-weight: 900; text-align: center; z-index: 10000; }
        #sale-banner { display: none; width: 100%; max-width: 800px; margin: 0 auto 15px; border-radius: 12px; padding: 12px; position: relative; overflow: hidden; text-decoration: none; }
        .sale-today { background: linear-gradient(135deg, #8a6e2f 0%, #d4af37 50%, #8a6e2f 100%); color: #000; }
        .sale-preview { background: linear-gradient(135deg, #1c2126 0%, #2c3e50 100%); border: 1px solid var(--gold); color: var(--gold); }
        .sale-rakuten-day { background: linear-gradient(135deg, var(--rakuten-red) 0%, #d4af37 100%); color: #fff; }
        .sale-today::after, .sale-rakuten-day::after { content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent); transform: rotate(30deg); animation: flash 3.5s infinite; }
        @keyframes flash { 0% { left: -100%; } 20% { left: 100%; } 100% { left: 100%; } }

        /* SECTION HEADER */
        .section-header { display: flex; align-items: center; margin: 25px 0 15px; }
        .section-title { font-size: 11px; font-weight: 900; color: var(--gold); letter-spacing: 1.5px; white-space: nowrap; }
        .section-line { height: 1px; background: linear-gradient(90deg, var(--gold), transparent); width: 100%; margin-left: 10px; opacity: 0.4; }

        /* PRIORITY SALES CARD GRID */
        .sale-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .sale-card {
            background: var(--card-gray); border-radius: 16px; border: 1px solid #2a2a2a;
            padding: 16px; display: flex; align-items: center; justify-content: space-between;
            text-decoration: none; position: relative; overflow: hidden; transition: transform 0.2s;
        }
        .sale-card:active { transform: scale(0.98); }

        /* セール中の発光エフェクト */
        .sale-card.active-sale { border: 1.5px solid var(--gold); box-shadow: 0 0 15px rgba(212, 175, 55, 0.2); }
        .sale-card.active-sale::after {
            content: ""; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
            transform: skewX(-25deg); animation: card-flash 4s infinite;
        }
        @keyframes card-flash { 0% { left: -100%; } 25% { left: 150%; } 100% { left: 150%; } }

        .brand-info { display: flex; align-items: center; gap: 12px; }
        .brand-logo-circle {
            width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: 900; color: #fff; flex-shrink: 0;
        }
        .brand-rakuten { background: var(--rakuten-red); }
        .brand-jalan { background: var(--jalan-orange); }
        .brand-ikyu { background: var(--ikyu-gold); }

        .sale-info-text { display: flex; flex-direction: column; gap: 2px; }
        .sale-name { font-size: 14px; font-weight: 900; color: var(--text-main); }
        .sale-disc { font-size: 10px; color: var(--text-sub); font-weight: 500; }

        .sale-badge {
            background: rgba(255, 255, 255, 0.05); padding: 6px 12px; border-radius: 20px;
            font-size: 12px; font-weight: 900; color: var(--gold); border: 1px solid rgba(212, 175, 55, 0.3);
            white-space: nowrap;
        }
        .active-sale .sale-badge { background: var(--gold); color: #000; border: none; }

        @media (max-width: 480px) { :root { --header-h: 110px; } }
    </style>
</head>
<body>

    <div id="emergency-banner"></div>

    <header id="main-header">
        <div class="header-top">
            <div class="logo">TRIP_DASH.</div>
            <div class="refresh-btn" id="refresh-btn" onclick="forceReloadData()">
                <i id="refresh-icon" class="fa-solid fa-arrows-rotate"></i>
            </div>
        </div>
        <nav>
            <a href="#field-ops" class="nav-link">Hub</a>
            <a href="#sale" class="nav-link">Sale</a>
            <a href="#area" class="nav-link">Area</a>
            <a href="#coupon" class="nav-link">Coupon</a>
        </nav>
    </header>

    <div class="container">
        <a id="sale-banner" href="#">
            <div class="sale-content">
                <i id="sale-icon-type" class="fa-solid fa-crown"></i>
                <div class="sale-text" id="sale-banner-text">CHECKING...</div>
                <i class="fa-solid fa-chevron-right" style="font-size: 10px;"></i>
            </div>
        </a>

        <section id="field-ops">
            <div class="section-header"><div class="section-title">INTELLIGENCE HUB</div><div class="section-line"></div></div>
            </section>

        <section id="sale">
            <div class="section-header">
                <div class="section-title">PRIORITY SALES</div>
                <div class="section-line"></div>
            </div>

            <div class="sale-grid" id="priority-sale-grid">
                <a href="#" class="sale-card" id="card-rakuten">
                    <div class="brand-info">
                        <div class="brand-logo-circle brand-rakuten">R</div>
                        <div class="sale-info-text">
                            <div class="sale-name">楽天トラベル</div>
                            <div class="sale-disc" id="disc-rakuten">プラン一覧を見る</div>
                        </div>
                    </div>
                    <div class="sale-badge" id="badge-rakuten">CHECK</div>
                </a>
                <a href="#" class="sale-card" id="card-jalan">
                    <div class="brand-info">
                        <div class="brand-logo-circle brand-jalan">J</div>
                        <div class="sale-info-text">
                            <div class="sale-name">じゃらん</div>
                            <div class="sale-disc" id="disc-jalan">プラン一覧を見る</div>
                        </div>
                    </div>
                    <div class="sale-badge" id="badge-jalan">CHECK</div>
                </a>
                <a href="#" class="sale-card" id="card-ikyu">
                    <div class="brand-info">
                        <div class="brand-logo-circle brand-ikyu">一</div>
                        <div class="sale-info-text">
                            <div class="sale-name">一休.com</div>
                            <div class="sale-disc" id="disc-ikyu">プラン一覧を見る</div>
                        </div>
                    </div>
                    <div class="sale-badge" id="badge-ikyu">CHECK</div>
                </a>
            </div>
        </section>
    </div>

    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSYeo6mC85kmstRg6iJaxb7dgvy37mPo3knc09k0-82LZF_M5xaYRoRXbsUJig1CKldigIl03CT0Kww/pub?gid=0&single=true&output=csv";

        async function forceReloadData() {
            const btn = document.getElementById('refresh-btn');
            const icon = document.getElementById('refresh-icon');
            icon.classList.add('spin');
            try {
                const res = await fetch(CSV_URL + `&t=${new Date().getTime()}`);
                const text = await res.text();
                processCSVData(text);
                icon.className = "fa-solid fa-check";
                icon.classList.remove('spin');
                btn.classList.add('success');
                setTimeout(() => { icon.className = "fa-solid fa-arrows-rotate"; btn.classList.remove('success'); }, 2000);
            } catch (e) { icon.classList.remove('spin'); }
        }

        function processCSVData(text) {
            const rows = text.split('\n').slice(1).filter(r => r.trim());
            const now = new Date();
            const date = now.getDate();
            
            // バナーリセット
            const bannerS = document.getElementById('sale-banner');
            bannerS.style.display = 'none';
            let saleTopFound = false;

            // 各社カードの状態リセット
            const brands = {
                '楽天トラベル': { id: 'rakuten', active: false },
                'じゃらん': { id: 'jalan', active: false },
                '一休.com': { id: 'ikyu', active: false }
            };

            rows.forEach(line => {
                const cols = line.split('\t').map(c => c.trim()); // タブ区切り
                const [type, brand, title, start, end, url, direct, disc, fTxt] = cols;

                // EMERGENCY 判定 (省略)
                
                // SALE 判定 (カード用)
                if (type === 'SALE' && brands[brand]) {
                    const sDate = new Date(start);
                    const eDate = new Date(end);
                    if (now >= sDate && now <= eDate) {
                        brands[brand].active = true;
                        document.getElementById(`card-${brands[brand].id}`).href = url;
                        document.getElementById(`disc-${brands[brand].id}`).innerText = disc;
                        document.getElementById(`badge-${brands[brand].id}`).innerText = fTxt || 'SALE';
                        document.getElementById(`card-${brands[brand].id}`).classList.add('active-sale');
                    }
                }

                // SALE_TOP 判定 (最上部バナー用)
                if (type === 'SALE_TOP') {
                    const sDate = new Date(start);
                    const eDate = new Date(end);
                    if (now >= sDate && now <= eDate) {
                        showTopBanner('today', title, url);
                        saleTopFound = true;
                    }
                }
            });

            // 楽天5と0の日 (自動判定)
            if (!saleTopFound && [5, 10, 15, 20, 25, 30].includes(date)) {
                showTopBanner('rakuten', "楽天トラベル｜本日 5と0のつく日 ポイント4倍", "https://a.r10.to/rakuten50");
                // カード側も強調
                document.getElementById('card-rakuten').classList.add('active-sale');
                document.getElementById('badge-rakuten').innerText = 'P4倍';
            }
        }

        function showTopBanner(mode, title, url) {
            const bannerS = document.getElementById('sale-banner');
            const bannerText = document.getElementById('sale-banner-text');
            bannerS.style.display = 'block';
            bannerS.href = url;
            bannerS.className = mode === 'today' ? 'sale-today' : (mode === 'rakuten' ? 'sale-rakuten-day' : 'sale-preview');
            bannerText.innerText = title;
        }

        forceReloadData();
    </script>
</body>
</html>
