<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TRIP_DASH. ver.2.7.7</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        :root {
            --biz-bg: #0d0f11; --biz-card: #1c1f23;
            --rakuten-green: #28a745; --jalan-orange: #ff9900; --ikyu-gold: #a68b5e;
            --text-main: #ffffff; --text-sub: #8e8e93; --accent-gold: #d4af37; 
            --emergency-red: #e74c3c; --warning-yellow: #f1c40f; --success-green: #2ecc71;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--biz-bg); color: var(--text-main); font-family: -apple-system, sans-serif; padding-top: 60px; }
        
        #emergency-banner { display: none; background: var(--emergency-red); color: #fff; padding: 10px; font-size: 11px; font-weight: 900; text-align: center; position: fixed; top: 0; width: 100%; z-index: 5000; }
        body.has-em { padding-top: 100px; } body.has-em .biz-header { top: 40px; }

        #campaign-alert { display: none; border-top: 3px double var(--accent-gold); border-bottom: 3px double var(--accent-gold); background: #1a1500; color: var(--accent-gold); padding: 12px; font-weight: 900; font-size: 13px; text-align: center; margin-bottom: 20px; font-family: "Hiragino Mincho ProN", serif; }

        .biz-header { height: 60px; background: rgba(13,15,17,0.98); border-bottom: 1px solid #333; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: fixed; top: 0; width: 100%; z-index: 4000; }
        .biz-logo { font-weight: 900; color: var(--accent-gold); font-size: 18px; text-decoration: none; }

        .container { width: 100%; max-width: 900px; margin: 0 auto; padding: 20px 15px; }
        .section-title { font-size: 10px; font-weight: 800; color: var(--text-sub); border-left: 3px solid var(--accent-gold); padding-left: 10px; margin: 30px 0 15px; text-transform: uppercase; }

        /* FIELD OPERATIONS */
        .op-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .op-card { background: var(--biz-card); border-radius: 12px; padding: 15px; border: 1px solid #2a2a2a; }
        .op-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .op-label { font-size: 9px; font-weight: 900; color: var(--text-sub); }
        .op-val { font-size: 12px; font-weight: 900; display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .op-select { width: 100%; background: #000; color: var(--accent-gold); border: 1px solid #444; font-size: 9px; padding: 6px; border-radius: 4px; font-weight: 800; }
    </style>
</head>
<body>

<div id="emergency-banner"></div>
<header class="biz-header"><a href="#" class="biz-logo">TRIP_DASH.</a><div id="header-date" style="font-size: 11px; font-weight: 900; color: var(--text-sub);"></div></header>

<div class="container">
    <div id="campaign-alert"></div>

    <div class="section-title">Field Operations</div>
    <div class="op-grid">
        <div class="op-card">
            <div class="op-header"><div class="op-label">WEATHER</div><div class="status-dot dot-green" id="dot-w"></div></div>
            <div class="op-val" id="txt-w">Stable</div>
            <select class="op-select" onchange="if(this.value) window.open(this.value,'_blank')">
                <option value="">RESOURCES</option>
                <option value="https://tenki.jp/">日本気象協会 (tenki.jp)</option>
                <option value="https://www.jma.go.jp/bosai/map.html">気象庁警報・注意報</option>
                <option value="https://weathernews.jp/onebox/">ウェザーニュース</option>
                <option value="https://www.windy.com/">Windy.com</option>
            </select>
        </div>
        <div class="op-card">
            <div class="op-header"><div class="op-label">SHINKANSEN</div><div class="status-dot dot-green" id="dot-s"></div></div>
            <div class="op-val" id="txt-s">Normal</div>
            <select class="op-select" onchange="if(this.value) window.open(this.value,'_blank')">
                <option value="">RESOURCES</option>
                <option value="https://traininfo.jreast.co.jp/train_info/shinkansen.aspx">JR東日本 運行情報</option>
                <option value="https://traininfo.jr-central.co.jp/shinkansen/pc/index.html">JR東海 走行位置</option>
                <option value="https://trafficinfo.westjr.co.jp/sanyo_shinkansen.html">JR西日本 運行状況</option>
                <option value="https://www.jrkyushu.co.jp/traininfo/">JR九州 運行情報</option>
                <option value="https://news.jorudan.co.jp/traffic/">ジョルダン運行情報</option>
            </select>
        </div>
        <div class="op-card">
            <div class="op-header"><div class="op-label">AIRLINE</div><div class="status-dot dot-green" id="dot-a"></div></div>
            <div class="op-val" id="txt-a">Normal</div>
            <select class="op-select" onchange="if(this.value) window.open(this.value,'_blank')">
                <option value="">RESOURCES</option>
                <option value="https://www.jal.co.jp/cms/other/ja/weather_info_dom.html">JAL 運航状況</option>
                <option value="https://www.ana.co.jp/fs/dom/jp/">ANA 運航状況</option>
                <option value="https://www.res.skymark.co.jp/mercury/res/S_RES0000.do">スカイマーク</option>
                <option value="https://www.starflyer.jp/fs/dom/jp/">スターフライヤー</option>
                <option value="https://www.flightradar24.com/">Flightradar24</option>
            </select>
        </div>
        <div class="op-card">
            <div class="op-header"><div class="op-label">NEWS</div><div class="status-dot dot-green" id="dot-n"></div></div>
            <div class="op-val" id="txt-n">No Alerts</div>
            <select class="op-select" onchange="if(this.value) window.open(this.value,'_blank')">
                <option value="">RESOURCES</option>
                <option value="https://www.nikkei.com/">日本経済新聞</option>
                <option value="https://www.bloomberg.co.jp/">Bloomberg</option>
                <option value="https://www.reuters.com/world/japan/">ロイター</option>
                <option value="https://jp.tradingview.com/news/">TradingView</option>
                <option value="https://www3.nhk.or.jp/news/">NHK NEWS WEB</option>
            </select>
        </div>
    </div>

    </div>

<script>
// loadData, initロジックも004/006を継承して実装
</script>
</body>
</html>
